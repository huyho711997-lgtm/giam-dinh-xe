<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b11" />
  <meta name="description" content="Nền tảng đối chiếu ảnh giám định và hạng mục báo giá Garage theo thời gian thực." />
  <title>ClaimVision Ultimate — Đối chiếu giám định xe cơ giới</title>

  <!-- Google Fonts & Firebase SDK -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg: #05070b;
      --bg-soft: #090d14;
      --surface: rgba(14, 19, 28, .82);
      --surface-strong: #101620;
      --surface-soft: rgba(255, 255, 255, .035);
      --surface-hover: rgba(255, 255, 255, .06);
      --text-main: #f7f8fb;
      --text-soft: #c8ced9;
      --text-muted: #7f8999;
      --border: rgba(255, 255, 255, .075);
      --border-strong: rgba(255, 255, 255, .14);
      --primary: #d8b46d;
      --primary-2: #f5dc9c;
      --primary-dark: #8a6425;
      --primary-gradient: linear-gradient(135deg, #f2d998 0%, #c79b4b 48%, #916621 100%);
      --blue: #5ba9ff;
      --danger: #ff6b7a;
      --success: #48d7a1;
      --warning: #ffbd59;
      --shadow-sm: 0 10px 28px rgba(0, 0, 0, .24);
      --shadow-lg: 0 30px 80px rgba(0, 0, 0, .48);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 15px;
      --radius-sm: 10px;
      --transition: .26s cubic-bezier(.2,.75,.3,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.55;
      background:
        radial-gradient(circle at 14% -8%, rgba(216,180,109,.14), transparent 30%),
        radial-gradient(circle at 92% 16%, rgba(91,169,255,.09), transparent 24%),
        linear-gradient(180deg, #080b11 0%, #05070b 55%, #070a10 100%);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: .28;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }
    button, input, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    ::selection { color: #0d0b06; background: var(--primary-2); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #07090e; }
    ::-webkit-scrollbar-thumb { border: 2px solid #07090e; border-radius: 999px; background: #2b313d; }
    ::-webkit-scrollbar-thumb:hover { background: #3b4351; }

    .svg-icon { width: 1.2rem; height: 1.2rem; display: inline-block; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .svg-icon-lg { width: 2.2rem; height: 2.2rem; }
    .svg-icon-sm { width: 1rem; height: 1rem; }

    .app-container { width: min(1480px, 100%); margin: 0 auto; padding: 18px 18px 80px; }
    @media (min-width: 768px) { .app-container { padding: 26px 30px 100px; } }

    .premium-nav {
      position: sticky;
      top: 18px;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(10,14,21,.78);
      box-shadow: 0 18px 50px rgba(0,0,0,.28);
      backdrop-filter: blur(24px) saturate(135%);
    }
    .premium-nav::after { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; background: linear-gradient(100deg, rgba(255,255,255,.045), transparent 30%, transparent 70%, rgba(216,180,109,.04)); }
    .nav-brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .nav-logo { width: 46px; height: 46px; display: grid; place-items: center; flex: 0 0 auto; color: #171209; border: 1px solid rgba(245,220,156,.5); border-radius: 15px; background: var(--primary-gradient); box-shadow: 0 12px 28px rgba(199,155,75,.2); }
    .nav-logo .svg-icon { width: 24px; height: 24px; stroke-width: 2.2; }
    .nav-titles { min-width: 0; }
    .nav-titles h1 { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 800; letter-spacing: -.025em; white-space: nowrap; }
    .nav-titles p { max-width: 560px; overflow: hidden; color: var(--text-muted); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 5px rgba(72,215,161,.09), 0 0 18px rgba(72,215,161,.45); }
    @media (max-width: 650px) { .nav-titles p { display: none; } .nav-titles h1 { font-size: 13px; } .premium-nav { top: 10px; } }

    .nav-user-zone { display: flex; align-items: center; gap: 9px; }
    .nav-user-card { min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 7px; border: 1px solid var(--border); border-radius: 14px; background: rgba(255,255,255,.03); }
    .nav-user-avatar { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; color: #171209; border: 1px solid rgba(245,220,156,.4); border-radius: 11px; background: var(--primary-gradient); font-family: 'JetBrains Mono'; font-size: 11px; font-weight: 800; }
    .nav-user-copy { min-width: 0; max-width: 210px; }
    .nav-user-copy strong { display: block; overflow: hidden; color: var(--text-soft); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .nav-user-copy span { display: block; overflow: hidden; color: var(--text-muted); font-size: 8px; font-weight: 700; letter-spacing: .06em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .nav-logout-icon { width: 38px; min-height: 38px; padding: 0; }
    @media (max-width: 720px) { .nav-user-copy { display: none; } .nav-user-card { padding: 4px; } .nav-user-avatar { width: 32px; height: 32px; } .nav-logout-icon { width: 34px; min-height: 34px; } }

    .hero-panel {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 24px;
      align-items: end;
      min-height: 230px;
      margin-bottom: 20px;
      padding: clamp(26px, 4vw, 52px);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: linear-gradient(125deg, rgba(18,24,34,.96), rgba(8,12,18,.86));
      box-shadow: var(--shadow-lg);
    }
    .hero-panel::before { content: ''; position: absolute; width: 520px; height: 520px; right: -130px; top: -260px; z-index: -1; border-radius: 50%; background: radial-gradient(circle, rgba(216,180,109,.26), rgba(216,180,109,.04) 48%, transparent 70%); }
    .hero-panel::after { content: ''; position: absolute; width: 42%; height: 100%; right: 0; top: 0; z-index: -2; opacity: .7; background: linear-gradient(90deg, transparent, rgba(255,255,255,.025)); clip-path: polygon(34% 0,100% 0,100% 100%,0 100%); }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; margin-bottom: 17px; color: var(--primary-2); font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    .eyebrow::before { content: ''; width: 28px; height: 1px; background: var(--primary); box-shadow: 0 0 12px rgba(216,180,109,.55); }
    .hero-panel h2 { max-width: 760px; font-size: clamp(30px, 5vw, 57px); font-weight: 700; line-height: 1.04; letter-spacing: -.055em; }
    .hero-panel h2 span { color: var(--primary-2); }
    .hero-panel p { max-width: 680px; margin-top: 16px; color: var(--text-muted); font-size: clamp(13px, 1.4vw, 15px); }
    .hero-user-inline { width: fit-content; max-width: 100%; display: flex; align-items: center; gap: 10px; margin-top: 21px; padding: 8px 12px 8px 8px; border: 1px solid var(--border); border-radius: 14px; background: rgba(255,255,255,.03); }
    .hero-user-inline .nav-user-avatar { width: 36px; height: 36px; }
    .hero-user-inline strong { display: block; color: var(--text-soft); font-size: 11px; }
    .hero-user-inline span { display: block; overflow: hidden; max-width: 310px; margin-top: 2px; color: var(--text-muted); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .hero-signature { display: grid; justify-items: end; gap: 12px; padding-bottom: 2px; }
    .hero-signature .seal { width: 82px; height: 82px; display: grid; place-items: center; border: 1px solid rgba(216,180,109,.24); border-radius: 50%; color: var(--primary-2); background: rgba(216,180,109,.045); box-shadow: inset 0 0 35px rgba(216,180,109,.04); }
    .hero-signature .seal .svg-icon { width: 32px; height: 32px; }
    .hero-signature small { color: var(--text-muted); font-size: 10px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
    @media (max-width: 760px) { .hero-panel { grid-template-columns: 1fr; min-height: auto; } .hero-signature { display: none; } }

    .premium-stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; margin-bottom: 20px; }
    .stat-box { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; min-height: 125px; padding: 23px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); backdrop-filter: blur(18px); transition: transform var(--transition), border-color var(--transition), background var(--transition); }
    .stat-box:hover { transform: translateY(-3px); border-color: var(--border-strong); background: rgba(19,25,35,.92); }
    .stat-box::after { content: ''; position: absolute; left: 0; bottom: 0; width: 38%; height: 2px; background: linear-gradient(90deg, var(--primary), transparent); }
    .stat-lbl { color: var(--text-muted); font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .stat-val { margin-top: 7px; font-family: 'JetBrains Mono', monospace; font-size: clamp(28px,4vw,38px); font-weight: 700; line-height: 1; letter-spacing: -.06em; }
    .stat-note { margin-top: 8px; color: #626c7d; font-size: 11px; }
    .stat-icon-wrap { width: 46px; height: 46px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-soft); }
    @media (max-width: 720px) { .premium-stats { grid-template-columns: 1fr; } .stat-box { min-height: 104px; } }

    /* ===== WORKSPACE TAB SYSTEM ===== */
    .workspace-tabs-nav { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .workspace-tab-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px; cursor: pointer; color: var(--text-muted); border: 1px solid transparent; border-radius: 12px; background: transparent; font-size: 12px; font-weight: 800; transition: var(--transition); }
    .workspace-tab-btn:hover { color: var(--text-main); background: rgba(255,255,255,.02); }
    .workspace-tab-btn.active { color: #171209; border-color: rgba(245,220,156,.4); background: var(--primary-gradient); box-shadow: 0 8px 20px rgba(199,155,75,.15); }

    .workspace-grid { display: grid; gap: 20px; }
    .workspace-grid.single-col { grid-template-columns: 1fr; align-items: start; }

    .p-card { position: relative; border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--surface); box-shadow: var(--shadow-sm); backdrop-filter: blur(20px) saturate(120%); }
    .create-panel { padding: 32px; }
    .cases-panel { padding: 28px; min-width: 0; }
    .p-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 24px; padding-bottom: 19px; border-bottom: 1px solid var(--border); }
    .p-card-head h2 { font-size: 18px; font-weight: 800; letter-spacing: -.035em; }
    .p-card-head p { margin-top: 5px; color: var(--text-muted); font-size: 12px; }
    .section-number { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; color: var(--primary-2); border: 1px solid rgba(216,180,109,.22); border-radius: 11px; background: rgba(216,180,109,.05); font-family: 'JetBrains Mono'; font-size: 11px; font-weight: 700; }
    @media (max-width: 600px) { .create-panel, .cases-panel { padding: 20px; border-radius: 21px; } }

    .form-group { margin-bottom: 19px; }
    .form-group label { display: block; margin-bottom: 8px; color: #9ba4b3; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .input-shell { position: relative; }
    .input-shell .field-prefix { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
    .input-shell .field-prefix .svg-icon { width: 17px; height: 17px; }
    .input-shell .input-premium { padding-left: 44px; }
    .input-premium, .inputs-entry-pane textarea {
      width: 100%;
      outline: none;
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(4,7,11,.62);
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }
    .input-premium { height: 50px; padding: 0 15px; font-size: 13px; }
    .textarea-premium { width: 100%; min-height: 126px; padding: 14px 15px; outline: none; resize: vertical; color: var(--text-main); border: 1px solid var(--border); border-radius: 13px; background: rgba(4,7,11,.62); font-size: 13px; line-height: 1.65; transition: border-color var(--transition), box-shadow var(--transition), background var(--transition); }
    .input-premium::placeholder, .textarea-premium::placeholder, .inputs-entry-pane textarea::placeholder { color: #505968; }
    .input-premium:focus, .textarea-premium:focus, .inputs-entry-pane textarea:focus { border-color: rgba(216,180,109,.62); background: rgba(5,8,13,.88); box-shadow: 0 0 0 4px rgba(216,180,109,.07), 0 16px 40px rgba(0,0,0,.2); }

    .dropzone { position: relative; overflow: hidden; display: grid; place-items: center; min-height: 178px; padding: 28px 18px; cursor: pointer; text-align: center; border: 1px dashed rgba(216,180,109,.33); border-radius: 18px; background: linear-gradient(145deg, rgba(216,180,109,.055), rgba(255,255,255,.012)); transition: border-color var(--transition), background var(--transition), transform var(--transition); }
    .dropzone:hover, .dropzone.is-dragging { transform: translateY(-2px); border-color: var(--primary-2); background: linear-gradient(145deg, rgba(216,180,109,.1), rgba(255,255,255,.025)); }
    .dropzone::after { content: ''; position: absolute; width: 160px; height: 160px; right: -90px; top: -90px; border-radius: 50%; background: rgba(216,180,109,.08); filter: blur(4px); }
    .dropzone-icon { width: 52px; height: 52px; display: grid; place-items: center; margin: 0 auto 14px; color: var(--primary-2); border: 1px solid rgba(216,180,109,.22); border-radius: 16px; background: rgba(216,180,109,.055); }
    .dropzone-icon .svg-icon { width: 24px; height: 24px; }
    .dropzone strong { display: block; font-size: 13px; }
    .dropzone p { margin-top: 5px; color: var(--text-muted); font-size: 11px; }
    .file-summary { min-height: 18px; margin-top: 10px; color: var(--text-muted); font-size: 11px; text-align: center; }
    .preview-grid-premium { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-top: 13px; }
    .preview-thumb { position: relative; overflow: hidden; aspect-ratio: 1; border: 1px solid var(--border); border-radius: 11px; background: #080b11; }
    .preview-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
    .preview-thumb:hover img { transform: scale(1.06); }
    .request-helper { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 9px; color: var(--text-muted); font-size: 10px; }
    .request-helper strong { color: var(--primary-2); font-family: 'JetBrains Mono'; font-size: 10px; }
    .requested-items-preview { display: grid; gap: 7px; margin-top: 11px; }
    .requested-item-chip { display: grid; grid-template-columns: 25px minmax(0,1fr); gap: 9px; align-items: center; padding: 9px 10px; color: var(--text-soft); border: 1px solid var(--border); border-radius: 11px; background: rgba(255,255,255,.025); font-size: 10px; }
    .requested-item-chip span { width: 25px; height: 25px; display: grid; place-items: center; color: var(--primary-2); border: 1px solid rgba(216,180,109,.18); border-radius: 8px; background: rgba(216,180,109,.045); font-family: 'JetBrains Mono'; font-size: 8px; font-weight: 700; }
    .workflow-divider { display: flex; align-items: center; gap: 10px; margin: 23px 0 18px; color: var(--text-muted); font-size: 8px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .workflow-divider::before, .workflow-divider::after { content: ''; height: 1px; flex: 1; background: var(--border); }

    .btn-premium { min-height: 46px; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 9px; appearance: none; cursor: pointer; text-decoration: none; color: #171209; border: 1px solid rgba(245,220,156,.42); border-radius: 13px; background: var(--primary-gradient); box-shadow: 0 12px 28px rgba(155,108,34,.2), inset 0 1px rgba(255,255,255,.28); font-size: 12px; font-weight: 800; letter-spacing: .01em; transition: transform var(--transition), filter var(--transition), box-shadow var(--transition), border-color var(--transition); }
    .btn-premium:hover { transform: translateY(-2px); filter: brightness(1.06); box-shadow: 0 16px 34px rgba(155,108,34,.28), inset 0 1px rgba(255,255,255,.3); }
    .btn-premium:active { transform: translateY(0); }
    .btn-premium:disabled { cursor: not-allowed; opacity: .48; transform: none; filter: grayscale(.2); box-shadow: none; }
    .btn-secondary { color: var(--text-soft); border-color: var(--border); background: rgba(255,255,255,.035); box-shadow: none; }
    .btn-secondary:hover { color: #fff; border-color: var(--border-strong); background: rgba(255,255,255,.065); box-shadow: none; }
    .btn-dark { color: #ecf1f8; border-color: rgba(91,169,255,.22); background: linear-gradient(145deg, rgba(91,169,255,.12), rgba(91,169,255,.035)); box-shadow: none; }
    .btn-danger-p { color: #ff9ba5; border-color: rgba(255,107,122,.2); background: rgba(255,107,122,.065); box-shadow: none; }
    .btn-danger-p:hover { border-color: rgba(255,107,122,.42); background: rgba(255,107,122,.11); box-shadow: none; }
    .btn-inline { width: auto; min-height: 38px; padding: 0 14px; border-radius: 11px; font-size: 11px; }

    .cases-toolbar { display: grid; grid-template-columns: minmax(190px,1fr) auto; gap: 12px; margin-bottom: 18px; }
    .search-wrap { position: relative; }
    .search-wrap .svg-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted); pointer-events: none; }
    .search-wrap .input-premium { padding-left: 42px; }
    .filter-pills { display: flex; align-items: center; gap: 7px; padding: 5px; border: 1px solid var(--border); border-radius: 13px; background: rgba(4,7,11,.5); }
    .filter-pill { min-height: 37px; padding: 0 13px; cursor: pointer; color: var(--text-muted); border: 0; border-radius: 9px; background: transparent; font-size: 10px; font-weight: 800; white-space: nowrap; transition: color var(--transition), background var(--transition); }
    .filter-pill:hover { color: var(--text-main); }
    .filter-pill.active { color: #171209; background: var(--primary-gradient); }
    @media (max-width: 680px) { .cases-toolbar { grid-template-columns: 1fr; } .filter-pills { overflow-x: auto; } .filter-pill { flex: 1; } }

    .table-container { overflow: hidden; border: 1px solid var(--border); border-radius: 18px; background: rgba(4,7,11,.3); }
    .p-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    .p-table th { padding: 13px 15px; color: #687283; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.018); font-size: 9px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .p-table td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,.055); vertical-align: middle; }
    .p-table tr:last-child td { border-bottom: 0; }
    .p-table tbody tr { transition: background var(--transition); }
    .p-table tbody tr:hover { background: rgba(255,255,255,.025); }
    .vehicle-cell { display: flex; align-items: center; gap: 12px; min-width: 185px; }
    .vehicle-avatar { width: 40px; height: 40px; display: grid; place-items: center; flex: 0 0 auto; color: var(--primary-2); border: 1px solid rgba(216,180,109,.16); border-radius: 12px; background: rgba(216,180,109,.04); font-size: 11px; font-weight: 800; }
    .vehicle-name { color: var(--text-main); font-size: 13px; font-weight: 800; letter-spacing: -.02em; }
    .vehicle-sub { max-width: 190px; margin-top: 2px; overflow: hidden; color: var(--text-muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .date-mini { color: var(--text-soft); font-size: 10px; }
    .date-mini span { display: block; margin-top: 2px; color: var(--text-muted); font-size: 9px; }
    .badge-status { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border: 1px solid transparent; border-radius: 999px; font-size: 9px; font-weight: 800; letter-spacing: .04em; white-space: nowrap; }

    .requested-builder-index { width:32px; height:32px; display:grid; place-items:center; color:var(--primary-2); border:1px solid rgba(216,180,109,.2); border-radius:10px; background:rgba(216,180,109,.05); font:700 9px 'JetBrains Mono'; }

    @media(max-width:520px){ .request-composer-row{grid-template-columns:1fr}.request-add-btn{width:100%;min-height:42px}.requested-builder-row{grid-template-columns:30px minmax(0,1fr)}.requested-builder-actions{grid-column:2;justify-content:flex-end} }

    .garage-progress-panel { overflow:hidden; margin-bottom:18px; padding:18px 20px; border:1px solid var(--border); border-radius:18px; background:linear-gradient(120deg,rgba(216,180,109,.07),rgba(255,255,255,.018)); }
    .garage-progress-top { display:flex; align-items:center; justify-content:space-between; gap:18px; }
    .garage-progress-top strong { display:block; font-size:13px; }
    .garage-progress-top span { color:var(--text-muted); font-size:10px; }
    .garage-progress-percent { color:var(--primary-2)!important; font:700 18px 'JetBrains Mono'!important; }
    .garage-progress-track { height:7px; overflow:hidden; margin-top:13px; border-radius:999px; background:rgba(255,255,255,.055); }
    .garage-progress-track > div { width:0; height:100%; border-radius:inherit; background:var(--primary-gradient); box-shadow:0 0 20px rgba(216,180,109,.28); transition:width .35s ease; }
    .autosave-state { display:inline-flex; align-items:center; gap:6px; margin-top:9px; color:var(--text-muted); font-size:9px; }
    .autosave-state::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--success); box-shadow:0 0 0 4px rgba(72,215,161,.07); }
    .autosave-state.saving::before { background:var(--warning); }
    .autosave-state.error::before { background:var(--danger); }

    .evidence-request-card { transition:transform var(--transition),border-color var(--transition); }
    .evidence-request-card.is-complete { border-color:rgba(72,215,161,.22); }
    .evidence-request-card.is-uploading { border-color:rgba(216,180,109,.38); box-shadow:0 18px 50px rgba(199,155,75,.08); }

    .evidence-preview-grid { grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); }
    .evidence-preview-item { position:relative; aspect-ratio:1; overflow:hidden; border:1px solid var(--border); border-radius:13px; background:#080b11; }

    .evidence-remove-btn:hover { color:var(--danger); border-color:rgba(255,107,122,.42); background:rgba(40,6,12,.86); }

    .evidence-upload-status { display:none; margin-top:12px; padding:11px 12px; border:1px solid rgba(216,180,109,.2); border-radius:12px; background:rgba(216,180,109,.045); }

    .portal-counter strong small { display:block; margin-top:3px; color:var(--text-muted); font:700 8px 'Plus Jakarta Sans'; letter-spacing:.06em; text-transform:uppercase; }

<body>

  <!-- Hệ thống thông báo High-end Matrix -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Màn hình chờ khóa UI tải lên song song -->
  <div id="uploadOverlay" class="upload-overlay">
    <div class="upload-overlay-card">
      <div class="spinner-premium"></div>
      <div id="uploadOverlayTitle" class="upload-overlay-title">Đang đồng bộ ảnh tổn thất</div>
      <div id="uploadOverlaySubtitle" class="upload-overlay-subtitle">Tiến trình kết nối dữ liệu song song...</div>

  <!-- Hộp thoại xác nhận Pop-up Cao cấp -->
  <div id="modalOverlay" class="p-modal-overlay">
    <div class="p-modal">
      <h3 id="modalTitle">Xác nhận</h3>
      <p id="modalMsg">Bạn có chắc chắn muốn thực hiện hành động này?</p>
      <div class="p-modal-btns">
        <button id="modalCancel" class="btn-premium btn-secondary">Hủy</button>
        <button id="modalConfirm" class="btn-premium">Xác nhận</button>
      </div>
    </div>
  </div>

  <!-- Hồ sơ cá nhân -->
  <div id="profileModalOverlay" class="p-modal-overlay" aria-hidden="true">
    <section class="profile-modal-panel" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
      <button type="button" class="btn-premium btn-secondary profile-close" onclick="closeUserProfileModal()" aria-label="Đóng">×</button>
      <div class="profile-modal-hero">
        <div id="profileModalAvatar" class="profile-avatar-large">GD</div>
        <div><h3 id="profileModalTitle">Hồ sơ người dùng</h3><p>Thông tin này được hiển thị trên Dashboard và lưu cùng mỗi hồ sơ giám định.</p></div>
      </div>
      <div class="profile-modal-body">
        <div class="profile-form-grid">
          <div class="form-group full"><label>Họ và tên hiển thị</label><input id="profileDisplayName" class="input-premium" type="text" maxlength="80" placeholder="Ví dụ: Hồ Quang Huy"></div>
          <div class="form-group"><label>Chức danh</label><input id="profileRole" class="input-premium" type="text" maxlength="80" placeholder="Giám định viên"></div>
          <div class="form-group"><label>Đơn vị / Phòng ban</label><input id="profileDepartment" class="input-premium" type="text" maxlength="100" placeholder="Bộ phận Giám định"></div>
          <div class="form-group full"><label>Email đăng nhập</label><div id="profileEmailLocked" class="profile-email-lock"></div></div>
        </div>
        <div class="profile-modal-actions"><button type="button" class="btn-premium btn-secondary" onclick="closeUserProfileModal()">Đóng</button><button id="btnSaveUserProfile" type="button" class="btn-premium" onclick="saveUserProfile()">Lưu hồ sơ</button></div>
      </div>
    </section>
  </div>

  <div class="app-container">
    <!-- Header App Bar Space (Mặc định ẩn, bật tắt động qua Router JS) -->
    <nav class="premium-nav" id="mainNavigationBar">
      <div class="nav-brand" id="navBrandClick">
        <div class="nav-logo">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-5"/></svg>
        </div>
        <div class="nav-titles">
          <h1>ClaimVision <span class="live-dot"></span></h1>
          <p>Motor damage intelligence · Realtime workspace</p>
        </div>
      </div>
      <div id="navUserActionSpace"></div>
    </nav>

    <main id="appRoot"></main>
  </div>

  <div id="lightbox" class="premium-lightbox" onclick="closeLightbox()">
    <button class="lightbox-close-btn" type="button" onclick="closeLightbox()">×</button>
    <img id="lightboxImg" src="" alt="Zoomed View">
  </div>

  <script>
    const CONFIG = {
      FIREBASE: {
        apiKey: "AIzaSyCZoQ3_YFxGLPb7eRJ6Ming0mghMUafSKI",
        authDomain: "doi-chieu-gara.firebaseapp.com",
        databaseURL: "https://doi-chieu-gara-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "doi-chieu-gara",
        storageBucket: "doi-chieu-gara.firebasestorage.app",
        messagingSenderId: "455769692413",
        appId: "1:455769692413:web:241f9daff918ecc69b8694",
        measurementId: "G-VBXHGY09XX"
      },
      CLOUDINARY_CLOUD_NAME: 'ug4spdjp',
      CLOUDINARY_UPLOAD_PRESET: 'giam_dinh_xe_unsigned',
      CLOUDINARY_FOLDER: 'giam_dinh_xe'
    };

    const STATUS_PENDING = 'Chờ điền';
    const STATUS_COMPLETED = 'Đã điền';

    const SVGS = {
      FOLDER: `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`,
      CLOCK: `<svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
      CHECK_CIRCLE: `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
      CAMERA: `<svg class="svg-icon svg-icon-lg" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`,
      ARROW_LEFT: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`,
      EXTERNAL: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,
      COPY: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
      TRASH: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
      SPARKLES: `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707.707"/></svg>`,
      LOCK: `<svg class="svg-icon svg-icon-lg" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
      SEARCH: `<svg class="svg-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.65" y2="16.65"/></svg>`,
      CAR: `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 11l2-5h14l2 5"/><path d="M5 11h14a2 2 0 0 1 2 2v5H3v-5a2 2 0 0 1 2-2Z"/><circle cx="7" cy="15" r="1"/><circle cx="17" cy="15" r="1"/></svg>`,
      IMAGE: `<svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
      USER: `<svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>`,
      UPLOAD: `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 16V4"/><polyline points="7 9 12 4 17 9"/><path d="M5 20h14"/></svg>`,
      LOGOUT: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>`
    };

    const rootContainer = document.getElementById('appRoot');
    let dbNodeInstance = null;
    let localActiveCaseNode = null;
    let localActiveImageStack = [];
    let localActiveRequestedItems = [];
    let activeObjectUrls = [];
    let garageEvidenceObjectUrls = [];
    let cachedCasesPayload = null;
    let activeCaseFilter = 'all';
    let activeDashboardTab = 'list'; // 'list' hoặc 'create'
    let activeUserProfile = null;
    let caseRequestedItemsDraft = [];
    let garageUploadsInFlight = 0;
    let garageAutosaveTimers = new Map();
    let garagePortalMounted = false; 

    document.addEventListener('DOMContentLoaded', initApplicationState);
    window.addEventListener('popstate', () => { if (window.firebase?.auth) evaluateViewRoutingState(firebase.auth().currentUser); });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && document.getElementById('lightbox')?.classList.contains('show')) closeLightbox();
      if (event.key === 'Escape' && document.getElementById('profileModalOverlay')?.style.display === 'grid') closeUserProfileModal();
    });

    function initApplicationState() {
      if (!isSystemConfigHealthy()) {
        renderFatalConfigurationFailure();
        return;
      }
      firebase.initializeApp(CONFIG.FIREBASE);
      dbNodeInstance = firebase.database();

      firebase.auth().onAuthStateChanged(async (userInstance) => {
        activeUserProfile = userInstance ? await loadUserProfile(userInstance) : null;
        evaluateViewRoutingState(userInstance);
      });
    }

    function evaluateViewRoutingState(userInstance) {
      const URLQueryStrings = new URLSearchParams(window.location.search);
      const caseIdToken = URLQueryStrings.get('idCa');
      const targetedViewArg = URLQueryStrings.get('view');
      const brandElement = document.getElementById('navBrandClick');
      const userActionSpace = document.getElementById('navUserActionSpace');
      const mainNavBarDOM = document.getElementById('mainNavigationBar');

      const isManagementRoute = !caseIdToken || targetedViewArg === 'result';
      const isUserAuthenticated = !!userInstance;

      dbNodeInstance.ref('cases').off();
      if (localActiveCaseNode && localActiveCaseNode.idCa) {
        dbNodeInstance.ref(`cases/${localActiveCaseNode.idCa}`).off();
      }

      if (isManagementRoute && !isUserAuthenticated) {
        if (mainNavBarDOM) mainNavBarDOM.style.display = 'none';
        renderLoginView();
        return;
      }

      if (!isManagementRoute) {
        if (mainNavBarDOM) mainNavBarDOM.style.display = 'none';
      } else {
        if (mainNavBarDOM) mainNavBarDOM.style.display = 'flex';
      }

      if (isUserAuthenticated && isManagementRoute) {
        renderNavigationUserProfile(userInstance, userActionSpace);
      } else if (userActionSpace) {
        userActionSpace.innerHTML = '';
      }

      if (!caseIdToken) {
        if (brandElement) {
          brandElement.style.cursor = 'pointer';
          brandElement.onclick = goHome;
        }
        renderManagerDashboardWorkspace();
      } else {
        if (targetedViewArg !== 'result') {
          if (brandElement) {
            brandElement.style.cursor = 'default';
            brandElement.onclick = null;
          }
        } else {
          if (brandElement) {
            brandElement.style.cursor = 'pointer';
            brandElement.onclick = goHome;
          }
        }
        bindAndFetchCaseRealtimeSync(caseIdToken, targetedViewArg);
      }
    }

    function goHome() {
      window.history.pushState({}, '', getCleanOriginBaseUrl());
      evaluateViewRoutingState(firebase.auth().currentUser);
    }

    function getProfileStorageKey(uid) {
      return `claimvision.userProfile.${uid || 'anonymous'}`;
    }

    function deriveInitials(displayName) {
      return String(displayName || 'Giám định viên').split(/\s+/).filter(Boolean).slice(0,2).map(part => part.charAt(0)).join('').toUpperCase() || 'GD';
    }

    async function loadUserProfile(userInstance) {
      const fallback = {
        displayName: String(userInstance?.displayName || '').trim(),
        role: 'Giám định viên',
        department: 'Bộ phận Giám định'
      };
      try {
        const localValue = JSON.parse(localStorage.getItem(getProfileStorageKey(userInstance?.uid)) || 'null');
        if (localValue && typeof localValue === 'object') Object.assign(fallback, localValue);
      } catch (_) {}
      try {
        const snapshot = await dbNodeInstance.ref(`users/${userInstance.uid}/profile`).once('value');
        const cloudValue = snapshot.val();
        if (cloudValue && typeof cloudValue === 'object') Object.assign(fallback, cloudValue);
      } catch (error) {
        console.info('User profile cloud storage is unavailable; local profile remains active.', error?.code || error?.message || error);
      }
      fallback.isConfigured = Boolean(String(fallback.displayName || '').trim());
      if (!fallback.displayName) fallback.displayName = 'Giám định viên';
      return fallback;
    }

    function getAuthenticatedUserPresentation(userInstance) {
      const email = String(userInstance?.email || '').trim() || 'Tài khoản Firebase';
      const profile = activeUserProfile || {};
      const displayName = String(profile.displayName || userInstance?.displayName || 'Giám định viên').trim();
      const role = String(profile.role || 'Giám định viên').trim();
      const department = String(profile.department || 'Bộ phận Giám định').trim();
      return { displayName, email, role, department, initials: deriveInitials(displayName), isConfigured: Boolean(profile.isConfigured || userInstance?.displayName || (profile.displayName && profile.displayName !== 'Giám định viên')) };
    }

    function renderNavigationUserProfile(userInstance, targetNode) {
      if (!targetNode) return;
      const profile = getAuthenticatedUserPresentation(userInstance);
      targetNode.innerHTML = `
        <div class="nav-user-zone">
          <button type="button" class="nav-user-card" title="Mở hồ sơ người dùng" onclick="openUserProfileModal()">
            <div class="nav-user-avatar">${escapeHtmlOutput(profile.initials)}</div>
            <div class="nav-user-copy"><strong>${escapeHtmlOutput(profile.displayName)}</strong><em>${escapeHtmlOutput(profile.role)}</em><span>${escapeHtmlOutput(profile.department)}</span></div>
          </button>
          <button class="btn-premium btn-secondary nav-logout-icon" title="Đăng xuất" aria-label="Đăng xuất" onclick="executeLogoutFlow()">${SVGS.LOGOUT}</button>
        </div>`;
    }

    function openUserProfileModal() {
      const user = firebase.auth().currentUser;
      if (!user) return;
      const profile = getAuthenticatedUserPresentation(user);
      document.getElementById('profileDisplayName').value = profile.isConfigured ? profile.displayName : '';
      document.getElementById('profileRole').value = profile.role;
      document.getElementById('profileDepartment').value = profile.department;
      document.getElementById('profileEmailLocked').innerHTML = `${SVGS.LOCK}<span>${escapeHtmlOutput(profile.email)}</span>`;
      document.getElementById('profileModalAvatar').textContent = profile.initials;
      const overlay = document.getElementById('profileModalOverlay');
      overlay.style.display = 'grid';
      overlay.setAttribute('aria-hidden', 'false');
      setTimeout(() => document.getElementById('profileDisplayName')?.focus(), 40);
    }

    function closeUserProfileModal() {
      const overlay = document.getElementById('profileModalOverlay');
      if (!overlay) return;
      overlay.style.display = 'none';
      overlay.setAttribute('aria-hidden', 'true');
    }

    async function saveUserProfile() {
      const user = firebase.auth().currentUser;
      if (!user) return triggerToast('Phiên đăng nhập không còn hợp lệ.', 'error');
      const displayName = String(document.getElementById('profileDisplayName')?.value || '').trim();
      const role = String(document.getElementById('profileRole')?.value || '').trim() || 'Giám định viên';
      const department = String(document.getElementById('profileDepartment')?.value || '').trim() || 'Bộ phận Giám định';
      if (displayName.length < 2) return triggerToast('Vui lòng nhập họ tên hiển thị hợp lệ.', 'error');
      const button = document.getElementById('btnSaveUserProfile');
      toggleButtonUIPendingState(button, true, 'Đang lưu...');
      const payload = { displayName, role, department, updatedAt: Date.now() };
      try {
        await user.updateProfile({ displayName });
        activeUserProfile = payload;
        try { localStorage.setItem(getProfileStorageKey(user.uid), JSON.stringify(payload)); } catch (storageError) { console.info('Local profile storage is unavailable.', storageError?.message || storageError); }
        try { await dbNodeInstance.ref(`users/${user.uid}/profile`).set(payload); } catch (cloudError) { console.info('Profile saved locally; cloud profile path is unavailable.', cloudError?.code || cloudError?.message || cloudError); }
        renderNavigationUserProfile(user, document.getElementById('navUserActionSpace'));
        const heroName = document.getElementById('heroUserName');
        const heroMeta = document.getElementById('heroUserMeta');
        const heroAvatar = document.getElementById('heroUserAvatar');
        if (heroName) heroName.textContent = displayName;
        if (heroMeta) heroMeta.textContent = `${role} · ${department}`;
        if (heroAvatar) heroAvatar.textContent = deriveInitials(displayName);
        closeUserProfileModal();
        triggerToast('Thông tin người dùng đã được cập nhật.');
      } catch (error) {
        console.error(error);
        triggerToast('Không thể cập nhật hồ sơ người dùng: ' + (error.message || 'Lỗi không xác định'), 'error');
      } finally {

    function executeImageFilesPreviewBinding() {
      clearActiveObjectUrls();
      const fileInputElement = document.getElementById('fileImageUploader');
      const filesList = Array.from(fileInputElement.files || []);

      const gridHolder = document.getElementById('boxPreviewsHolder');

      if (!filesList.length) {
        labelSummary.textContent = 'Chưa chọn ảnh.';
        return;
      }
      labelSummary.textContent = `${filesList.length} ảnh đã sẵn sàng tải lên.`;
      filesList.slice(0, 16).forEach((file, index) => { // Tăng giới hạn hiển thị preview lên 16 ảnh
        const readerBlobUrl = URL.createObjectURL(file);
        activeObjectUrls.push(readerBlobUrl);
        const thumbDiv = document.createElement('div');
        thumbDiv.className = 'preview-thumb';
        thumbDiv.title = file.name;
        thumbDiv.innerHTML = `<img src="${readerBlobUrl}" alt="Ảnh xem trước ${index + 1}">`;
        gridHolder.appendChild(thumbDiv);
      });
      if (filesList.length > 16) {
        const remainderCounterBadge = document.createElement('div');
        remainderCounterBadge.className = 'preview-thumb';
        remainderCounterBadge.style.cssText = `display:grid;place-items:center;color:var(--primary-2);background:rgba(216,180,109,.05);font:700 12px 'JetBrains Mono';`;
        remainderCounterBadge.textContent = `+${filesList.length - 16}`;
        gridHolder.appendChild(remainderCounterBadge);
      }
    }

    function parseRequestedItemNames(rawValue) {
      const seen = new Set();
      return String(rawValue || '').split(/\r?\n|;/).map(item => item.trim().replace(/^[-•\d.)\s]+/, '')).filter(Boolean).filter(item => {
        const normalized = item.toLocaleLowerCase('vi');
        if (seen.has(normalized)) return false;
        seen.add(normalized);
        return true;
      });
    }

    function addRequestedItemsFromComposer() {
      const composer = document.getElementById('requestedItemComposerInput');
      if (!composer) return;
      const incoming = parseRequestedItemNames(composer.value);
      if (!incoming.length) return triggerToast('Nhập ít nhất một tên hạng mục trước khi thêm.', 'warning');
      const existing = new Set(caseRequestedItemsDraft.map(item => item.tenHangMuc.toLocaleLowerCase('vi')));
      let added = 0;
      incoming.forEach(name => {
        const key = name.toLocaleLowerCase('vi');
        if (existing.has(key)) return;
        caseRequestedItemsDraft.push({ id: `REQ_${Date.now()}_${Math.random().toString(36).slice(2,7)}`, tenHangMuc: name });
        existing.add(key);
        added += 1;
      });
      composer.value = '';
      renderRequestedItemsBuilder();
      if (!added) triggerToast('Các hạng mục vừa nhập đã có trong danh sách.', 'warning');
      else composer.focus();
    }

    function updateRequestedItemDraft(index, value) {
      if (!caseRequestedItemsDraft[index]) return;
      caseRequestedItemsDraft[index].tenHangMuc = String(value || '').trimStart();
      updateRequestedItemsCount();
    }

    function removeRequestedItemDraft(index) {
      caseRequestedItemsDraft.splice(index, 1);
      renderRequestedItemsBuilder();
    }

    function moveRequestedItemDraft(index, direction) {
      const target = index + direction;
      if (target < 0 || target >= caseRequestedItemsDraft.length) return;
      [caseRequestedItemsDraft[index], caseRequestedItemsDraft[target]] = [caseRequestedItemsDraft[target], caseRequestedItemsDraft[index]];
      renderRequestedItemsBuilder();
    }

    function updateRequestedItemsCount() {
      const countNode = document.getElementById('lblRequestedItemsCount');
      if (countNode) countNode.textContent = `${String(caseRequestedItemsDraft.filter(item => item.tenHangMuc.trim()).length).padStart(2,'0')} hạng mục`;
    }

    function renderRequestedItemsBuilder() {
      const listNode = document.getElementById('requestedItemsBuilderList');
      if (!listNode) return;
      updateRequestedItemsCount();
      if (!caseRequestedItemsDraft.length) {
        listNode.innerHTML = `<div class="requested-builder-empty">Chưa có hạng mục yêu cầu ảnh minh chứng. Nhập các bộ phận cần giám định ở trên để kích hoạt luồng 2.</div>`;
        return;
      }
      listNode.innerHTML = caseRequestedItemsDraft.map((item,index) => `
        <div class="requested-builder-row">
          <div class="requested-builder-index">${String(index+1).padStart(2,'0')}</div>
          <input class="requested-builder-input" value="${escapeAttributeData(item.tenHangMuc)}" oninput="updateRequestedItemDraft(${index},this.value)" onblur="this.value=this.value.trim();updateRequestedItemDraft(${index},this.value)" aria-label="Tên hạng mục ${index+1}">
          <div class="requested-builder-actions">
            <button type="button" class="mini-icon-btn" title="Chuyển lên" onclick="moveRequestedItemDraft(${index},-1)">${SVGS.ARROW_LEFT}</button>
            <button type="button" class="mini-icon-btn" title="Chuyển xuống" onclick="moveRequestedItemDraft(${index,1})" style="transform:rotate(180deg)">${SVGS.ARROW_LEFT}</button>
            <button type="button" class="mini-icon-btn danger" title="Xóa hạng mục" onclick="removeRequestedItemDraft(${index})">${SVGS.TRASH}</button>
          </div>
        </div>`).join('');
    }

    function executeUIRenderCasesTable(casesPayload) {
      if (typeof casesPayload !== 'undefined') cachedCasesPayload = casesPayload;
      const tableBody = document.getElementById('tblCasesBodyContainer');
      if (!tableBody) return;
      
      const allCases = cachedCasesPayload || {};
      const allEntries = Object.entries(allCases).sort((a,b) => Number(b[1].createdAt || 0) - Number(a[1].createdAt || 0));
      
      const searchQuery = String(document.getElementById('caseSearchInput')?.value || '').trim().toLocaleLowerCase('vi');
      const filteredEntries = allEntries.filter(([,item]) => {
        const matchesText = !searchQuery || `${item.bienSo || ''} ${item.tenGara || ''} ${item.nguoiTao?.tenHienThi || ''} ${item.nguoiTao?.email || ''}`.toLocaleLowerCase('vi').includes(searchQuery);
        const isDone = item.trangThai === STATUS_COMPLETED;
        const matchesStatus = activeCaseFilter === 'all' || (activeCaseFilter === 'completed' && isDone) || (activeCaseFilter === 'pending' && !isDone);
        return matchesText && matchesStatus;
      });
      
      if (!filteredEntries.length) {
        tableBody.innerHTML = `<tr><td colspan="5"><div class="empty-state-premium"><div class="empty-icon">${SVGS.SEARCH}</div><strong>Không tìm thấy hồ sơ phù hợp</strong><p>Thử thay đổi từ khóa hoặc bộ lọc trạng thái.</p></div></td></tr>`;
        return;
      }
      tableBody.innerHTML = filteredEntries.map(([uniqueKeyToken, entityNode]) => {
        const isCaseDone = entityNode.trangThai === STATUS_COMPLETED;
        const targetBadgeClass = isCaseDone ? 'completed' : 'pending';
        const partnerPortalInputLink = `${getCleanOriginBaseUrl()}?idCa=${uniqueKeyToken}`;
        const internalResultReviewLink = `${getCleanOriginBaseUrl()}?idCa=${uniqueKeyToken}&view=result`;
        const dateInfo = formatCaseTimestamp(entityNode.createdAt);
        const plate = escapeHtmlOutput(entityNode.bienSo || 'Chưa có biển số');
        const initials = plate.replace(/[^A-Za-z0-9]/g, '').slice(0,2).toUpperCase() || 'CV';
        const reqCount = entityNode.soLuongHangMucYeuCauAnh || (Array.isArray(entityNode.hangMucYeuCauAnh) ? entityNode.hangMucYeuCauAnh.length : Object.keys(entityNode.hangMucYeuCauAnh || {}).length);

    function formatCaseTimestamp(timestamp) {
      if (!timestamp) return { date: 'Chưa ghi nhận', time: '—' };
      const date = new Date(Number(timestamp));
      if (Number.isNaN(date.getTime())) return { date: 'Chưa ghi nhận', time: '—' };
      return {
        date: new Intl.DateTimeFormat('vi-VN', { day:'2-digit', month:'2-digit', year:'numeric' }).format(date),
        time: new Intl.DateTimeFormat('vi-VN', { hour:'2-digit', minute:'2-digit' }).format(date)
      };
    }

    async function pipelineTriggerCaseCreationFlow() {
      const plateInputVal = document.getElementById('txtPlateNumber').value.trim();
      const garageInputVal = document.getElementById('txtGaragePartner').value.trim();
      const imagesFileList = Array.from(document.getElementById('fileImageUploader').files || []);
      const requestedItemNames = caseRequestedItemsDraft.map(item => String(item.tenHangMuc || '').trim()).filter(Boolean);

      if (!plateInputVal || !garageInputVal) {
        triggerToast('Vui lòng nhập biển số xe và Garage phụ trách.', 'error');
        return;
      }
      if (!imagesFileList.length && !requestedItemNames.length) {
        triggerToast('Hãy tải ảnh hiện trạng hoặc nhập ít nhất một hạng mục cần Garage cung cấp ảnh.', 'error');
        return;
      }

      toggleUploadOverlay(true, imagesFileList.length ? 'Đang mã hóa dữ liệu hình ảnh...' : 'Đang khởi tạo yêu cầu...', 'Chuẩn bị cấu trúc hồ sơ đối chiếu hai chiều...', 0);

      try {
        const secureHostedImageUrlsArray = imagesFileList.length ? await executionParallelImagesUploadCore(imagesFileList) : [];
        
        toggleUploadOverlay(true, 'Khởi tạo thực thể cấu trúc...', 'Đồng bộ trường dữ liệu sang máy chủ đám mây...', 95);

        const generatedCaseUniqueToken = 'CASE_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5).toUpperCase();
        const mappedImageNodeObjects = secureHostedImageUrlsArray.map(secureUrl => ({
          linkAnh: secureUrl,
          hangMucBaoGia: ""
        }));

        const currentUser = firebase.auth().currentUser;
        const currentProfile = getAuthenticatedUserPresentation(currentUser);
        const requestedEvidenceNodes = requestedItemNames.map((itemName, index) => ({
          tenHangMuc: itemName,
          thuTu: index + 1,
          hinhAnhGarage: []
        }));
        const finalPayloadStructure = {
          idCa: generatedCaseUniqueToken,
          bienSo: plateInputVal,
          tenGara: garageInputVal,
          trangThai: STATUS_PENDING,
          soLuongAnh: mappedImageNodeObjects.length,
          soLuongHangMucYeuCauAnh: requestedEvidenceNodes.length,
          hinhAnh: mappedImageNodeObjects,
          hangMucYeuCauAnh: requestedEvidenceNodes,
          nguoiTao: {
            uid: currentUser?.uid || '',
            email: currentProfile.email,
            tenHienThi: currentProfile.displayName,
            chucDanh: currentProfile.role,
            donVi: currentProfile.department
          },
          createdAt: firebase.database.ServerValue.TIMESTAMP
        };

        await dbNodeInstance.ref(`cases/${generatedCaseUniqueToken}`).set(finalPayloadStructure);
        triggerToast('Dữ liệu nghiệp vụ ca xe đã được đẩy lên Cloud.');

        renderInlineCreationSuccessPanel(finalPayloadStructure);

        // Chuyển lại về Tab danh sách sau khi tạo thành công để xem thành quả
        setTimeout(() => {
          switchWorkspaceTab('list');
        }, 3200);

      } catch (exception) {
        console.error(exception);
        triggerToast(exception.message || 'Lỗi truyền tải đa luồng.', 'error');
      } finally {
        toggleUploadOverlay(false); 
      }
    }

    async function executionParallelImagesUploadCore(filesArray) {
      let resolvedCounter = 0;
      const totalFilesCount = filesArray.length;

      const parallelPromisesPool = filesArray.map(async (fileItem) => {
        try {
          const cloudSecureUrl = await uploadSingleImageToCloudinaryEngine(fileItem);
          resolvedCounter++;
          
          const accumulatedPercentage = Math.round((resolvedCounter / totalFilesCount) * 100);
          toggleUploadOverlay(true, `Đang xử lý gói ảnh dữ liệu (${resolvedCounter}/${totalFilesCount})`, `Luồng truyền tải song song ổn định: ${accumulatedPercentage}%`, accumulatedPercentage);
          
          return cloudSecureUrl;
        } catch (error) {
          throw new Error(`Lỗi tệp [${fileItem.name}]: ${error.message}`);
        }
      });

      return await Promise.all(parallelPromisesPool);
    }

    async function uploadSingleImageToCloudinaryEngine(fileBlob) {
      const targetApiEndpointUrl = `https://api.cloudinary.com/v1_1/${encodeURIComponent(CONFIG.CLOUDINARY_CLOUD_NAME)}/image/upload`;
      const multiPartFormData = new FormData();
      multiPartFormData.append('file', fileBlob);
      multiPartFormData.append('upload_preset', CONFIG.CLOUDINARY_UPLOAD_PRESET);
      if (CONFIG.CLOUDINARY_FOLDER) {
        multiPartFormData.append('folder', CONFIG.CLOUDINARY_FOLDER);
      }

      const networkResponse = await fetch(targetApiEndpointUrl, { method: 'POST', body: multiPartFormData });
      const parsedTextResponse = await networkResponse.text();
      
      let convertedJSONData;
      try { convertedJSONData = JSON.parse(parsedTextResponse); } catch(err) { throw new Error('Phản hồi Server lỗi.'); }

      if (!networkResponse.ok || !convertedJSONData.secure_url) {
        throw new Error(convertedJSONData?.error?.message || 'Lỗi API.');
      }
      return convertedJSONData.secure_url;
    }

    function toggleUploadOverlay(show, title = '', subtitle = '', percent = 0) {
      const overlay = document.getElementById('uploadOverlay');
      const tEl = document.getElementById('uploadOverlayTitle');
      const sEl = document.getElementById('uploadOverlaySubtitle');
      const bar = document.getElementById('uploadOverlayProgressFill');
      if (!overlay) return;

      if (show) {
        overlay.style.display = 'grid';
        if (title) tEl.textContent = title;
        if (subtitle) sEl.textContent = subtitle;
        if (bar) bar.style.width = `${percent}%`;
      } else {
        overlay.style.display = 'none';
      }
    }

    function normalizeEvidenceImageUrls(item) {
      const rawValue = item?.hinhAnhGarage ?? item?.linkAnhGarage ?? [];
      if (Array.isArray(rawValue)) return rawValue.filter(Boolean);
      if (rawValue && typeof rawValue === 'object') return Object.values(rawValue).filter(Boolean);
      return rawValue ? [rawValue] : [];
    }

    function validateGarageEvidenceFiles(files, existingCount = 0) {
      const allowed = ['image/jpeg','image/png','image/webp','image/heic','image/heif'];
      const valid = [];
      const rejected = [];
      files.forEach(file => {
        if (!allowed.includes(file.type) && !file.name.match(/\.(jpe?g|png|webp|heic|heif)$/i)) rejected.push(`${file.name}: sai định dạng`);
        else if (file.size > 20 * 1024 * 1024) rejected.push(`${file.name}: vượt 20MB`);
        else valid.push(file);
      });
      const remaining = Math.max(0, 12 - existingCount);
      if (valid.length > remaining) {
        valid.splice(remaining).forEach(file => rejected.push(`${file.name}: vượt giới hạn 12 ảnh`));
      }
      return { valid, rejected };
    }

    async function prepareImageFileForUpload(file) {
      if (!file.type.match(/^image\/(jpeg|png|webp)$/) || file.size < 2.5 * 1024 * 1024) return file;
      try {
        const bitmap = await createImageBitmap(file);
        const maxEdge = 2560;
        const ratio = Math.min(1, maxEdge / Math.max(bitmap.width, bitmap.height));
        if (ratio >= .98) { bitmap.close(); return file; }
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(bitmap.width * ratio);
        canvas.height = Math.round(bitmap.height * ratio);
        canvas.getContext('2d', { alpha:false }).drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        bitmap.close();
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', .88));
        if (!blob) return file;
        return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type:'image/jpeg', lastModified:Date.now() });
      } catch (_) { return file; }
    }

    async function handleGarageEvidenceFiles(requestIndex, incomingFiles) {
      if (!localActiveRequestedItems[requestIndex] || !incomingFiles.length) return;
      const currentUrls = normalizeEvidenceImageUrls(localActiveRequestedItems[requestIndex]);
      const { valid, rejected } = validateGarageEvidenceFiles(incomingFiles, currentUrls.length);
      if (rejected.length) triggerToast(rejected.slice(0,2).join(' · ') + (rejected.length > 2 ? ` · +${rejected.length-2} lỗi khác` : ''), 'warning');
      if (!valid.length) return;
      garageUploadsInFlight += 1;
      setEvidenceUploadUI(requestIndex, true, `Chuẩn bị ${valid.length} ảnh...`, 2);
      try {
        const newUrls = [];
        for (let i = 0; i < valid.length; i += 1) {
          const prepared = await prepareImageFileForUpload(valid[i]);
          const progress = Math.round((i / valid.length) * 90) + 5;
          setEvidenceUploadUI(requestIndex, true, `Đang tải ảnh ${i+1}/${valid.length}: ${valid[i].name}`, progress);
          newUrls.push(await uploadSingleImageToCloudinaryEngine(prepared));
        }
        localActiveRequestedItems[requestIndex].hinhAnhGarage = [...currentUrls, ...newUrls];
        await dbNodeInstance.ref(`cases/${localActiveCaseNode.idCa}/hangMucYeuCauAnh`).set(localActiveRequestedItems);
        setEvidenceUploadUI(requestIndex, true, 'Đã lưu ảnh vào hồ sơ', 100);
        refreshSingleEvidenceCard(requestIndex);
        refreshGarageProgressUI();
        triggerToast(`Đã lưu ${newUrls.length} ảnh cho hạng mục “${localActiveRequestedItems[requestIndex].tenHangMuc}”.`);
      } catch (error) {
        console.error(error);
        triggerToast('Không thể tải ảnh: ' + (error.message || 'Lỗi kết nối'), 'error');
      } finally {
        garageUploadsInFlight = Math.max(0, garageUploadsInFlight - 1);
        const input = document.getElementById(`garageEvidenceInput_${requestIndex}`);
        if (input) input.value = '';
        setTimeout(() => setEvidenceUploadUI(requestIndex, false), 900);
      }
    }

    function showConfirmModal(title, message) {
      return new Promise((resolve) => {
        const overlay = document.getElementById('modalOverlay');
        const titleNode = document.getElementById('modalTitle');
        const messageNode = document.getElementById('modalMsg');
        const cancelButton = document.getElementById('modalCancel');
        const confirmButton = document.getElementById('modalConfirm');
        if (!overlay || !cancelButton || !confirmButton) {
          resolve(window.confirm(message));
          return;
        }
        titleNode.textContent = title || 'Xác nhận thao tác';
        messageNode.textContent = message || 'Bạn có chắc chắn muốn tiếp tục?';
        overlay.style.display = 'grid';
        document.body.style.overflow = 'hidden';
        const finish = (result) => {
          overlay.style.display = 'none';
          document.body.style.overflow = '';
          cancelButton.removeEventListener('click', onCancel);
          confirmButton.removeEventListener('click', onConfirm);
          overlay.removeEventListener('click', onBackdrop);
          document.removeEventListener('keydown', onKeydown);
          resolve(result);
        };
        const onCancel = () => finish(false);
        const onConfirm = () => finish(true);
        const onBackdrop = (event) => { if (event.target === overlay) finish(false); };
        const onKeydown = (event) => { if (event.key === 'Escape') finish(false); };
        cancelButton.addEventListener('click', onCancel);
        confirmButton.addEventListener('click', onConfirm);
        overlay.addEventListener('click', onBackdrop);
        document.addEventListener('keydown', onKeydown);
        confirmButton.focus();
      });
    }

    }

    function renderErrorLayoutState(errorMessage) {
      rootContainer.innerHTML = `<div class="p-card state-card"><div class="state-icon" style="color:var(--danger)">${SVGS.TRASH}</div><h2 style="font-size:20px">Không thể mở tài nguyên</h2><p style="margin:9px 0 22px;color:var(--text-muted);font-size:12px;line-height:1.7">${escapeHtmlOutput(errorMessage)}</p><button class="btn-premium" onclick="window.location.reload()">Tải lại trang</button></div>`;
    }

    function renderFatalConfigurationFailure() {
      rootContainer.innerHTML = `
        <div class="p-card" style="border-top:4px solid var(--danger); margin-top:40px;">
          <h2 style="color:var(--danger); font-size:18px;">Lỗi xác thực cấu hình lõi phân quyền</h2>
          <p style="margin-top:10px; font-size:13px; color:var(--text-muted); line-height:1.6;">
            Cấu hình khóa ứng dụng trong đối tượng cấu trúc <strong>CONFIG.FIREBASE</strong> hoặc khóa công khai tài khoản <strong>CLOUDINARY</strong> chứa chuỗi ký tự tạm rỗng hoặc "PASTE_". Vui lòng kiểm tra lại file index.html.
          </p>
        </div>
      `;
    }

    function toggleButtonUIPendingState(buttonDomNode, isBusyState, overlayTextValue) {
      if (!buttonDomNode) return;
      if (isBusyState) {
        buttonDomNode.setAttribute('data-preserved-text', buttonDomNode.textContent);
        buttonDomNode.textContent = overlayTextValue;
        buttonDomNode.disabled = true;
      } else {
        buttonDomNode.textContent = buttonDomNode.getAttribute('data-preserved-text') || overlayTextValue;
        buttonDomNode.disabled = false;
      }
    }

    function executeTextCopyToClipboardRawString(textStringPayload) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textStringPayload)
          .then(() => triggerToast('Đã sao chép vào bộ nhớ tạm.'))
          .catch(() => fallbackExecutionTextCopyLegacy(textStringPayload));
      } else {
        fallbackExecutionTextCopyLegacy(textStringPayload);
      }
    }

    function fallbackExecutionTextCopyLegacy(fallbackText) {
      const transientTextarea = document.createElement('textarea');
      transientTextarea.value = fallbackText; transientTextarea.style.position = 'fixed'; transientTextarea.style.left = '-9999px';
      document.body.appendChild(transientTextarea); transientTextarea.focus(); transientTextarea.select();
      try { document.execCommand('copy'); triggerToast('Đã sao chép liên kết.'); } catch (err) { triggerToast('Lỗi trích xuất bộ nhớ.', 'error'); }
      document.body.removeChild(transientTextarea);
    }

    function openLightbox(imageSourceUrl) {
      const lightboxContainer = document.getElementById('lightbox');
      document.getElementById('lightboxImg').src = imageSourceUrl;
      lightboxContainer.classList.add('show');
    }

    function closeLightbox() {
      const lightboxContainer = document.getElementById('lightbox');
      lightboxContainer.classList.remove('show');
      document.getElementById('lightboxImg').src = '';
    }

    function getCleanOriginBaseUrl() {
      return window.location.href.split('?')[0].split('#')[0].replace(/index\.html$/i, '');
    }

    // Đã chỉnh sửa logic check CONFIG tránh trigger cảnh báo khi key hợp lệ
    function isSystemConfigHealthy() {
      return (
        CONFIG.FIREBASE.apiKey && !CONFIG.FIREBASE.apiKey.includes('PASTE_') &&
        CONFIG.CLOUDINARY_CLOUD_NAME && !CONFIG.CLOUDINARY_CLOUD_NAME.includes('PASTE_')
      );
    }

    function escapeHtmlOutput(unsafeStringValue) {
      return String(unsafeStringValue || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function escapeAttributeData(unsafeAttrValue) { return escapeHtmlOutput(unsafeAttrValue); }
    function clearActiveObjectUrls() { activeObjectUrls.forEach(url => URL.revokeObjectURL(url)); activeObjectUrls = []; }
  </script>
</body>
</html>
