<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b11" />
  <meta name="description" content="Nền tảng đối chiếu ảnh giám định và hạng mục báo giá Garage theo thời gian thực." />
  <title>ClaimVision — Đối chiếu giám định xe cơ giới</title>

  <!-- Google Fonts & Firebase SDK -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg: #05070b;
      --bg-soft: #090d14;
      --surface: rgba(14, 19, 28, .82);
      --surface-strong: #101620;
      --surface-soft: rgba(255, 255, 255, .035);
      --surface-hover: rgba(255, 255, 255, .06);
      --text-main: #f7f8fb;
      --text-soft: #c8ced9;
      --text-muted: #7f8999;
      --border: rgba(255, 255, 255, .075);
      --border-strong: rgba(255, 255, 255, .14);
      --primary: #d8b46d;
      --primary-2: #f5dc9c;
      --primary-dark: #8a6425;
      --primary-gradient: linear-gradient(135deg, #f2d998 0%, #c79b4b 48%, #916621 100%);
      --blue: #5ba9ff;
      --danger: #ff6b7a;
      --success: #48d7a1;
      --warning: #ffbd59;
      --shadow-sm: 0 10px 28px rgba(0, 0, 0, .24);
      --shadow-lg: 0 30px 80px rgba(0, 0, 0, .48);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 15px;
      --radius-sm: 10px;
      --transition: .26s cubic-bezier(.2,.75,.3,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.55;
      background:
        radial-gradient(circle at 14% -8%, rgba(216,180,109,.14), transparent 30%),
        radial-gradient(circle at 92% 16%, rgba(91,169,255,.09), transparent 24%),
        linear-gradient(180deg, #080b11 0%, #05070b 55%, #070a10 100%);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: .28;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }
    button, input, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    ::selection { color: #0d0b06; background: var(--primary-2); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #07090e; }
    ::-webkit-scrollbar-thumb { border: 2px solid #07090e; border-radius: 999px; background: #2b313d; }
    ::-webkit-scrollbar-thumb:hover { background: #3b4351; }

    .svg-icon { width: 1.2rem; height: 1.2rem; display: inline-block; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .svg-icon-lg { width: 2.2rem; height: 2.2rem; }
    .svg-icon-sm { width: 1rem; height: 1rem; }

    .app-container { width: min(1480px, 100%); margin: 0 auto; padding: 18px 18px 80px; }
    @media (min-width: 768px) { .app-container { padding: 26px 30px 100px; } }

    .premium-nav {
      position: sticky;
      top: 18px;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(10,14,21,.78);
      box-shadow: 0 18px 50px rgba(0,0,0,.28);
      backdrop-filter: blur(24px) saturate(135%);
    }
    .premium-nav::after { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; background: linear-gradient(100deg, rgba(255,255,255,.045), transparent 30%, transparent 70%, rgba(216,180,109,.04)); }
    .nav-brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .nav-logo { width: 46px; height: 46px; display: grid; place-items: center; flex: 0 0 auto; color: #171209; border: 1px solid rgba(245,220,156,.5); border-radius: 15px; background: var(--primary-gradient); box-shadow: 0 12px 28px rgba(199,155,75,.2); }
    .nav-logo .svg-icon { width: 24px; height: 24px; stroke-width: 2.2; }
    .nav-titles { min-width: 0; }
    .nav-titles h1 { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 800; letter-spacing: -.025em; white-space: nowrap; }
    .nav-titles p { max-width: 560px; overflow: hidden; color: var(--text-muted); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 5px rgba(72,215,161,.09), 0 0 18px rgba(72,215,161,.45); }
    @media (max-width: 650px) { .nav-titles p { display: none; } .nav-titles h1 { font-size: 13px; } .premium-nav { top: 10px; } }

    .nav-user-zone { display: flex; align-items: center; gap: 9px; }
    .nav-user-card { min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 7px; border: 1px solid var(--border); border-radius: 14px; background: rgba(255,255,255,.03); }
    .nav-user-avatar { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; color: #171209; border: 1px solid rgba(245,220,156,.4); border-radius: 11px; background: var(--primary-gradient); font-family: 'JetBrains Mono'; font-size: 11px; font-weight: 800; }
    .nav-user-copy { min-width: 0; max-width: 210px; }
    .nav-user-copy strong { display: block; overflow: hidden; color: var(--text-soft); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .nav-user-copy span { display: block; overflow: hidden; color: var(--text-muted); font-size: 8px; font-weight: 700; letter-spacing: .06em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .nav-logout-icon { width: 38px; min-height: 38px; padding: 0; }
    @media (max-width: 720px) { .nav-user-copy { display: none; } .nav-user-card { padding: 4px; } .nav-user-avatar { width: 32px; height: 32px; } .nav-logout-icon { width: 34px; min-height: 34px; } }

    .hero-panel {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 24px;
      align-items: end;
      min-height: 230px;
      margin-bottom: 20px;
      padding: clamp(26px, 4vw, 52px);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: linear-gradient(125deg, rgba(18,24,34,.96), rgba(8,12,18,.86));
      box-shadow: var(--shadow-lg);
    }
    .hero-panel::before { content: ''; position: absolute; width: 520px; height: 520px; right: -130px; top: -260px; z-index: -1; border-radius: 50%; background: radial-gradient(circle, rgba(216,180,109,.26), rgba(216,180,109,.04) 48%, transparent 70%); }
    .hero-panel::after { content: ''; position: absolute; width: 42%; height: 100%; right: 0; top: 0; z-index: -2; opacity: .7; background: linear-gradient(90deg, transparent, rgba(255,255,255,.025)); clip-path: polygon(34% 0,100% 0,100% 100%,0 100%); }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; margin-bottom: 17px; color: var(--primary-2); font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    .eyebrow::before { content: ''; width: 28px; height: 1px; background: var(--primary); box-shadow: 0 0 12px rgba(216,180,109,.55); }
    .hero-panel h2 { max-width: 760px; font-size: clamp(30px, 5vw, 57px); font-weight: 700; line-height: 1.04; letter-spacing: -.055em; }
    .hero-panel h2 span { color: var(--primary-2); }
    .hero-panel p { max-width: 680px; margin-top: 16px; color: var(--text-muted); font-size: clamp(13px, 1.4vw, 15px); }
    .hero-user-inline { width: fit-content; max-width: 100%; display: flex; align-items: center; gap: 10px; margin-top: 21px; padding: 8px 12px 8px 8px; border: 1px solid var(--border); border-radius: 14px; background: rgba(255,255,255,.03); }
    .hero-user-inline .nav-user-avatar { width: 36px; height: 36px; }
    .hero-user-inline strong { display: block; color: var(--text-soft); font-size: 11px; }
    .hero-user-inline span { display: block; overflow: hidden; max-width: 310px; margin-top: 2px; color: var(--text-muted); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .hero-signature { display: grid; justify-items: end; gap: 12px; padding-bottom: 2px; }
    .hero-signature .seal { width: 82px; height: 82px; display: grid; place-items: center; border: 1px solid rgba(216,180,109,.24); border-radius: 50%; color: var(--primary-2); background: rgba(216,180,109,.045); box-shadow: inset 0 0 35px rgba(216,180,109,.04); }
    .hero-signature .seal .svg-icon { width: 32px; height: 32px; }
    .hero-signature small { color: var(--text-muted); font-size: 10px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
    @media (max-width: 760px) { .hero-panel { grid-template-columns: 1fr; min-height: auto; } .hero-signature { display: none; } }

    .premium-stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; margin-bottom: 20px; }
    .stat-box { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; min-height: 125px; padding: 23px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); backdrop-filter: blur(18px); transition: transform var(--transition), border-color var(--transition), background var(--transition); }
    .stat-box:hover { transform: translateY(-3px); border-color: var(--border-strong); background: rgba(19,25,35,.92); }
    .stat-box::after { content: ''; position: absolute; left: 0; bottom: 0; width: 38%; height: 2px; background: linear-gradient(90deg, var(--primary), transparent); }
    .stat-lbl { color: var(--text-muted); font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .stat-val { margin-top: 7px; font-family: 'JetBrains Mono', monospace; font-size: clamp(28px,4vw,38px); font-weight: 700; line-height: 1; letter-spacing: -.06em; }
    .stat-note { margin-top: 8px; color: #626c7d; font-size: 11px; }
    .stat-icon-wrap { width: 46px; height: 46px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-soft); }
    @media (max-width: 720px) { .premium-stats { grid-template-columns: 1fr; } .stat-box { min-height: 104px; } }

    .workspace-grid { display: grid; gap: 20px; }
    .workspace-grid.two-cols { grid-template-columns: minmax(330px, .72fr) minmax(0, 1.55fr); align-items: start; }
    @media (max-width: 1080px) { .workspace-grid.two-cols { grid-template-columns: 1fr; } }

    .p-card { position: relative; border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--surface); box-shadow: var(--shadow-sm); backdrop-filter: blur(20px) saturate(120%); }
    .create-panel { position: sticky; top: 105px; padding: 28px; }
    .cases-panel { padding: 28px; min-width: 0; }
    .p-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 24px; padding-bottom: 19px; border-bottom: 1px solid var(--border); }
    .p-card-head h2 { font-size: 18px; font-weight: 800; letter-spacing: -.035em; }
    .p-card-head p { margin-top: 5px; color: var(--text-muted); font-size: 12px; }
    .section-number { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; color: var(--primary-2); border: 1px solid rgba(216,180,109,.22); border-radius: 11px; background: rgba(216,180,109,.05); font-family: 'JetBrains Mono'; font-size: 11px; font-weight: 700; }
    @media (max-width: 1080px) { .create-panel { position: static; } }
    @media (max-width: 600px) { .create-panel, .cases-panel { padding: 20px; border-radius: 21px; } }

    .form-group { margin-bottom: 19px; }
    .form-group label { display: block; margin-bottom: 8px; color: #9ba4b3; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .input-shell { position: relative; }
    .input-shell .field-prefix { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
    .input-shell .field-prefix .svg-icon { width: 17px; height: 17px; }
    .input-shell .input-premium { padding-left: 44px; }
    .input-premium, .inputs-entry-pane textarea {
      width: 100%;
      outline: none;
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(4,7,11,.62);
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }
    .input-premium { height: 50px; padding: 0 15px; font-size: 13px; }
    .textarea-premium { width: 100%; min-height: 126px; padding: 14px 15px; outline: none; resize: vertical; color: var(--text-main); border: 1px solid var(--border); border-radius: 13px; background: rgba(4,7,11,.62); font-size: 13px; line-height: 1.65; transition: border-color var(--transition), box-shadow var(--transition), background var(--transition); }
    .input-premium::placeholder, .textarea-premium::placeholder, .inputs-entry-pane textarea::placeholder { color: #505968; }
    .input-premium:focus, .textarea-premium:focus, .inputs-entry-pane textarea:focus { border-color: rgba(216,180,109,.62); background: rgba(5,8,13,.88); box-shadow: 0 0 0 4px rgba(216,180,109,.07), 0 16px 40px rgba(0,0,0,.2); }

    .dropzone { position: relative; overflow: hidden; display: grid; place-items: center; min-height: 178px; padding: 28px 18px; cursor: pointer; text-align: center; border: 1px dashed rgba(216,180,109,.33); border-radius: 18px; background: linear-gradient(145deg, rgba(216,180,109,.055), rgba(255,255,255,.012)); transition: border-color var(--transition), background var(--transition), transform var(--transition); }
    .dropzone:hover, .dropzone.is-dragging { transform: translateY(-2px); border-color: var(--primary-2); background: linear-gradient(145deg, rgba(216,180,109,.1), rgba(255,255,255,.025)); }
    .dropzone::after { content: ''; position: absolute; width: 160px; height: 160px; right: -90px; top: -90px; border-radius: 50%; background: rgba(216,180,109,.08); filter: blur(4px); }
    .dropzone-icon { width: 52px; height: 52px; display: grid; place-items: center; margin: 0 auto 14px; color: var(--primary-2); border: 1px solid rgba(216,180,109,.22); border-radius: 16px; background: rgba(216,180,109,.055); }
    .dropzone-icon .svg-icon { width: 24px; height: 24px; }
    .dropzone strong { display: block; font-size: 13px; }
    .dropzone p { margin-top: 5px; color: var(--text-muted); font-size: 11px; }
    .file-summary { min-height: 18px; margin-top: 10px; color: var(--text-muted); font-size: 11px; text-align: center; }
    .preview-grid-premium { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-top: 13px; }
    .preview-thumb { position: relative; overflow: hidden; aspect-ratio: 1; border: 1px solid var(--border); border-radius: 11px; background: #080b11; }
    .preview-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
    .preview-thumb:hover img { transform: scale(1.06); }
    .request-helper { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 9px; color: var(--text-muted); font-size: 10px; }
    .request-helper strong { color: var(--primary-2); font-family: 'JetBrains Mono'; font-size: 10px; }
    .requested-items-preview { display: grid; gap: 7px; margin-top: 11px; }
    .requested-item-chip { display: grid; grid-template-columns: 25px minmax(0,1fr); gap: 9px; align-items: center; padding: 9px 10px; color: var(--text-soft); border: 1px solid var(--border); border-radius: 11px; background: rgba(255,255,255,.025); font-size: 10px; }
    .requested-item-chip span { width: 25px; height: 25px; display: grid; place-items: center; color: var(--primary-2); border: 1px solid rgba(216,180,109,.18); border-radius: 8px; background: rgba(216,180,109,.045); font-family: 'JetBrains Mono'; font-size: 8px; font-weight: 700; }
    .workflow-divider { display: flex; align-items: center; gap: 10px; margin: 23px 0 18px; color: var(--text-muted); font-size: 8px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .workflow-divider::before, .workflow-divider::after { content: ''; height: 1px; flex: 1; background: var(--border); }

    .btn-premium { min-height: 46px; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 9px; appearance: none; cursor: pointer; text-decoration: none; color: #171209; border: 1px solid rgba(245,220,156,.42); border-radius: 13px; background: var(--primary-gradient); box-shadow: 0 12px 28px rgba(155,108,34,.2), inset 0 1px rgba(255,255,255,.28); font-size: 12px; font-weight: 800; letter-spacing: .01em; transition: transform var(--transition), filter var(--transition), box-shadow var(--transition), border-color var(--transition); }
    .btn-premium:hover { transform: translateY(-2px); filter: brightness(1.06); box-shadow: 0 16px 34px rgba(155,108,34,.28), inset 0 1px rgba(255,255,255,.3); }
    .btn-premium:active { transform: translateY(0); }
    .btn-premium:disabled { cursor: not-allowed; opacity: .48; transform: none; filter: grayscale(.2); box-shadow: none; }
    .btn-secondary { color: var(--text-soft); border-color: var(--border); background: rgba(255,255,255,.035); box-shadow: none; }
    .btn-secondary:hover { color: #fff; border-color: var(--border-strong); background: rgba(255,255,255,.065); box-shadow: none; }
    .btn-dark { color: #ecf1f8; border-color: rgba(91,169,255,.22); background: linear-gradient(145deg, rgba(91,169,255,.12), rgba(91,169,255,.035)); box-shadow: none; }
    .btn-danger-p { color: #ff9ba5; border-color: rgba(255,107,122,.2); background: rgba(255,107,122,.065); box-shadow: none; }
    .btn-danger-p:hover { border-color: rgba(255,107,122,.42); background: rgba(255,107,122,.11); box-shadow: none; }
    .btn-inline { width: auto; min-height: 38px; padding: 0 14px; border-radius: 11px; font-size: 11px; }

    .cases-toolbar { display: grid; grid-template-columns: minmax(190px,1fr) auto; gap: 12px; margin-bottom: 18px; }
    .search-wrap { position: relative; }
    .search-wrap .svg-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted); pointer-events: none; }
    .search-wrap .input-premium { padding-left: 42px; }
    .filter-pills { display: flex; align-items: center; gap: 7px; padding: 5px; border: 1px solid var(--border); border-radius: 13px; background: rgba(4,7,11,.5); }
    .filter-pill { min-height: 37px; padding: 0 13px; cursor: pointer; color: var(--text-muted); border: 0; border-radius: 9px; background: transparent; font-size: 10px; font-weight: 800; white-space: nowrap; transition: color var(--transition), background var(--transition); }
    .filter-pill:hover { color: var(--text-main); }
    .filter-pill.active { color: #171209; background: var(--primary-gradient); }
    @media (max-width: 680px) { .cases-toolbar { grid-template-columns: 1fr; } .filter-pills { overflow-x: auto; } .filter-pill { flex: 1; } }

    .table-container { overflow: hidden; border: 1px solid var(--border); border-radius: 18px; background: rgba(4,7,11,.3); }
    .p-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    .p-table th { padding: 13px 15px; color: #687283; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.018); font-size: 9px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .p-table td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,.055); vertical-align: middle; }
    .p-table tr:last-child td { border-bottom: 0; }
    .p-table tbody tr { transition: background var(--transition); }
    .p-table tbody tr:hover { background: rgba(255,255,255,.025); }
    .vehicle-cell { display: flex; align-items: center; gap: 12px; min-width: 185px; }
    .vehicle-avatar { width: 40px; height: 40px; display: grid; place-items: center; flex: 0 0 auto; color: var(--primary-2); border: 1px solid rgba(216,180,109,.16); border-radius: 12px; background: rgba(216,180,109,.04); font-size: 11px; font-weight: 800; }
    .vehicle-name { color: var(--text-main); font-size: 13px; font-weight: 800; letter-spacing: -.02em; }
    .vehicle-sub { max-width: 190px; margin-top: 2px; overflow: hidden; color: var(--text-muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .date-mini { color: var(--text-soft); font-size: 10px; }
    .date-mini span { display: block; margin-top: 2px; color: var(--text-muted); font-size: 9px; }
    .badge-status { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border: 1px solid transparent; border-radius: 999px; font-size: 9px; font-weight: 800; letter-spacing: .04em; white-space: nowrap; }
    .badge-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
    .badge-status.pending { color: var(--warning); border-color: rgba(255,189,89,.18); background: rgba(255,189,89,.065); }
    .badge-status.completed { color: var(--success); border-color: rgba(72,215,161,.18); background: rgba(72,215,161,.065); }
    .flex-actions-group { display: flex; justify-content: flex-end; gap: 7px; }
    .flex-actions-group .btn-premium { width: 38px; min-height: 38px; padding: 0; }
    .flex-actions-group .btn-premium .action-label { display: none; }

    function initApplicationState() {
      if (!isSystemConfigHealthy()) {
        renderFatalConfigurationFailure();
        return;
      }
      firebase.initializeApp(CONFIG.FIREBASE);
      dbNodeInstance = firebase.database();

      firebase.auth().onAuthStateChanged((userInstance) => {
        evaluateViewRoutingState(userInstance);
      });

    // ĐA SỬA: Kiểm soát bật/tắt toàn diện thanh Navigation Bar tùy thuộc từng phân hệ
    function evaluateViewRoutingState(userInstance) {
      const URLQueryStrings = new URLSearchParams(window.location.search);
      const caseIdToken = URLQueryStrings.get('idCa');
      const targetedViewArg = URLQueryStrings.get('view');
      const brandElement = document.getElementById('navBrandClick');
      const userActionSpace = document.getElementById('navUserActionSpace');
      const mainNavBarDOM = document.getElementById('mainNavigationBar');

      const isManagementRoute = !caseIdToken || targetedViewArg === 'result';
      const isUserAuthenticated = !!userInstance;

      // Hủy kết nối stream cũ
      dbNodeInstance.ref('cases').off();
      if (localActiveCaseNode && localActiveCaseNode.idCa) {
        dbNodeInstance.ref(`cases/${localActiveCaseNode.idCa}`).off();
      }

      // 1. NẾU LÀ TRANG QUẢN LÝ MÀ CHƯA ĐĂNG NHẬP -> ẨN HẾT NAV BAR & BẬT KHÓA LOGIN GATE
      if (isManagementRoute && !isUserAuthenticated) {
        if (mainNavBarDOM) mainNavBarDOM.style.display = 'none'; // Ẩn hoàn toàn nav bar nhiễu thông tin
        renderLoginView();
        return;
      }

      // 2. NẾU LÀ CỔNG NHẬP LIỆU CỦA GARAGE -> ẨN NAV BAR ĐỂ CÔ LẬP TUYỆT ĐỐI HỆ THỐNG
      if (!isManagementRoute) {
        if (mainNavBarDOM) mainNavBarDOM.style.display = 'none'; // Ẩn để Gara không thấy thương hiệu và nút Đăng xuất
      } else {
        // Chỉ hiển thị Nav bar nếu là Giám định viên đã login hợp lệ
        if (mainNavBarDOM) mainNavBarDOM.style.display = 'flex';
      }

      // Hiển thị đầy đủ người dùng đang đăng nhập và thao tác đăng xuất
      if (isUserAuthenticated && isManagementRoute) {
        renderNavigationUserProfile(userInstance, userActionSpace);
      } else if (userActionSpace) {
        userActionSpace.innerHTML = '';
      }

      if (!caseIdToken) {
        if (brandElement) {
          brandElement.style.cursor = 'pointer';
          brandElement.onclick = goHome;
        }
        renderManagerDashboardWorkspace();
      } else {
        if (targetedViewArg !== 'result') {
          if (brandElement) {
            brandElement.style.cursor = 'default';
            brandElement.onclick = null;
          }
        } else {
          if (brandElement) {
            brandElement.style.cursor = 'pointer';
            brandElement.onclick = goHome;
          }
        }
        bindAndFetchCaseRealtimeSync(caseIdToken, targetedViewArg);
      }
    }

    function goHome() {
      window.history.pushState({}, '', getCleanOriginBaseUrl());
      evaluateViewRoutingState(firebase.auth().currentUser);
    }

    function getAuthenticatedUserPresentation(userInstance) {
      const email = String(userInstance?.email || '').trim();
      const fallbackName = email ? email.split('@')[0] : 'Giám định viên';
      const displayName = String(userInstance?.displayName || fallbackName || 'Giám định viên').trim();
      const initials = displayName.split(/\s+/).filter(Boolean).slice(0,2).map(part => part.charAt(0)).join('').toUpperCase() || 'GD';
      return { displayName, email: email || 'Tài khoản Firebase', initials };
    }

    function executeImageFilesPreviewBinding() {
      clearActiveObjectUrls();
      const fileInputElement = document.getElementById('fileImageUploader');
      const filesList = Array.from(fileInputElement.files || []);

      if (!filesList.length) {

        return;

      labelSummary.textContent = `${filesList.length} ảnh đã sẵn sàng tải lên.`;
      filesList.slice(0, 8).forEach((file, index) => {
        const readerBlobUrl = URL.createObjectURL(file);

        gridHolder.appendChild(thumbDiv);
      });
      if (filesList.length > 8) {
        const remainderCounterBadge = document.createElement('div');
        remainderCounterBadge.className = 'preview-thumb';
        remainderCounterBadge.style.cssText = `display:grid;place-items:center;color:var(--primary-2);background:rgba(216,180,109,.05);font:700 12px 'JetBrains Mono';`;
        remainderCounterBadge.textContent = `+${filesList.length - 8}`;
        gridHolder.appendChild(remainderCounterBadge);
      }
    }

    function parseRequestedItemNames(rawValue) {
      const seen = new Set();
      return String(rawValue || '').split(/\r?\n/).map(item => item.trim()).filter(Boolean).filter(item => {
        const normalized = item.toLocaleLowerCase('vi');
        if (seen.has(normalized)) return false;
        seen.add(normalized);
        return true;
      });
    }

    function renderRequestedItemsPreview() {
      const textarea = document.getElementById('txtRequestedItemNames');
      const countNode = document.getElementById('lblRequestedItemsCount');
      const previewNode = document.getElementById('requestedItemsPreview');
      if (!textarea || !countNode || !previewNode) return;
      const items = parseRequestedItemNames(textarea.value);
      countNode.textContent = `${String(items.length).padStart(2,'0')} hạng mục`;
      previewNode.innerHTML = items.slice(0,8).map((item,index) => `<div class="requested-item-chip"><span>${String(index+1).padStart(2,'0')}</span><div>${escapeHtmlOutput(item)}</div></div>`).join('');
      if (items.length > 8) previewNode.insertAdjacentHTML('beforeend', `<div class="requested-item-chip"><span>+</span><div>Còn ${items.length - 8} hạng mục khác</div></div>`);
    }

    function executeUIRenderCasesTable(casesPayload) {
      if (typeof casesPayload !== 'undefined') cachedCasesPayload = casesPayload;
      const tableBody = document.getElementById('tblCasesBodyContainer');
      const totalLbl = document.getElementById('lblTotalCases');
      const pendingLbl = document.getElementById('lblPendingCases');
      const completedLbl = document.getElementById('lblCompletedCases');
      if (!tableBody) return;
      const allCases = cachedCasesPayload || {};
      const allEntries = Object.entries(allCases).sort((a,b) => Number(b[1].createdAt || 0) - Number(a[1].createdAt || 0));
      const metricTotal = allEntries.length;
      const metricCompleted = allEntries.filter(([,item]) => item.trangThai === STATUS_COMPLETED).length;
      const metricPending = metricTotal - metricCompleted;
      totalLbl.textContent = metricTotal;
      pendingLbl.textContent = metricPending;
      completedLbl.textContent = metricCompleted;
      const searchQuery = String(document.getElementById('caseSearchInput')?.value || '').trim().toLocaleLowerCase('vi');
      const filteredEntries = allEntries.filter(([,item]) => {
        const matchesText = !searchQuery || `${item.bienSo || ''} ${item.tenGara || ''} ${item.nguoiTao?.tenHienThi || ''} ${item.nguoiTao?.email || ''}`.toLocaleLowerCase('vi').includes(searchQuery);
        const isDone = item.trangThai === STATUS_COMPLETED;
        const matchesStatus = activeCaseFilter === 'all' || (activeCaseFilter === 'completed' && isDone) || (activeCaseFilter === 'pending' && !isDone);
        return matchesText && matchesStatus;
      });
      if (!filteredEntries.length) {
        tableBody.innerHTML = `<tr><td colspan="5"><div class="empty-state-premium"><div class="empty-icon">${SVGS.SEARCH}</div><strong>Không tìm thấy hồ sơ phù hợp</strong><p>Thử thay đổi từ khóa hoặc bộ lọc trạng thái.</p></div></td></tr>`;
        return;
      }
      tableBody.innerHTML = filteredEntries.map(([uniqueKeyToken, entityNode]) => {
        const isCaseDone = entityNode.trangThai === STATUS_COMPLETED;
        const targetBadgeClass = isCaseDone ? 'completed' : 'pending';

    function formatCaseTimestamp(timestamp) {
      if (!timestamp) return { date: 'Chưa ghi nhận', time: '—' };
      const date = new Date(Number(timestamp));
      if (Number.isNaN(date.getTime())) return { date: 'Chưa ghi nhận', time: '—' };
      return {
        date: new Intl.DateTimeFormat('vi-VN', { day:'2-digit', month:'2-digit', year:'numeric' }).format(date),
        time: new Intl.DateTimeFormat('vi-VN', { hour:'2-digit', minute:'2-digit' }).format(date)
      };
    }

    async function pipelineTriggerCaseCreationFlow() {

      }

      toggleUploadOverlay(true, imagesFileList.length ? 'Đang mã hóa dữ liệu hình ảnh...' : 'Đang khởi tạo yêu cầu...', 'Chuẩn bị cấu trúc hồ sơ đối chiếu hai chiều...', 0);

      try {
        const secureHostedImageUrlsArray = imagesFileList.length ? await executionParallelImagesUploadCore(imagesFileList) : [];
        
        toggleUploadOverlay(true, 'Khởi tạo thực thể cấu trúc...', 'Đồng bộ trường dữ liệu sang máy chủ đám mây...', 95);

        const mappedImageNodeObjects = secureHostedImageUrlsArray.map(secureUrl => ({
          linkAnh: secureUrl,

        const currentUser = firebase.auth().currentUser;
        const currentProfile = getAuthenticatedUserPresentation(currentUser);
        const requestedEvidenceNodes = requestedItemNames.map((itemName, index) => ({
          tenHangMuc: itemName,
          thuTu: index + 1,

        const finalPayloadStructure = {
          idCa: generatedCaseUniqueToken,

        document.getElementById('txtRequestedItemNames').value = '';

        clearActiveObjectUrls();
      } catch (exception) {
        console.error(exception);
        triggerToast(exception.message || 'Lỗi truyền tải đa luồng.', 'error');
      } finally {
        toggleUploadOverlay(false); 
      }
    }

    async function executionParallelImagesUploadCore(filesArray) {
      let resolvedCounter = 0;
      const totalFilesCount = filesArray.length;

      const parallelPromisesPool = filesArray.map(async (fileItem) => {
        try {
          const cloudSecureUrl = await uploadSingleImageToCloudinaryEngine(fileItem);
          resolvedCounter++;
          
          const accumulatedPercentage = Math.round((resolvedCounter / totalFilesCount) * 100);
          toggleUploadOverlay(true, `Đang xử lý gói ảnh dữ liệu (${resolvedCounter}/${totalFilesCount})`, `Luồng truyền tải song song ổn định: ${accumulatedPercentage}%`, accumulatedPercentage);
          
          return cloudSecureUrl;
        } catch (error) {
          throw new Error(`Lỗi tệp [${fileItem.name}]: ${error.message}`);
        }
      });

      return await Promise.all(parallelPromisesPool);
    }

    async function uploadSingleImageToCloudinaryEngine(fileBlob) {
      const targetApiEndpointUrl = `https://api.cloudinary.com/v1_1/${encodeURIComponent(CONFIG.CLOUDINARY_CLOUD_NAME)}/image/upload`;
      const multiPartFormData = new FormData();
      multiPartFormData.append('file', fileBlob);
      multiPartFormData.append('upload_preset', CONFIG.CLOUDINARY_UPLOAD_PRESET);
      if (CONFIG.CLOUDINARY_FOLDER) {
        multiPartFormData.append('folder', CONFIG.CLOUDINARY_FOLDER);
      }

      const networkResponse = await fetch(targetApiEndpointUrl, { method: 'POST', body: multiPartFormData });
      const parsedTextResponse = await networkResponse.text();
      
      let convertedJSONData;
      try { convertedJSONData = JSON.parse(parsedTextResponse); } catch(err) { throw new Error('Phản hồi Server lỗi.'); }

      if (!networkResponse.ok || !convertedJSONData.secure_url) {
        throw new Error(convertedJSONData?.error?.message || 'Lỗi API.');
      }
      return convertedJSONData.secure_url;
    }

        if (subtitle) sEl.textContent = subtitle;

        overlay.style.display = 'none';
      }
    }

    function normalizeEvidenceImageUrls(item) {
      const rawValue = item?.hinhAnhGarage ?? item?.linkAnhGarage ?? [];
      if (Array.isArray(rawValue)) return rawValue.filter(Boolean);
      if (rawValue && typeof rawValue === 'object') return Object.values(rawValue).filter(Boolean);
      return rawValue ? [rawValue] : [];
    }

    async function uploadGarageEvidenceItems() {
      const packagedItems = localActiveRequestedItems.map((item,index) => ({
        tenHangMuc: item.tenHangMuc || `Hạng mục ${index+1}`,
        thuTu: item.thuTu || index + 1,
        hinhAnhGarage: normalizeEvidenceImageUrls(item)
      }));
      const uploadJobs = [];
      document.querySelectorAll('.garage-evidence-input').forEach(input => {
        const requestIndex = Number(input.dataset.requestIndex);
        Array.from(input.files || []).forEach(file => uploadJobs.push({ requestIndex, file }));
      });
      if (!uploadJobs.length) return packagedItems;
      let completed = 0;
      toggleUploadOverlay(true, 'Đang tải ảnh Garage cung cấp...', `0/${uploadJobs.length} ảnh đã đồng bộ`, 0);
      await Promise.all(uploadJobs.map(async job => {
        const url = await uploadSingleImageToCloudinaryEngine(job.file);
        packagedItems[job.requestIndex].hinhAnhGarage.push(url);
        completed += 1;
        toggleUploadOverlay(true, 'Đang tải ảnh Garage cung cấp...', `${completed}/${uploadJobs.length} ảnh đã đồng bộ`, Math.round((completed / uploadJobs.length) * 100));
      }));
      return packagedItems;
    }

    async function pipelineTriggerGarageDataLockSubmission() {
      const DOMTextareaElements = Array.from(document.querySelectorAll('.garage-quote-textarea-node'));
      const emptyFieldsCounter = DOMTextareaElements.filter(tx => !tx.value.trim()).length;
      if (emptyFieldsCounter > 0) {
        const proceedBlank = await showConfirmModal('Phát hiện ô chưa khai báo', `Còn ${emptyFieldsCounter} ảnh hiện trạng chưa được nhập tên bộ phận. Bạn vẫn muốn tiếp tục?`);
        if (!proceedBlank) return;
      }

      const missingEvidenceIndexes = localActiveRequestedItems.map((item,index) => {
        const input = document.getElementById(`garageEvidenceInput_${index}`);
        const existingImages = normalizeEvidenceImageUrls(item);
        return existingImages.length || Number(input?.files?.length || 0) ? null : index;
      }).filter(index => index !== null);
      if (missingEvidenceIndexes.length) {
        const firstIndex = missingEvidenceIndexes[0];
        document.querySelector(`[data-evidence-dropzone="${firstIndex}"]`)?.scrollIntoView({ behavior:'smooth', block:'center' });
        triggerToast(`Còn ${missingEvidenceIndexes.length} hạng mục chưa được Garage cung cấp ảnh.`, 'error');
        return;
      }

      const finalFreezeConfirmation = await showConfirmModal('Xác nhận khóa hồ sơ', 'Sau khi gửi, toàn bộ ghi chú và ảnh Garage cung cấp sẽ được khóa để Giám định viên đối chiếu. Xác nhận gửi?');
      if (!finalFreezeConfirmation) return;

      const packagedImageNotes = DOMTextareaElements.map(tx => {
        const numericIndex = Number(tx.dataset.indexToken);
        return { linkAnh: localActiveImageStack[numericIndex].linkAnh, hangMucBaoGia: tx.value.trim() };
      });

      try {
        const packagedEvidenceItems = await uploadGarageEvidenceItems();
        toggleUploadOverlay(true, 'Đang khóa hồ sơ...', 'Đồng bộ kết quả cuối cùng lên Firebase...', 98);
        await dbNodeInstance.ref(`cases/${localActiveCaseNode.idCa}`).update({
          hinhAnh: packagedImageNotes,
          hangMucYeuCauAnh: packagedEvidenceItems,
          trangThai: STATUS_COMPLETED,
          garageSubmittedAt: firebase.database.ServerValue.TIMESTAMP
        });
        triggerToast('Garage đã gửi đầy đủ ghi chú và ảnh minh chứng.');
        const finalizedResultUrl = `${getCleanOriginBaseUrl()}?idCa=${encodeURIComponent(localActiveCaseNode.idCa)}`;
        window.history.replaceState({}, '', finalizedResultUrl);
        evaluateViewRoutingState(firebase.auth().currentUser);
      } catch (err) {
        console.error(err);
        triggerToast('Lỗi đồng bộ truyền tải: ' + err.message, 'error');
      } finally {
        toggleUploadOverlay(false);
      }
    }

    function renderPortalResultReadOnlyView(renderMode) {
      if (!localActiveImageStack.length && !localActiveRequestedItems.length) return renderErrorLayoutState('Không thể cấu trúc dữ liệu kết quả của hồ sơ.');
      const completedItems = localActiveImageStack.filter(item => String(item.hangMucBaoGia || '').trim()).length;
      const completedEvidenceItems = localActiveRequestedItems.filter(item => normalizeEvidenceImageUrls(item).length).length;

      const imageResultsSection = localActiveImageStack.length ? `
        <div class="workspace-section-head"><div><h2>01 · Hạng mục Garage xác định từ ảnh</h2><p>Ảnh hiện trạng và nội dung Garage khai báo được hiển thị song song.</p></div><div class="workspace-section-index">${String(completedItems).padStart(2,'0')}/${String(localActiveImageStack.length).padStart(2,'0')}</div></div>
        ${localActiveImageStack.map((item, index) => {
          const textContentClean = String(item.hangMucBaoGia || '').trim();
          return `<article class="premium-image-card">
            <div class="img-display-pane"><span class="img-pane-indicator">Ảnh đối chiếu ${String(index + 1).padStart(2,'0')}</span><img src="${escapeAttributeData(item.linkAnh)}" alt="Ảnh kết quả ${index + 1}" loading="lazy" onclick="openLightbox('${escapeAttributeData(item.linkAnh)}')" /></div>
            <div class="inputs-entry-pane"><div><div class="image-sequence">GARAGE RESULT / ${String(index + 1).padStart(2,'0')}</div><div class="form-group" style="margin:0"><label>Hạng mục Garage đã ghi nhận</label><div class="result-content ${textContentClean ? '' : 'is-empty'}">${textContentClean ? escapeHtmlOutput(textContentClean) : 'Garage không khai báo hạng mục cho ảnh này.'}</div></div></div><button class="btn-premium btn-secondary btn-inline" onclick="window.open('${escapeAttributeData(item.linkAnh)}','_blank')">${SVGS.EXTERNAL} Mở ảnh chứng cứ gốc</button></div>
          </article>`;
        }).join('')}` : '';

      const evidenceResultsSection = localActiveRequestedItems.length ? `
        <div class="workspace-section-head" style="margin-top:${localActiveImageStack.length ? '12px' : '0'}"><div><h2>02 · Ảnh Garage cung cấp theo hạng mục báo giá</h2><p>Kiểm tra trực tiếp bộ ảnh minh chứng Garage đã tải cho từng hạng mục.</p></div><div class="workspace-section-index">${String(completedEvidenceItems).padStart(2,'0')}/${String(localActiveRequestedItems.length).padStart(2,'0')}</div></div>
        ${localActiveRequestedItems.map((item,index) => {
          const urls = normalizeEvidenceImageUrls(item);
          return `<article class="evidence-result-card"><div class="evidence-result-title"><div class="evidence-request-number">${String(index+1).padStart(2,'0')}</div><div><h3>${escapeHtmlOutput(item.tenHangMuc || `Hạng mục ${index+1}`)}</h3><p>${urls.length} ảnh do Garage cung cấp</p></div></div>${urls.length ? `<div class="evidence-result-gallery">${urls.map((url,imageIndex) => `<button type="button" class="evidence-result-image" title="Mở ảnh ${imageIndex+1}" onclick="openLightbox('${escapeAttributeData(url)}')"><img src="${escapeAttributeData(url)}" alt="Ảnh Garage cung cấp ${imageIndex+1}" loading="lazy"></button>`).join('')}</div>` : `<div class="evidence-empty">Garage chưa cung cấp ảnh cho hạng mục này.</div>`}</article>`;
        }).join('')}` : '';

      rootContainer.innerHTML = `
        <div class="portal-shell">
          <header class="portal-topbar"><div><div class="eyebrow">Verified comparison result</div><h1>Kết quả đối chiếu Garage</h1><p>Xem lại đầy đủ người tạo hồ sơ, nội dung Garage khai báo và ảnh minh chứng theo từng hạng mục.</p></div><div class="portal-counter-stack"><div class="portal-counter">Đã ghi hạng mục<strong>${String(completedItems).padStart(2,'0')}/${String(localActiveImageStack.length).padStart(2,'0')}</strong></div><div class="portal-counter">Đã cung cấp ảnh<strong>${String(completedEvidenceItems).padStart(2,'0')}/${String(localActiveRequestedItems.length).padStart(2,'0')}</strong></div></div></header>
          <div class="focus-portal-layout">${buildHtmlComponentSidebarCaseMetadata(renderMode)}<div class="image-workspace-list">${imageResultsSection}${evidenceResultsSection}</div></div>
        </div>`;
    }

    function compileRawTextSummaryReportBlock() {
      const node = localActiveCaseNode || {};
      const outputLinesBuffer = [];

      outputLinesBuffer.push('==================================================');
      outputLinesBuffer.push('   BIÊN BẢN TỔNG HỢP HẠNG MỤC PHƯƠNG TIỆN CƠ GIỚI   ');
      outputLinesBuffer.push('==================================================');
      outputLinesBuffer.push(`- Mã ca giám định:    ${node.idCa || ''}`);
      outputLinesBuffer.push(`- Biển kiểm soát xe:  ${node.bienSo || ''}`);
      outputLinesBuffer.push(`- Đơn vị sửa chữa:    ${node.tenGara || ''}`);
      outputLinesBuffer.push(`- Người tạo hồ sơ:    ${node.nguoiTao?.tenHienThi || node.nguoiTao?.email || 'Không ghi nhận'}`);
      outputLinesBuffer.push(`- Tình trạng dữ liệu: ${node.trangThai || ''}`);
      outputLinesBuffer.push('--------------------------------------------------\n');

      localActiveImageStack.forEach((item, index) => {
        outputLinesBuffer.push(`[VÙNG ẢNH KHAI BÁO SỐ ${index + 1}]`);
        outputLinesBuffer.push(`+ Chi tiết hạng mục bộ phận: \n${item.hangMucBaoGia || 'Không ghi nhận hạng mục.'}`);
        outputLinesBuffer.push(`+ URL ảnh chứng cứ gốc: ${item.linkAnh || ''}`);
        outputLinesBuffer.push('');
      });

      localActiveRequestedItems.forEach((item,index) => {
        outputLinesBuffer.push(`[HẠNG MỤC YÊU CẦU ẢNH SỐ ${index + 1}]`);
        outputLinesBuffer.push(`+ Tên hạng mục: ${item.tenHangMuc || ''}`);
        const urls = normalizeEvidenceImageUrls(item);
        if (urls.length) urls.forEach((url,imageIndex) => outputLinesBuffer.push(`+ Ảnh Garage ${imageIndex + 1}: ${url}`));
        else outputLinesBuffer.push('+ Ảnh Garage: Chưa cung cấp.');
        outputLinesBuffer.push('');
      });

      return outputLinesBuffer.join('\n');
    }

    function executeCopyAggregatedRawText() {
      executeTextCopyToClipboardRawString(compileRawTextSummaryReportBlock());
    }

    function triggerToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.setAttribute('role', 'status');
      toast.textContent = String(message || 'Đã hoàn tất thao tác.');
      container.appendChild(toast);
      window.setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        window.setTimeout(() => toast.remove(), 260);
      }, 3800);
    }

    function showConfirmModal(title, message) {
      return new Promise((resolve) => {
        const overlay = document.getElementById('modalOverlay');
        const titleNode = document.getElementById('modalTitle');
        const messageNode = document.getElementById('modalMsg');
        const cancelButton = document.getElementById('modalCancel');
        const confirmButton = document.getElementById('modalConfirm');
        if (!overlay || !cancelButton || !confirmButton) {
          resolve(window.confirm(message));
          return;
        }
        titleNode.textContent = title || 'Xác nhận thao tác';
        messageNode.textContent = message || 'Bạn có chắc chắn muốn tiếp tục?';
        overlay.style.display = 'grid';
        document.body.style.overflow = 'hidden';
        const finish = (result) => {
          overlay.style.display = 'none';
          document.body.style.overflow = '';
          cancelButton.removeEventListener('click', onCancel);
          confirmButton.removeEventListener('click', onConfirm);
          overlay.removeEventListener('click', onBackdrop);
          document.removeEventListener('keydown', onKeydown);
          resolve(result);
        };
        const onCancel = () => finish(false);
        const onConfirm = () => finish(true);
        const onBackdrop = (event) => { if (event.target === overlay) finish(false); };
        const onKeydown = (event) => { if (event.key === 'Escape') finish(false); };
        cancelButton.addEventListener('click', onCancel);
        confirmButton.addEventListener('click', onConfirm);
        overlay.addEventListener('click', onBackdrop);
        document.addEventListener('keydown', onKeydown);
        confirmButton.focus();
      });
    }

    /****************************************************
     * GENERIC INFRASTRUCTURE HELPERS UTILS
     ****************************************************/
    function renderLoadingLayoutIndicator(friendlyMessage) {
      rootContainer.innerHTML = `<div class="p-card state-card"><div class="spinner-premium"></div><h3 style="font-size:16px">${escapeHtmlOutput(friendlyMessage)}</h3><p style="margin-top:6px;color:var(--text-muted);font-size:11px">Đang đồng bộ dữ liệu thời gian thực.</p></div>`;
    }

    function renderErrorLayoutState(errorMessage) {
      rootContainer.innerHTML = `<div class="p-card state-card"><div class="state-icon" style="color:var(--danger)">${SVGS.TRASH}</div><h2 style="font-size:20px">Không thể mở tài nguyên</h2><p style="margin:9px 0 22px;color:var(--text-muted);font-size:12px;line-height:1.7">${escapeHtmlOutput(errorMessage)}</p><button class="btn-premium" onclick="window.location.reload()">Tải lại trang</button></div>`;
    }

    function renderFatalConfigurationFailure() {
      rootContainer.innerHTML = `
        <div class="p-card" style="border-top:4px solid var(--danger); margin-top:40px;">
          <h2 style="color:var(--danger); font-size:18px;">Lỗi xác thực cấu hình lõi phân quyền</h2>
          <p style="margin-top:10px; font-size:13px; color:var(--text-muted); line-height:1.6;">
            Cấu hình khóa ứng dụng trong đối tượng cấu trúc <strong>CONFIG.FIREBASE</strong> hoặc khóa công khai tài khoản <strong>CLOUDINARY</strong> chứa chuỗi ký tự tạm rỗng hoặc "PASTE_". Vui lòng kiểm tra lại file index.html.
          </p>
        </div>
      `;
    }

    function toggleButtonUIPendingState(buttonDomNode, isBusyState, overlayTextValue) {
      if (!buttonDomNode) return;
      if (isBusyState) {
        buttonDomNode.setAttribute('data-preserved-text', buttonDomNode.textContent);
        buttonDomNode.textContent = overlayTextValue;
        buttonDomNode.disabled = true;
      } else {
        buttonDomNode.textContent = buttonDomNode.getAttribute('data-preserved-text') || overlayTextValue;
        buttonDomNode.disabled = false;
      }
    }

    function executeTextCopyToClipboardRawString(textStringPayload) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textStringPayload)
          .then(() => triggerToast('Đã sao chép vào bộ nhớ tạm.'))
          .catch(() => fallbackExecutionTextCopyLegacy(textStringPayload));
      } else {
        fallbackExecutionTextCopyLegacy(textStringPayload);
      }
    }

    function fallbackExecutionTextCopyLegacy(fallbackText) {
      const transientTextarea = document.createElement('textarea');
      transientTextarea.value = fallbackText; transientTextarea.style.position = 'fixed'; transientTextarea.style.left = '-9999px';
      document.body.appendChild(transientTextarea); transientTextarea.focus(); transientTextarea.select();
      try { document.execCommand('copy'); triggerToast('Đã sao chép liên kết.'); } catch (err) { triggerToast('Lỗi trích xuất bộ nhớ.', 'error'); }
      document.body.removeChild(transientTextarea);
    }

    function openLightbox(imageSourceUrl) {
      const lightboxContainer = document.getElementById('lightbox');
      document.getElementById('lightboxImg').src = imageSourceUrl;
      lightboxContainer.classList.add('show');
    }

    function closeLightbox() {
      const lightboxContainer = document.getElementById('lightbox');
      lightboxContainer.classList.remove('show');
      document.getElementById('lightboxImg').src = '';
    }

    function getCleanOriginBaseUrl() {
      return window.location.href.split('?')[0].split('#')[0].replace(/index\.html$/i, '');
    }

    function isSystemConfigHealthy() {
      return (
        CONFIG.FIREBASE.apiKey && !CONFIG.FIREBASE.apiKey.includes('PASTE_') &&
        CONFIG.CLOUDINARY_CLOUD_NAME && !CONFIG.CLOUDINARY_CLOUD_NAME.includes('PASTE_')
      );
    }

    function escapeHtmlOutput(unsafeStringValue) {
      return String(unsafeStringValue || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function escapeAttributeData(unsafeAttrValue) { return escapeHtmlOutput(unsafeAttrValue); }
    function clearActiveObjectUrls() { activeObjectUrls.forEach(url => URL.revokeObjectURL(url)); activeObjectUrls = []; }
  </script>
