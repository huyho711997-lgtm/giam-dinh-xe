<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b11" />
  <meta name="description" content="Nền tảng đối chiếu ảnh giám định và hạng mục báo giá Garage theo thời gian thực." />
  <title>ClaimVision Ultimate — Đối chiếu giám định xe cơ giới</title>

  <!-- Google Fonts & Firebase SDK -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    /* ==========================================================================
       ===== THEME ENGINE: DYNAMIC LUXURY SYSTEM (LIGHT & DARK VARIABLE MAP) =====
       ========================================================================== */
    :root {
      /* Global Layout Specs */
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 15px;
      --radius-sm: 10px;
      --transition: .3s cubic-bezier(.25, .8, .25, 1);

      /* Semantic Accent Colorway */
      --blue: #5ba9ff;
      --danger: #ff6b7a;
      --success: #48d7a1;
      --warning: #ffbd59;

      /* Dark Mode (Default Luxury Obsidian Theme) */
      --bg: #05070b;
      --bg-gradient: radial-gradient(circle at 14% -8%, rgba(216,180,109,.14), transparent 30%),
                     radial-gradient(circle at 92% 16%, rgba(91,169,255,.09), transparent 24%),
                     linear-gradient(180deg, #080b11 0%, #05070b 55%, #070a10 100%);
      --bg-soft: #090d14;
      --surface: rgba(14, 19, 28, .82);
      --surface-strong: #101620;
      --surface-soft: rgba(255, 255, 255, .035);
      --surface-hover: rgba(255, 255, 255, .06);
      --text-main: #f7f8fb;
      --text-soft: #c8ced9;
      --text-muted: #7f8999;
      --border: rgba(255, 255, 255, .075);
      --border-strong: rgba(255, 255, 255, .14);
      --shadow-sm: 0 10px 28px rgba(0, 0, 0, .24);
      --shadow-lg: 0 30px 80px rgba(0, 0, 0, .48);
      
      --primary: #d8b46d;
      --primary-2: #f5dc9c;
      --primary-dark: #8a6425;
      --primary-gradient: linear-gradient(135deg, #f2d998 0%, #c79b4b 48%, #916621 100%);

      --grid-opacity: .28;
      --grid-color: rgba(255, 255, 255, .018);

      /* Layout Segment Gradients */
      --hero-bg: linear-gradient(125deg, rgba(18,24,34,.96), rgba(8,12,18,.86));
      --hero-glow: radial-gradient(circle, rgba(216,180,109,.26), rgba(216,180,109,.04) 48%, transparent 70%);
      --metadata-bg: #0c1119;
      --portal-bg: linear-gradient(120deg, rgba(18,24,34,.94), rgba(9,13,19,.9));
      --input-bg: rgba(4,7,11,.62);
      --input-focus-bg: rgba(5,8,13,.88);
      --dropzone-bg: linear-gradient(145deg, rgba(216,180,109,.055), rgba(255,255,255,.012));
      --dropzone-glow: rgba(216,180,109,.08);
      --login-bg: linear-gradient(120deg, rgba(16,22,31,.97), rgba(6,9,14,.95));
      --login-glow: radial-gradient(circle, rgba(216,180,109,.22), transparent 66%);
      --img-pane-bg: #05070b;
      --scrollbar-track: #07090e;
      --scrollbar-thumb: #2b313d;
      --scrollbar-thumb-hover: #3b4351;
      --placeholder-color: #505968;

      /* Button Specs */
      --btn-premium-border: rgba(245,220,156,.42);
      --btn-dark-bg: linear-gradient(145deg, rgba(91,169,255,.12), rgba(91,169,255,.035));
      --btn-dark-text: #ecf1f8;
      --btn-dark-border: rgba(91,169,255,.22);
      --btn-dark-hover-bg: linear-gradient(145deg, rgba(91,169,255,.22), rgba(91,169,255,.08));
      
      --btn-danger-text: #ff9ba5;
      --btn-danger-bg: rgba(255,107,122,.065);
      --btn-danger-border: rgba(255,107,122,.2);
      --btn-danger-hover-bg: rgba(255,107,122,.11);
      --btn-danger-hover-border: rgba(255,107,122,.42);

      /* Badges & Status Codes */
      --status-pending-text: var(--warning);
      --status-pending-bg: rgba(255,189,89,.065);
      --status-pending-border: rgba(255,189,89,.18);
      
      --status-completed-text: var(--success);
      --status-completed-bg: rgba(72,215,161,.065);
      --status-completed-border: rgba(72,215,161,.18);

      /* Components Specifics */
      --result-content-bg: rgba(4,7,11,.55);
      --toast-bg: rgba(13,18,26,.94);
      --toast-text: var(--text-soft);
      --modal-bg: #0d121a;
      --table-th-bg: rgba(255,255,255,.018);
      --table-th-text: #687283;
    }

    /* Luxury Light Theme (Champagne Gold & Alabaster Palette) */
    body.light-mode {
      --bg: #f5f5f2;
      --bg-gradient: radial-gradient(circle at 14% -8%, rgba(216,180,109,.09), transparent 40%),
                     radial-gradient(circle at 92% 16%, rgba(91,169,255,.05), transparent 35%),
                     linear-gradient(180deg, #fbfbfa 0%, #f4f4f0 100%);
      --bg-soft: #ffffff;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-strong: #faf9f6;
      --surface-soft: rgba(28, 31, 38, .035);
      --surface-hover: rgba(28, 31, 38, .065);
      --text-main: #1c1f26;
      --text-soft: #3a4252;
      --text-muted: #717d96;
      --border: rgba(28, 31, 38, .15); 
      --border-strong: rgba(28, 31, 38, .26);
      --shadow-sm: 0 10px 28px rgba(28, 31, 38, .05);
      --shadow-lg: 0 30px 80px rgba(28, 31, 38, .09);

      --primary: #b38c43;
      --primary-2: #6b501f;
      --primary-dark: #4d3711;
      --primary-gradient: linear-gradient(135deg, #f3d08c 0%, #d5a247 50%, #9e7123 100%); 

      --grid-opacity: .18;
      --grid-color: rgba(28, 31, 38, .015);

      /* Layout Segment Gradients Overrides */
      --hero-bg: linear-gradient(125deg, #e4e3dc, #f1f0ea);
      --hero-glow: radial-gradient(circle, rgba(216,180,109,.14), rgba(216,180,109,.02) 48%, transparent 70%);
      --metadata-bg: rgba(216, 180, 109, .035);
      --portal-bg: linear-gradient(120deg, #eae8e1, #f4f3ed);
      --input-bg: #ffffff;
      --input-focus-bg: #ffffff; 
      --dropzone-bg: linear-gradient(145deg, rgba(216,180,109,.04), rgba(255,255,255,.2));
      --dropzone-glow: rgba(216,180,109,.04);
      --login-bg: linear-gradient(120deg, #f5f5f2, #ffffff);
      --login-glow: radial-gradient(circle, rgba(216,180,109,.1), transparent 66%);
      --img-pane-bg: #eae8e1;
      --scrollbar-track: #f1f1f1;
      --scrollbar-thumb: #cbd5e1;
      --scrollbar-thumb-hover: #94a3b8;
      --placeholder-color: #94a3b8;

      /* Button Specs */
      --btn-premium-border: rgba(179,140,67,.3);
      --btn-dark-bg: #1e293b; 
      --btn-dark-text: #ffffff;
      --btn-dark-border: #1e293b;
      --btn-dark-hover-bg: #0f172a;
      
      --btn-danger-text: #b91c1c; 
      --btn-danger-bg: #fef2f2;
      --btn-danger-border: #fca5a5;
      --btn-danger-hover-bg: #fee2e2;
      --btn-danger-hover-border: #ef4444;

      /* Badges & Status Codes */
      --status-pending-text: #b45309; 
      --status-pending-bg: #fef3c7; 
      --status-pending-border: #fde68a; 
      
      --status-completed-text: #15803d; 
      --status-completed-bg: #dcfce7; 
      --status-completed-border: #bbf7d0; 

      /* Components Specifics */
      --result-content-bg: #faf9f6; 
      --toast-bg: rgba(255, 255, 255, 0.96);
      --toast-text: var(--text-main);
      --modal-bg: #ffffff;
      --table-th-bg: rgba(28, 31, 38, .03);
      --table-th-text: #4a5568;
    }

    /* Hardware-Accelerated Seamless Transitions */
    body, .premium-nav, .p-card, .stat-box, .portal-topbar, .hero-panel, 
    .input-premium, .textarea-premium, .metadata-row, .p-table tr, 
    .img-display-pane, .dropzone, .login-wrapper, .toast, .inputs-entry-pane textarea {
      transition: background var(--transition), border-color var(--transition), color var(--transition), box-shadow var(--transition);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.55;
      background: var(--bg-gradient);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: var(--grid-opacity);
      pointer-events: none;
      background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
      transition: opacity var(--transition);
    }
    button, input, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    ::selection { color: #0d0b06; background: var(--primary-2); }
    
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb { border: 2px solid var(--scrollbar-track); border-radius: 999px; background: var(--scrollbar-thumb); }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }

    .svg-icon { width: 1.2rem; height: 1.2rem; display: inline-block; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .svg-icon-lg { width: 2.2rem; height: 2.2rem; }
    .svg-icon-sm { width: 1rem; height: 1rem; }

    .app-container { width: min(1480px, 100%); margin: 0 auto; padding: 18px 18px 80px; }
    @media (min-width: 768px) { .app-container { padding: 26px 30px 100px; } }

    .premium-nav {
      position: sticky;
      top: 18px;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
      padding: 12px 20px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(24px) saturate(135%);
    }
    .premium-nav::after { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; background: linear-gradient(100deg, rgba(255,255,255,.045), transparent 30%, transparent 70%, rgba(216,180,109,.04)); }
    .nav-brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .nav-logo { width: 46px; height: 46px; display: grid; place-items: center; flex: 0 0 auto; color: #171209; border: 1px solid rgba(245,220,156,.5); border-radius: 15px; background: var(--primary-gradient); box-shadow: 0 12px 28px rgba(199,155,75,.2); }
    .nav-logo .svg-icon { width: 24px; height: 24px; stroke-width: 2.2; }
    .nav-titles { min-width: 0; }
    .nav-titles h1 { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 800; letter-spacing: -.025em; white-space: nowrap; }
    .nav-titles p { max-width: 560px; overflow: hidden; color: var(--text-muted); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 5px rgba(72,215,161,.09), 0 0 18px rgba(72,215,161,.45); }
    @media (max-width: 650px) { .nav-titles p { display: none; } .nav-titles h1 { font-size: 13px; } .premium-nav { top: 10px; } }

    .nav-user-zone { display: flex; align-items: center; gap: 10px; }

    /* ===== LUXURY IDENTITY SYSTEM (FIXED SYMMETRY) ===== */
    .nav-user-card { 
      appearance: none; 
      color: inherit; 
      cursor: pointer; 
      text-align: left; 
      transition: var(--transition); 
      display: inline-flex; 
      align-items: center; 
      gap: 10px; 
      height: 48px; 
      padding: 0 14px 0 6px; 
      border: 1px solid var(--border); 
      border-radius: 14px; 
      background: var(--surface-soft);
    }
    .nav-user-card:hover { transform: translateY(-1px); border-color: rgba(216,180,109,.34); background: rgba(216,180,109,.055); box-shadow: var(--shadow-sm); }
    .nav-user-avatar { 
      width: 36px; 
      height: 36px; 
      display: grid; 
      place-items: center; 
      flex: 0 0 auto; 
      color: #171209; 
      border: 1px solid rgba(245,220,156,.4); 
      border-radius: 10px; 
      background: var(--primary-gradient); 
      font-family: 'JetBrains Mono'; 
      font-size: 12px; 
      font-weight: 800; 
    }
    .nav-user-copy { 
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0; 
      max-width: 200px; 
    }
    .nav-user-copy strong { 
      display: block; 
      overflow: hidden; 
      color: var(--text-main); 
      font-size: 13.5px; 
      font-weight: 700;
      text-overflow: ellipsis; 
      white-space: nowrap; 
      line-height: 1.2;
    }
    .nav-user-copy em { 
      display: block; 
      overflow: hidden; 
      margin-top: 2px; 
      color: var(--primary); 
      font-size: 10px; 
      font-style: normal; 
      font-weight: 700; 
      letter-spacing: .03em; 
      text-overflow: ellipsis; 
      text-transform: uppercase; 
      white-space: nowrap; 
      line-height: 1.1;
    }
    .nav-logout-icon { 
      width: 48px !important; 
      height: 48px !important; 
      min-height: 48px !important; 
      flex-shrink: 0;
      padding: 0; 
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface-soft);
      color: var(--text-muted);
      transition: var(--transition);
    }
    .nav-logout-icon:hover {
      color: var(--danger);
      border-color: rgba(255, 107, 122, .22);
      background: rgba(255, 107, 122, .06);
    }
    .nav-logout-icon.theme-btn:hover {
      color: var(--primary);
      border-color: rgba(216, 180, 109, 0.3);
      background: rgba(216, 180, 109, 0.06);
    }
    @media (max-width: 720px) { .nav-user-copy { display: none; } .nav-user-card { padding: 6px; height: 38px; } .nav-user-avatar { width: 26px; height: 36px; font-size: 11px; } .nav-logout-icon { width: 38px !important; height: 38px !important; min-height: 38px !important; } }

    .hero-panel {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 24px;
      align-items: center;
      min-height: 180px;
      margin-bottom: 20px;
      padding: clamp(20px, 3vw, 36px);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: var(--hero-bg);
      box-shadow: var(--shadow-lg);
    }
    .hero-panel::before { content: ''; position: absolute; width: 520px; height: 520px; right: -130px; top: -260px; z-index: -1; border-radius: 50%; background: var(--hero-glow); transition: background var(--transition); }
    .hero-panel::after { content: ''; position: absolute; width: 42%; height: 100%; right: 0; top: 0; z-index: -2; opacity: .7; background: linear-gradient(90deg, transparent, rgba(255,255,255,.025)); clip-path: polygon(34% 0,100% 0,100% 100%,0 100%); }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; margin-bottom: 12px; color: var(--primary-2); font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    .eyebrow::before { content: ''; width: 28px; height: 1px; background: var(--primary); box-shadow: 0 0 12px rgba(216,180,109,.55); }
    .hero-panel h2 { max-width: 760px; font-size: clamp(24px, 4.5vw, 40px); font-weight: 700; line-height: 1.06; letter-spacing: -.05em; }
    .hero-panel h2 span { color: var(--primary); }
    .hero-panel p { max-width: 680px; margin-top: 10px; color: var(--text-muted); font-size: clamp(13px, 1.4vw, 14.5px); }
    
    .hero-user-inline { 
      width: fit-content; 
      max-width: 100%; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      margin-top: 16px; 
      padding: 8px 14px 8px 8px; 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      background: var(--surface-soft); 
      cursor: pointer; 
      transition: var(--transition); 
    }
    .hero-user-inline:hover { border-color: rgba(216,180,109,.32); background: rgba(216,180,109,.05); transform: translateY(-1px); }
    .hero-user-inline .nav-user-avatar { width: 38px; height: 38px; font-size: 13px; }
    .hero-user-inline strong { 
      display: block; 
      color: var(--text-main); 
      font-size: 13.5px; 
      font-weight: 800;
      line-height: 1.2;
    }
    .hero-user-inline span { 
      display: block; 
      overflow: hidden; 
      max-width: 340px; 
      margin-top: 2px; 
      color: var(--text-soft); 
      font-size: 10px; 
      font-weight: 500;
      text-overflow: ellipsis; 
      white-space: nowrap; 
    }
    .hero-signature { display: grid; justify-items: end; gap: 10px; padding-bottom: 2px; }
    .hero-signature .seal { width: 70px; height: 70px; display: grid; place-items: center; border: 1px solid rgba(216,180,109,.24); border-radius: 50%; color: var(--primary); background: rgba(216,180,109,.045); box-shadow: inset 0 0 35px rgba(216,180,109,.04); }
    .hero-signature .seal .svg-icon { width: 28px; height: 28px; }
    .hero-signature small { color: var(--text-muted); font-size: 10px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
    @media (max-width: 760px) { .hero-panel { grid-template-columns: 1fr; min-height: auto; } .hero-signature { display: none; } }

    .premium-stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; margin-bottom: 20px; }
    .stat-box { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; min-height: 100px; padding: 18px 20px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); backdrop-filter: blur(18px); transition: transform var(--transition), border-color var(--transition), background var(--transition); }
    .stat-box:hover { transform: translateY(-3px); border-color: var(--border-strong); background: var(--surface-strong); }
    .stat-box::after { content: ''; position: absolute; left: 0; bottom: 0; width: 38%; height: 2px; background: linear-gradient(90deg, var(--primary), transparent); }
    .stat-lbl { color: var(--text-muted); font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .stat-val { margin-top: 5px; font-family: 'JetBrains Mono', monospace; font-size: clamp(24px,3.5vw,32px); font-weight: 700; line-height: 1; letter-spacing: -.06em; color: var(--text-main); }
    .stat-note { margin-top: 6px; color: var(--text-muted); font-size: 11px; }
    .stat-icon-wrap { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-soft); }
    @media (max-width: 720px) { .premium-stats { grid-template-columns: 1fr; } .stat-box { min-height: 96px; } }

    /* ===== HEADER NAVIGATION LINKS ===== */
    .header-nav-tabs-container {
      margin-left: 20px;
      margin-right: auto;
    }
    .header-nav-tabs { 
      display: flex; 
      gap: 4px; 
      background: var(--surface-soft); 
      border: 1px solid var(--border); 
      padding: 4px; 
      border-radius: 12px; 
      align-items: center;
    }
    .header-nav-btn { 
      display: inline-flex; 
      align-items: center; 
      gap: 8px; 
      height: 34px; 
      padding: 0 14px; 
      cursor: pointer; 
      color: var(--text-muted); 
      border: 1px solid transparent; 
      border-radius: 8px; 
      background: transparent; 
      font-size: 12.5px; 
      font-weight: 700; 
      transition: all var(--transition); 
    }
    .header-nav-btn:hover { 
      color: var(--text-main); 
      background: rgba(255, 255, 255, 0.02); 
    }
    .header-nav-btn.active { 
      color: var(--primary); 
      background: rgba(216, 180, 109, 0.07); 
      border-color: rgba(216, 180, 109, 0.2); 
    }
    .header-nav-btn .svg-icon { width: 14px; height: 14px; }
    @media (max-width: 650px) {
      .header-nav-btn .nav-btn-text { display: none; }
      .header-nav-btn { padding: 0; width: 34px; height: 34px; justify-content: center; }
    }

    .workspace-grid { display: grid; gap: 20px; }
    .workspace-grid.single-col { grid-template-columns: 1fr; align-items: start; }

    .p-card { position: relative; border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--surface); box-shadow: var(--shadow-sm); backdrop-filter: blur(20px) saturate(120%); }
    .create-panel { padding: 32px; }
    .cases-panel { padding: 28px; min-width: 0; }
    .p-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 24px; padding-bottom: 19px; border-bottom: 1px solid var(--border); }
    .p-card-head h2 { font-size: 18px; font-weight: 800; letter-spacing: -.035em; color: var(--text-main); }
    .p-card-head p { margin-top: 5px; color: var(--text-muted); font-size: 12px; }
    .section-number { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; color: var(--primary); border: 1px solid rgba(216,180,109,.22); border-radius: 11px; background: rgba(216,180,109,.05); font-family: 'JetBrains Mono'; font-size: 11px; font-weight: 700; }
    @media (max-width: 600px) { .create-panel, .cases-panel { padding: 20px; border-radius: 21px; } }

    .form-group { margin-bottom: 19px; }

      SUN: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`,
      MOON: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`
    };

    const rootContainer = document.getElementById('appRoot');
    let dbNodeInstance = null;
    let localActiveCaseNode = null;
    let localActiveImageStack = [];
    let localActiveRequestedItems = [];
    let activeObjectUrls = [];
    let cachedCasesPayload = null;
    let activeCaseFilter = 'all';
    let activeDashboardTab = 'home'; 
    let activeCreateFlowMode = 'select';
    let activeUserProfile = null;
    let caseRequestedItemsDraft = [];
    let garageUploadsInFlight = 0;
    let garageAutosaveTimers = new Map();
    let garagePortalMounted = false; 

    // QUẢN LÝ THEME STATE: Khởi tạo từ cấu hình lưu trữ
    let currentTheme = localStorage.getItem('claimvision-theme') || 'dark';

    document.addEventListener('DOMContentLoaded', initApplicationState);
    window.addEventListener('popstate', () => { if (window.firebase?.auth) evaluateViewRoutingState(firebase.auth().currentUser); });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && document.getElementById('lightbox')?.classList.contains('show')) closeLightbox();
      if (event.key === 'Escape' && document.getElementById('profileModalOverlay')?.style.display === 'grid') closeUserProfileModal();
    });

    function initApplicationState() {
      // Áp dụng cấu hình giao diện ngay khi khởi chạy app
      if (currentTheme === 'light') {
        document.body.classList.add('light-mode');
      } else {
        document.body.classList.remove('light-mode');
      }

      if (!isSystemConfigHealthy()) {
        renderFatalConfigurationFailure();
        return;
      }
      firebase.initializeApp(CONFIG.FIREBASE);
      dbNodeInstance = firebase.database();

      firebase.auth().onAuthStateChanged(async (userInstance) => {
        activeUserProfile = userInstance ? await loadUserProfile(userInstance) : null;
        evaluateViewRoutingState(userInstance);
      });
    }

    // THAY ĐỔI THEME REALTIME: Thay đổi trực tiếp lớp CSS mà không reload / mất dữ liệu form
    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-mode');
      currentTheme = isLight ? 'light' : 'dark';
      localStorage.setItem('claimvision-theme', currentTheme);
      
      // Đồng bộ hóa icon của mọi nút chuyển đổi đang hiển thị trên màn hình
      document.querySelectorAll('.theme-toggle-btn-node').forEach(btn => {
        btn.innerHTML = currentTheme === 'light' ? SVGS.MOON : SVGS.SUN;
      });
    }

    function evaluateViewRoutingState(userInstance) {
      const URLQueryStrings = new URLSearchParams(window.location.search);
      const caseIdToken = URLQueryStrings.get('idCa');
      const targetedViewArg = URLQueryStrings.get('view');
      const brandElement = document.getElementById('navBrandClick');
      const userActionSpace = document.getElementById('navUserActionSpace');
      const mainNavBarDOM = document.getElementById('mainNavigationBar');

      const isManagementRoute = !caseIdToken || targetedViewArg === 'result';
      const isUserAuthenticated = !!userInstance;

      dbNodeInstance.ref('cases').off();
      if (localActiveCaseNode && localActiveCaseNode.idCa) {
        dbNodeInstance.ref(`cases/${localActiveCaseNode.idCa}`).off();
      }

      if (isManagementRoute && !isUserAuthenticated) {
        if (mainNavBarDOM) mainNavBarDOM.style.display = 'none';
        renderLoginView();
        return;
      }

      if (!isManagementRoute) {
        if (mainNavBarDOM) mainNavBarDOM.style.display = 'none';
      } else {
        if (mainNavBarDOM) mainNavBarDOM.style.display = 'flex';
      }

      if (isUserAuthenticated && isManagementRoute) {
        renderNavigationUserProfile(userInstance, userActionSpace);
        renderHeaderNavigationLinks();
      } else {
        if (userActionSpace) userActionSpace.innerHTML = '';
        removeHeaderNavigationLinks();
      }

      if (!caseIdToken) {
        if (brandElement) {
          brandElement.style.cursor = 'pointer';
          brandElement.onclick = goHome;
        }
        renderManagerDashboardWorkspace();
      } else {
        if (targetedViewArg !== 'result') {
          if (brandElement) {
            brandElement.style.cursor = 'default';
            brandElement.onclick = null;
          }
        } else {
          if (brandElement) {
            brandElement.style.cursor = 'pointer';
            brandElement.onclick = goHome;
          }
        }
        bindAndFetchCaseRealtimeSync(caseIdToken, targetedViewArg);
      }
    }

    function goHome() {
      activeDashboardTab = 'home';
      window.history.pushState({}, '', getCleanOriginBaseUrl());
      evaluateViewRoutingState(firebase.auth().currentUser);
    }

    function getProfileStorageKey(uid) {
      return `claimvision.userProfile.${uid || 'anonymous'}`;
    }

    function deriveInitials(displayName) {
      return String(displayName || 'Giám định viên').split(/\s+/).filter(Boolean).slice(0,2).map(part => part.charAt(0)).join('').toUpperCase() || 'GD';
    }

    async function loadUserProfile(userInstance) {
      const fallback = {
        displayName: String(userInstance?.displayName || '').trim(),
        role: 'Giám định viên',
        department: 'Bộ phận Giám định'
      };
      try {
        const localValue = JSON.parse(localStorage.getItem(getProfileStorageKey(userInstance?.uid)) || 'null');
        if (localValue && typeof localValue === 'object') Object.assign(fallback, localValue);
      } catch (_) {}
      try {
        const snapshot = await dbNodeInstance.ref(`users/${userInstance.uid}/profile`).once('value');
        const cloudValue = snapshot.val();
        if (cloudValue && typeof cloudValue === 'object') Object.assign(fallback, cloudValue);
      } catch (error) {
        console.info('User profile cloud storage is unavailable; local profile remains active.', error?.code || error?.message || error);
      }
      fallback.isConfigured = Boolean(String(fallback.displayName || '').trim());
      if (!fallback.displayName) fallback.displayName = 'Giám định viên';
      return fallback;
    }

    function getAuthenticatedUserPresentation(userInstance) {
      const email = String(userInstance?.email || '').trim() || 'Tài khoản Firebase';
      const profile = activeUserProfile || {};
      const displayName = String(profile.displayName || userInstance?.displayName || 'Giám định viên').trim();
      const role = String(profile.role || 'Giám định viên').trim();
      const department = String(profile.department || 'Bộ phận Giám định').trim();
      return { displayName, email, role, department, initials: deriveInitials(displayName), isConfigured: Boolean(profile.isConfigured || userInstance?.displayName || (profile.displayName && profile.displayName !== 'Giám định viên')) };
    }

    function renderNavigationUserProfile(userInstance, targetNode) {
      if (!targetNode) return;
      const profile = getAuthenticatedUserPresentation(userInstance);
      const activeThemeIcon = currentTheme === 'light' ? SVGS.MOON : SVGS.SUN;

        </div>`;
    }

    function renderHeaderNavigationLinks() {
      const navContainer = document.getElementById('mainNavigationBar');
      if (!navContainer) return;
      
      let tabsContainer = document.getElementById('headerNavTabsContainer');

        const userSpace = document.getElementById('navUserActionSpace');
        navContainer.insertBefore(tabsContainer, userSpace);

      const homeActive = activeDashboardTab === 'home' ? 'active' : '';
      const listActive = activeDashboardTab === 'list' ? 'active' : '';
      const createActive = activeDashboardTab === 'create' ? 'active' : '';
      
      tabsContainer.innerHTML = `
        <div class="header-nav-tabs">
          <button id="headerNavHomeBtn" class="header-nav-btn ${homeActive}" onclick="navigateHeaderTab('home')">${SVGS.HOME} <span class="nav-btn-text">Trang chủ</span></button>
          <button id="headerNavListBtn" class="header-nav-btn ${listActive}" onclick="navigateHeaderTab('list')">${SVGS.FOLDER} <span class="nav-btn-text">Quản lý hồ sơ</span></button>

        </div>
      `;
    }

    function removeHeaderNavigationLinks() {
      const tabsContainer = document.getElementById('headerNavTabsContainer');
      if (tabsContainer) tabsContainer.remove();
    }

    function navigateHeaderTab(tabName) {
      const URLQueryStrings = new URLSearchParams(window.location.search);
      const caseIdToken = URLQueryStrings.get('idCa');
      
      if (caseIdToken) {
        activeDashboardTab = tabName;
        window.history.pushState({}, '', getCleanOriginBaseUrl());
        evaluateViewRoutingState(firebase.auth().currentUser);
      } else {
        switchWorkspaceTab(tabName);
      }

    function switchCreateFlow(mode) {
      activeCreateFlowMode = mode;
      
      if (mode === 'template') {
        caseRequestedItemsDraft = [];

        if (caseRequestedItemsDraft.length === 0) {

            { id: generateUniqueReqId(), tenHangMuc: '' }

        }
      } else if (mode === 'image') {
        caseRequestedItemsDraft = [];
      }
      
      renderActiveTabContent();
    }

        { id: generateUniqueReqId(), tenHangMuc: '' },
        { id: generateUniqueReqId(), tenHangMuc: '' }

      const fileInput = document.getElementById('fileImageUploader');
      if (fileInput) fileInput.value = '';

      if (gridHolder) gridHolder.innerHTML = '';

      const labelSummary = document.getElementById('lblDropzoneSummary');

      activeCreateFlowMode = 'select';

    function updateStatsCounters(val) {
      const allEntries = Object.entries(val || cachedCasesPayload || {});
      const metricTotal = allEntries.length;
      const metricCompleted = allEntries.filter(([,item]) => item.trangThai === STATUS_COMPLETED).length;
      const metricPending = metricTotal - metricCompleted;

      const totalLbl = document.getElementById('lblTotalCases');
      const pendingLbl = document.getElementById('lblPendingCases');
      const completedLbl = document.getElementById('lblCompletedCases');
      
      if (totalLbl) totalLbl.textContent = metricTotal;
      if (pendingLbl) pendingLbl.textContent = metricPending;
      if (completedLbl) completedLbl.textContent = metricCompleted;
    }

    function openUserProfileModal() {
      const user = firebase.auth().currentUser;
      if (!user) return;
      const profile = getAuthenticatedUserPresentation(user);
      document.getElementById('profileDisplayName').value = profile.isConfigured ? profile.displayName : '';
      document.getElementById('profileRole').value = profile.role;
      document.getElementById('profileDepartment').value = profile.department;
      document.getElementById('profileEmailLocked').innerHTML = `${SVGS.LOCK}<span>${escapeHtmlOutput(profile.email)}</span>`;
      document.getElementById('profileModalAvatar').textContent = profile.initials;
      const overlay = document.getElementById('profileModalOverlay');
      overlay.style.display = 'grid';
      overlay.setAttribute('aria-hidden', 'false');
      setTimeout(() => document.getElementById('profileDisplayName')?.focus(), 40);

    function closeUserProfileModal() {

    async function saveUserProfile() {
      const user = firebase.auth().currentUser;
      if (!user) return triggerToast('Phiên đăng nhập không còn hợp lệ.', 'error');
      const displayName = String(document.getElementById('profileDisplayName')?.value || '').trim();
      const role = String(document.getElementById('profileRole')?.value || '').trim() || 'Giám định viên';
      const department = String(document.getElementById('profileDepartment')?.value || '').trim() || 'Bộ phận Giám định';
      if (displayName.length < 2) return triggerToast('Vui lòng nhập họ tên hiển thị hợp lệ.', 'error');
      const button = document.getElementById('btnSaveUserProfile');
      toggleButtonUIPendingState(button, true, 'Đang lưu...');
      const payload = { displayName, role, department, updatedAt: Date.now() };
      try {
        await user.updateProfile({ displayName });
        activeUserProfile = payload;
        try { localStorage.setItem(getProfileStorageKey(user.uid), JSON.stringify(payload)); } catch (storageError) { console.info('Local profile storage is unavailable.', storageError?.message || storageError); }
        try { await dbNodeInstance.ref(`users/${user.uid}/profile`).set(payload); } catch (cloudError) { console.info('Profile saved locally; cloud profile path is unavailable.', cloudError?.code || cloudError?.message || cloudError); }
        renderNavigationUserProfile(user, document.getElementById('navUserActionSpace'));
        const heroName = document.getElementById('heroUserName');
        const heroMeta = document.getElementById('heroUserMeta');
        const heroAvatar = document.getElementById('heroUserAvatar');
        if (heroName) heroName.textContent = displayName;
        if (heroMeta) heroMeta.textContent = `${role} · ${department}`;
        if (heroAvatar) heroAvatar.textContent = deriveInitials(displayName);
        closeUserProfileModal();
        triggerToast('Thông tin người dùng đã được cập nhật.');
      } catch (error) {
        console.error(error);
        triggerToast('Không thể cập nhật hồ sơ người dùng: ' + (error.message || 'Lỗi không xác định'), 'error');
      } finally {
        toggleButtonUIPendingState(button, false, 'Lưu hồ sơ');
      }
    }

      labelSummary.textContent = `${filesList.length} ảnh đã sẵn sàng tải lên.`;
      filesList.slice(0, 16).forEach((file, index) => {
        const readerBlobUrl = URL.createObjectURL(file);

    function parseRequestedItemNames(rawValue) {
      const seen = new Set();
      return String(rawValue || '').split(/\r?\n|;/).map(item => item.trim().replace(/^[-•\d.)\s]+/, '')).filter(Boolean).filter(item => {
        const normalized = item.toLocaleLowerCase('vi');
        if (seen.has(normalized)) return false;
        seen.add(normalized);
        return true;
      });
    }

    function toggleSuggestionItem(itemName) {
      const firstEmptyIndex = caseRequestedItemsDraft.findIndex(item => !item.tenHangMuc.trim());
      const existingIndex = caseRequestedItemsDraft.findIndex(item => item.tenHangMuc.trim().toLowerCase() === itemName.trim().toLowerCase());
      
      if (existingIndex > -1) {
        caseRequestedItemsDraft.splice(existingIndex, 1);
        if (caseRequestedItemsDraft.length === 0) {
          caseRequestedItemsDraft.push({ id: generateUniqueReqId(), tenHangMuc: '' });

        if (firstEmptyIndex > -1) {
          caseRequestedItemsDraft[firstEmptyIndex].tenHangMuc = itemName;

          caseRequestedItemsDraft.push({ id: generateUniqueReqId(), tenHangMuc: itemName });

      renderRequestedItemsBuilder();

      ];
      renderRequestedItemsBuilder();

    function handleExcelRowKeydown(event, index) {
      const input = event.target;
      if (event.key === 'Enter') {
        event.preventDefault();
        if (index === caseRequestedItemsDraft.length - 1) {
          caseRequestedItemsDraft.push({ id: generateUniqueReqId(), tenHangMuc: '' });
          renderRequestedItemsBuilder();
          setTimeout(() => {
            const nextInput = document.getElementById(`excelInput_${index + 1}`);
            if (nextInput) nextInput.focus();
          }, 10);
        } else {
          const nextInput = document.getElementById(`excelInput_${index + 1}`);
          if (nextInput) nextInput.focus();
        }
      } else if (event.key === 'ArrowDown') {
        event.preventDefault();
        if (index < caseRequestedItemsDraft.length - 1) {
          const nextInput = document.getElementById(`excelInput_${index + 1}`);
          if (nextInput) nextInput.focus();
        } else if (input.value.trim()) {
          addExcelRowAtEnd();
        }
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        if (index > 0) {
          const nextInput = document.getElementById(`excelInput_${index - 1}`);
          if (nextInput) nextInput.focus();
        }
      } else if (event.key === 'Backspace' && input.value === '' && caseRequestedItemsDraft.length > 1) {
        event.preventDefault();
        removeRequestedItemDraft(index);
      }
    }

    function handleExcelRowPaste(event, index) {
      const pasteData = (event.clipboardData || window.clipboardData).getData('text');
      if (!pasteData) return;
      const lines = pasteData.split(/\r?\n/).map(line => line.trim().replace(/^[-•\d.)\s]+/, '')).filter(Boolean);
      if (lines.length <= 1) return;
      
      event.preventDefault();
      caseRequestedItemsDraft[index].tenHangMuc = lines[0];
      
      const afterSlice = caseRequestedItemsDraft.slice(0, index + 1);
      const remainingSlice = caseRequestedItemsDraft.slice(index + 1);
      const pastedItems = lines.slice(1).map(line => ({ id: generateUniqueReqId(), tenHangMuc: line }));
      caseRequestedItemsDraft = [...afterSlice, ...pastedItems, ...remainingSlice];
      
      renderRequestedItemsBuilder();
      const lastPastedIndex = index + lines.length - 1;
      setTimeout(() => {
        const lastPastedInput = document.getElementById(`excelInput_${lastPastedIndex}`);
        if (lastPastedInput) lastPastedInput.focus();
      }, 10);
    }

                      oninput="updateRequestedItemDraft(${index}, this.value)"

                      autocomplete="off"
                    />
                  </td>
                  <td class="cell-action">
                    <button type="button" class="excel-row-del-btn" onclick="removeRequestedItemDraft(${index})" title="Xóa dòng">&times;</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          <div class="excel-grid-footer">
            <button type="button" class="btn-premium btn-secondary btn-inline" onclick="addExcelRowAtEnd()">+ Thêm dòng mới (Enter)</button>
            <button type="button" class="btn-premium btn-secondary btn-inline danger" onclick="clearAllExcelRows()" style="border-color:var(--btn-danger-border); color:var(--btn-danger-text); background:transparent;">Xóa sạch bảng</button>
            <span class="excel-grid-tip">Mẹo: Nhấn Enter hoặc Mũi tên Xuống để thêm dòng. Có thể Ctrl+V dán hàng loạt từ Excel.</span>
          </div>

    function executeUIRenderCasesTable(casesPayload) {
      if (typeof casesPayload !== 'undefined') cachedCasesPayload = casesPayload;
      const tableBody = document.getElementById('tblCasesBodyContainer');
      if (!tableBody) return;
      
      const allCases = cachedCasesPayload || {};
      const allEntries = Object.entries(allCases).sort((a,b) => Number(b[1].createdAt || 0) - Number(a[1].createdAt || 0));
      
      const searchQuery = String(document.getElementById('caseSearchInput')?.value || '').trim().toLocaleLowerCase('vi');
      const filteredEntries = allEntries.filter(([,item]) => {
        const matchesText = !searchQuery || `${item.bienSo || ''} ${item.tenGara || ''} ${item.nguoiTao?.tenHienThi || ''} ${item.nguoiTao?.email || ''}`.toLocaleLowerCase('vi').includes(searchQuery);
        const isDone = item.trangThai === STATUS_COMPLETED;
        const matchesStatus = activeCaseFilter === 'all' || (activeCaseFilter === 'completed' && isDone) || (activeCaseFilter === 'pending' && !isDone);
        return matchesText && matchesStatus;
      });
      
      if (!filteredEntries.length) {
        tableBody.innerHTML = `<tr><td colspan="5"><div class="empty-state-premium"><div class="empty-icon">${SVGS.SEARCH}</div><strong>Không tìm thấy hồ sơ phù hợp</strong><p>Thử thay đổi từ khóa hoặc bộ lọc trạng thái.</p></div></td></tr>`;
        return;
      }
      tableBody.innerHTML = filteredEntries.map(([uniqueKeyToken, entityNode]) => {
        const isCaseDone = entityNode.trangThai === STATUS_COMPLETED;
        const targetBadgeClass = isCaseDone ? 'completed' : 'pending';
        const partnerPortalInputLink = `${getCleanOriginBaseUrl()}?idCa=${uniqueKeyToken}`;
        const internalResultReviewLink = `${getCleanOriginBaseUrl()}?idCa=${uniqueKeyToken}&view=result`;
        const dateInfo = formatCaseTimestamp(entityNode.createdAt);

    function formatCaseTimestamp(timestamp) {
      if (!timestamp) return { date: 'Chưa ghi nhận', time: '—' };
      const date = new Date(Number(timestamp));
      if (Number.isNaN(date.getTime())) return { date: 'Chưa ghi nhận', time: '—' };
      return {
        date: new Intl.DateTimeFormat('vi-VN', { day:'2-digit', month:'2-digit', year:'numeric' }).format(date),
        time: new Intl.DateTimeFormat('vi-VN', { hour:'2-digit', minute:'2-digit' }).format(date)
      };
    }

    async function pipelineTriggerCaseCreationFlow() {
      const plateInputVal = document.getElementById('txtPlateNumber').value.trim();
      const garageInputVal = document.getElementById('txtGaragePartner').value.trim();
      const fileInputElement = document.getElementById('fileImageUploader');
      const imagesFileList = fileInputElement ? Array.from(fileInputElement.files || []) : [];
      const requestedItemNames = caseRequestedItemsDraft.map(item => String(item.tenHangMuc || '').trim()).filter(Boolean);

      if (!plateInputVal || !garageInputVal) {
        triggerToast('Vui lòng nhập biển số xe và Garage phụ trách.', 'error');
        return;
      }
      
      if (activeCreateFlowMode === 'image' && !imagesFileList.length) {
        triggerToast('Vui lòng tải lên ít nhất một ảnh hiện trường.', 'error');
        return;
      }
      if (activeCreateFlowMode === 'excel' && !requestedItemNames.length) {
        triggerToast('Vui lòng nhập ít nhất một hạng mục phụ tùng cần yêu cầu ảnh.', 'error');
        return;
      }

      toggleUploadOverlay(true, imagesFileList.length ? 'Đang mã hóa dữ liệu hình ảnh...' : 'Đang khởi tạo yêu cầu...', 'Chuẩn bị cấu trúc hồ sơ đối chiếu hai chiều...', 0);

      try {
        const secureHostedImageUrlsArray = imagesFileList.length ? await executionParallelImagesUploadCore(imagesFileList) : [];
        
        toggleUploadOverlay(true, 'Khởi tạo thực thể cấu trúc...', 'Đồng bộ trường dữ liệu sang máy chủ đám mây...', 95);

        const generatedCaseUniqueToken = 'CASE_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5).toUpperCase();
        const mappedImageNodeObjects = secureHostedImageUrlsArray.map(secureUrl => ({
          linkAnh: secureUrl,
          hangMucBaoGia: ""
        }));

        const currentUser = firebase.auth().currentUser;
        const currentProfile = getAuthenticatedUserPresentation(currentUser);
        const requestedEvidenceNodes = requestedItemNames.map((itemName, index) => ({
          tenHangMuc: itemName,
          thuTu: index + 1,
          hinhAnhGarage: []
        }));
        const finalPayloadStructure = {
          idCa: generatedCaseUniqueToken,
          bienSo: plateInputVal,
          tenGara: garageInputVal,
          trangThai: STATUS_PENDING,
          soLuongAnh: mappedImageNodeObjects.length,
          soLuongHangMucYeuCauAnh: requestedEvidenceNodes.length,
          hinhAnh: mappedImageNodeObjects,
          hangMucYeuCauAnh: requestedEvidenceNodes,
          nguoiTao: {
            uid: currentUser?.uid || '',
            email: currentProfile.email,
            tenHienThi: currentProfile.displayName,
            chucDanh: currentProfile.role,
            donVi: currentProfile.department
          },
          createdAt: firebase.database.ServerValue.TIMESTAMP
        };

        await dbNodeInstance.ref(`cases/${generatedCaseUniqueToken}`).set(finalPayloadStructure);
        triggerToast('Dữ liệu nghiệp vụ ca xe đã được đẩy lên Cloud.');

        renderInlineCreationSuccessPanel(finalPayloadStructure);

        resetCaseCreationForm();

        setTimeout(() => {
          switchWorkspaceTab('list');
        }, 3200);

      } catch (exception) {
        console.error(exception);
        triggerToast(exception.message || 'Lỗi truyền tải đa luồng.', 'error');
      } finally {
        toggleUploadOverlay(false); 
      }
    }

    async function executionParallelImagesUploadCore(filesArray) {
      let resolvedCounter = 0;
      const totalFilesCount = filesArray.length;

      const parallelPromisesPool = filesArray.map(async (fileItem) => {
        try {
          const cloudSecureUrl = await uploadSingleImageToCloudinaryEngine(fileItem);
          resolvedCounter++;
          
          const accumulatedPercentage = Math.round((resolvedCounter / totalFilesCount) * 100);
          toggleUploadOverlay(true, `Đang xử lý gói ảnh dữ liệu (${resolvedCounter}/${totalFilesCount})`, `Luồng truyền tải song song ổn định: ${accumulatedPercentage}%`, accumulatedPercentage);
          
          return cloudSecureUrl;
        } catch (error) {
          throw new Error(`Lỗi tệp [${fileItem.name}]: ${error.message}`);
        }
      });

      return await Promise.all(parallelPromisesPool);
    }

    async function uploadSingleImageToCloudinaryEngine(fileBlob) {
      const targetApiEndpointUrl = `https://api.cloudinary.com/v1_1/${encodeURIComponent(CONFIG.CLOUDINARY_CLOUD_NAME)}/image/upload`;
      const multiPartFormData = new FormData();
      multiPartFormData.append('file', fileBlob);
      multiPartFormData.append('upload_preset', CONFIG.CLOUDINARY_UPLOAD_PRESET);
      if (CONFIG.CLOUDINARY_FOLDER) {
        multiPartFormData.append('folder', CONFIG.CLOUDINARY_FOLDER);
      }

      const networkResponse = await fetch(targetApiEndpointUrl, { method: 'POST', body: multiPartFormData });
      const parsedTextResponse = await networkResponse.text();
      
      let convertedJSONData;
      try { convertedJSONData = JSON.parse(parsedTextResponse); } catch(err) { throw new Error('Phản hồi Server lỗi.'); }

      if (!networkResponse.ok || !convertedJSONData.secure_url) {
        throw new Error(convertedJSONData?.error?.message || 'Lỗi API.');
      }
      return convertedJSONData.secure_url;
    }

    function toggleUploadOverlay(show, title = '', subtitle = '', percent = 0) {
      const overlay = document.getElementById('uploadOverlay');
      const tEl = document.getElementById('uploadOverlayTitle');
      const sEl = document.getElementById('uploadOverlaySubtitle');
      const bar = document.getElementById('uploadOverlayProgressFill');
      if (!overlay) return;

      if (show) {
        overlay.style.display = 'grid';
        if (title) tEl.textContent = title;
        if (subtitle) sEl.textContent = subtitle;
        if (bar) bar.style.width = `${percent}%`;
      } else {
        overlay.style.display = 'none';
      }
    }

    function normalizeEvidenceImageUrls(item) {
      const rawValue = item?.hinhAnhGarage ?? item?.linkAnhGarage ?? [];
      if (Array.isArray(rawValue)) return rawValue.filter(Boolean);
      if (rawValue && typeof rawValue === 'object') return Object.values(rawValue).filter(Boolean);
      return rawValue ? [rawValue] : [];
    }

    function validateGarageEvidenceFiles(files, existingCount = 0) {
      const allowed = ['image/jpeg','image/png','image/webp','image/heic','image/heif'];
      const valid = [];
      const rejected = [];
      files.forEach(file => {
        if (!allowed.includes(file.type) && !file.name.match(/\.(jpe?g|png|webp|heic|heif)$/i)) rejected.push(`${file.name}: sai định dạng`);
        else if (file.size > 20 * 1024 * 1024) rejected.push(`${file.name}: vượt 20MB`);
        else valid.push(file);
      });
      const remaining = Math.max(0, 12 - existingCount);
      if (valid.length > remaining) {
        valid.splice(remaining).forEach(file => rejected.push(`${file.name}: vượt giới hạn 12 ảnh`));
      }
      return { valid, rejected };
    }

    async function prepareImageFileForUpload(file) {
      if (!file.type.match(/^image\/(jpeg|png|webp)$/) || file.size < 2.5 * 1024 * 1024) return file;
      try {
        const bitmap = await createImageBitmap(file);
        const maxEdge = 2560;
        const ratio = Math.min(1, maxEdge / Math.max(bitmap.width, bitmap.height));
        if (ratio >= .98) { bitmap.close(); return file; }
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(bitmap.width * ratio);
        canvas.height = Math.round(bitmap.height * ratio);
        canvas.getContext('2d', { alpha:false }).drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        bitmap.close();
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', .88));
        if (!blob) return file;
        return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type:'image/jpeg', lastModified:Date.now() });
      } catch (_) { return file; }
    }

      const percentNode = document.getElementById(`evidenceUploadPercent_${index}`);
      const fill = document.getElementById(`evidenceUploadFill_${index}`);
      if (textNode) textNode.textContent = text;

    async function handleGarageEvidenceFiles(requestIndex, incomingFiles) {
      if (!localActiveRequestedItems[requestIndex] || !incomingFiles.length) return;
      const currentUrls = normalizeEvidenceImageUrls(localActiveRequestedItems[requestIndex]);
      const { valid, rejected } = validateGarageEvidenceFiles(incomingFiles, currentUrls.length);
      if (rejected.length) triggerToast(rejected.slice(0,2).join(' · ') + (rejected.length > 2 ? ` · +${rejected.length-2} lỗi khác` : ''), 'warning');
      if (!valid.length) return;
      garageUploadsInFlight += 1;
      setEvidenceUploadUI(requestIndex, true, `Chuẩn bị ${valid.length} ảnh...`, 2);
      try {
        const newUrls = [];
        for (let i = 0; i < valid.length; i += 1) {
          const prepared = await prepareImageFileForUpload(valid[i]);
          const progress = Math.round((i / valid.length) * 90) + 5;
          setEvidenceUploadUI(requestIndex, true, `Đang tải ảnh ${i+1}/${valid.length}: ${valid[i].name}`, progress);
          // FIXED: Clean syntax instead of garbled token
          newUrls.push(await uploadSingleImageToCloudinaryEngine(prepared));
        }
        localActiveRequestedItems[requestIndex].hinhAnhGarage = [...currentUrls, ...newUrls];
        await dbNodeInstance.ref(`cases/${localActiveCaseNode.idCa}/hangMucYeuCauAnh`).set(localActiveRequestedItems);
        setEvidenceUploadUI(requestIndex, true, 'Đã lưu ảnh vào hồ sơ', 100);
        refreshSingleEvidenceCard(requestIndex);
        refreshGarageProgressUI();
        triggerToast(`Đã lưu ${newUrls.length} ảnh cho hạng mục “${localActiveRequestedItems[requestIndex].tenHangMuc}”.`);
      } catch (error) {
        console.error(error);
        triggerToast('Không thể tải ảnh: ' + (error.message || 'Lỗi kết nối'), 'error');
      } finally {
        garageUploadsInFlight = Math.max(0, garageUploadsInFlight - 1);
        const input = document.getElementById(`garageEvidenceInput_${requestIndex}`);
        if (input) input.value = '';
        setTimeout(() => setEvidenceUploadUI(requestIndex, false), 900);
      }
    }

      const confirmed = await showConfirmModal('Xóa ảnh minh chứng', `Xóa ảnh số ${imageIndex+1} khỏi hạng mục “${item.tenHangMuc}”?`);

    async function pipelineTriggerGarageDataLockSubmission() {
      if (garageUploadsInFlight > 0) return triggerToast('Ảnh đang được tải lên. Vui lòng đợi tiến trình hiện tại hoàn tất.', 'warning');
      const DOMTextareaElements = Array.from(document.querySelectorAll('.garage-quote-textarea-node'));
      const emptyFieldsCounter = DOMTextareaElements.filter(tx => !tx.value.trim()).length;
      if (emptyFieldsCounter > 0) {
        const firstEmpty = DOMTextareaElements.find(tx => !tx.value.trim());
        firstEmpty?.scrollIntoView({ behavior:'smooth', block:'center' });
        triggerToast(`Còn ${emptyFieldsCounter} ảnh hiện trạng chưa được nhập tên hạng mục.`, 'error');
        return;
      }
      const missingEvidenceIndexes = localActiveRequestedItems.map((item,index) => normalizeEvidenceImageUrls(item).length ? null : index).filter(index => index !== null);
      if (missingEvidenceIndexes.length) {
        document.querySelector(`[data-evidence-dropzone="${missingEvidenceIndexes[0]}"]`)?.scrollIntoView({ behavior:'smooth', block:'center' });
        triggerToast(`Còn ${missingEvidenceIndexes.length} hạng mục chưa có ảnh minh chứng.`, 'error');
        return;
      }
      const finalFreezeConfirmation = await showConfirmModal('Khóa và gửi hồ sơ', 'Tất cả ghi chú and ảnh đã được lưu. Sau khi xác nhận, Garage không thể chỉnh sửa hồ sơ này nữa.');
      if (!finalFreezeConfirmation) return;
      try {
        toggleUploadOverlay(true, 'Đang hoàn tất hồ sơ...', 'Kiểm tra và đồng bộ dữ liệu cuối cùng...', 35);
        await flushGarageAutosaves();
        toggleUploadOverlay(true, 'Đang khóa hồ sơ...', 'Cập nhật trạng thái kết quả trên Firebase...', 85);
        await dbNodeInstance.ref(`cases/${localActiveCaseNode.idCa}`).update({
          hinhAnh: localActiveImageStack,
          hangMucYeuCauAnh: localActiveRequestedItems,
          trangThai: STATUS_COMPLETED,
          garageSubmittedAt: firebase.database.ServerValue.TIMESTAMP
        });
        triggerToast('Garage đã gửi đầy đủ hạng mục và ảnh minh chứng.');
        window.history.replaceState({}, '', `${getCleanOriginBaseUrl()}?idCa=${encodeURIComponent(localActiveCaseNode.idCa)}`);
      } catch (err) {
        console.error(err);
        triggerToast('Lỗi đồng bộ truyền tải: ' + err.message, 'error');
      } finally { toggleUploadOverlay(false); }
    }

            </div>
          ` : '';

          return `<article class="evidence-result-card"><div class="evidence-result-title"><div class="evidence-request-number">${String(index+1).padStart(2,'0')}</div><div><h3>${escapeHtmlOutput(item.tenHangMuc || `Hạng mục ${index+1}`)}</h3><p>${urls.length} ảnh do Garage cung cấp</p></div></div>${item.ghiChuGarage ? `<div class="result-content" style="margin-bottom:14px"><strong style="display:block;margin-bottom:6px;color:var(--primary);font-size:9px;letter-spacing:.08em;text-transform:uppercase">Ghi chú Garage</strong>${escapeHtmlOutput(item.ghiChuGarage)}</div>` : ``}${urls.length ? `<div class="evidence-result-gallery">${urls.map((url,imageIndex) => `<button type="button" class="evidence-result-image" title="Mở ảnh ${imageIndex+1}" onclick="openLightbox('${escapeAttributeData(url)}')"><img src="${escapeAttributeData(url)}" alt="Ảnh Garage cung cấp ${imageIndex+1}" loading="lazy"></button>`).join('')}</div>` : `<div class="evidence-empty">Garage chưa cung cấp ảnh cho hạng mục này.</div>`}${decisionMarkup}</article>`;
        }).join('')}` : '';

      const activeThemeIcon = currentTheme === 'light' ? SVGS.MOON : SVGS.SUN;
      rootContainer.innerHTML = `
        <div class="portal-shell">
          <header class="portal-topbar">
            <div><div class="eyebrow">Verified comparison result</div><h1>Kết quả đối chiếu Garage</h1><p>Xem lại đầy đủ người tạo hồ sơ, nội dung Garage khai báo và ảnh minh chứng theo từng hạng mục.</p></div>
            <div class="portal-counter-stack">
              <button class="btn-premium btn-secondary nav-logout-icon theme-btn theme-toggle-btn-node" title="Chuyển đổi giao diện Sáng/Tối" onclick="toggleTheme()">${activeThemeIcon}</button>
              <div class="portal-counter">Đã ghi hạng mục<strong>${String(completedItems).padStart(2,'0')}/${String(localActiveImageStack.length).padStart(2,'0')}</strong></div>
              <div class="portal-counter">Đã cung cấp ảnh<strong>${String(completedEvidenceItems).padStart(2,'0')}/${String(localActiveRequestedItems.length).padStart(2,'0')}</strong></div>
            </div>
          </header>
          <div class="focus-portal-layout">${buildHtmlComponentSidebarCaseMetadata(renderMode)}<div class="image-workspace-list">${imageResultsSection}${evidenceResultsSection}</div></div>
        </div>`;
      
      if (renderMode === 'result') updateAdjusterSummaryStats();
      initializeSidebarCollapse();
    }

    function compileRawTextSummaryReportBlock() {
      const node = localActiveCaseNode || {};
      const outputLinesBuffer = [];

      outputLinesBuffer.push('==================================================');
      outputLinesBuffer.push('   BIÊN BẢN TỔNG HỢP HẠNG MỤC PHƯƠNG TIỆN CƠ GIỚI   ');
      outputLinesBuffer.push('==================================================');
      outputLinesBuffer.push(`- Mã ca giám định:    ${node.idCa || ''}`);
      outputLinesBuffer.push(`- Biển kiểm soát xe:  ${node.bienSo || ''}`);
      outputLinesBuffer.push(`- Đơn vị sửa chữa:    ${node.tenGara || ''}`);
      outputLinesBuffer.push(`- Người tạo hồ sơ:    ${node.nguoiTao?.tenHienThi || node.nguoiTao?.email || 'Không ghi nhận'}`);
      outputLinesBuffer.push(`- Tình trạng dữ liệu: ${node.trangThai || ''}`);
      outputLinesBuffer.push('--------------------------------------------------\n');

      localActiveImageStack.forEach((item, index) => {
        outputLinesBuffer.push(`[VÙNG ẢNH KHAI BÁO SỐ ${index + 1}]`);
        outputLinesBuffer.push(`+ Chi tiết hạng mục bộ phận: \n${item.hangMucBaoGia || 'Không ghi nhận hạng mục.'}`);
        outputLinesBuffer.push(`+ URL ảnh chứng cứ gốc: ${item.linkAnh || ''}`);
        outputLinesBuffer.push('');
      });

      localActiveRequestedItems.forEach((item,index) => {
        outputLinesBuffer.push(`[HẠNG MỤC YÊU CẦU ẢNH SỐ ${index + 1}]`);
        outputLinesBuffer.push(`+ Tên hạng mục: ${item.tenHangMuc || ''}`);
        if (item.ghiChuGarage) outputLinesBuffer.push(`+ Ghi chú Garage: ${item.ghiChuGarage}`);
        const decisionText = {
          'chua': 'Chưa phê duyệt',
          'thay_moi': 'Đồng ý thay mới',
          'sua_chua': 'Đồng ý sửa chữa',
          'tu_choi': 'Từ chối bồi thường'
        }[item.phuongAnDuyet || 'chua'];
        const amount = Number(item.soTienDuyet || 0).toLocaleString('vi-VN') + ' đ';
        outputLinesBuffer.push(`+ Phương án GĐV duyệt: ${decisionText}`);
        outputLinesBuffer.push(`+ Số tiền duyệt: ${amount}`);
        const urls = normalizeEvidenceImageUrls(item);
        if (urls.length) urls.forEach((url,imageIndex) => outputLinesBuffer.push(`+ Ảnh Garage ${imageIndex + 1}: ${url}`));
        else outputLinesBuffer.push('+ Ảnh Garage: Chưa cung cấp.');
        outputLinesBuffer.push('');
      });

      return outputLinesBuffer.join('\n');
    }

    function executeCopyAggregatedRawText() {
      executeTextCopyToClipboardRawString(compileRawTextSummaryReportBlock());
    }

    function triggerToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.setAttribute('role', 'status');
      toast.textContent = String(message || 'Đã hoàn tất thao tác.');
      container.appendChild(toast);
      window.setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        window.setTimeout(() => toast.remove(), 260);
      }, 3800);
    }

    function showConfirmModal(title, message) {
      return new Promise((resolve) => {
        const overlay = document.getElementById('modalOverlay');
        const titleNode = document.getElementById('modalTitle');
        const messageNode = document.getElementById('modalMsg');
        const cancelButton = document.getElementById('modalCancel');
        const confirmButton = document.getElementById('modalConfirm');
        if (!overlay || !cancelButton || !confirmButton) {
          resolve(window.confirm(message));
          return;
        }
        titleNode.textContent = title || 'Xác nhận thao tác';
        messageNode.textContent = message || 'Bạn có chắc chắn muốn tiếp tục?';
        overlay.style.display = 'grid';
        document.body.style.overflow = 'hidden';
        const finish = (result) => {
          overlay.style.display = 'none';
          document.body.style.overflow = '';
          cancelButton.removeEventListener('click', onCancel);
          confirmButton.removeEventListener('click', onConfirm);
          overlay.removeEventListener('click', onBackdrop);
          document.removeEventListener('keydown', onKeydown);
          resolve(result);
        };
        const onCancel = () => finish(false);
        const onConfirm = () => finish(true);
        const onBackdrop = (event) => { if (event.target === overlay) finish(false); };
        const onKeydown = (event) => { if (event.key === 'Escape') finish(false); };
        cancelButton.addEventListener('click', onCancel);
        confirmButton.addEventListener('click', onConfirm);
        overlay.addEventListener('click', onBackdrop);
        document.addEventListener('keydown', onKeydown);
        confirmButton.focus();
      });
    }

    /****************************************************
     * GENERIC INFRASTRUCTURE HELPERS UTILS
     ****************************************************/
    function renderLoadingLayoutIndicator(friendlyMessage) {
      rootContainer.innerHTML = `<div class="p-card state-card"><div class="spinner-premium"></div><h3 style="font-size:16px">${escapeHtmlOutput(friendlyMessage)}</h3><p style="margin-top:6px;color:var(--text-muted);font-size:11px">Đang đồng bộ dữ liệu thời gian thực.</p></div>`;
    }

    function renderErrorLayoutState(errorMessage) {
      rootContainer.innerHTML = `<div class="p-card state-card"><div class="state-icon" style="color:var(--danger)">${SVGS.TRASH}</div><h2 style="font-size:20px">Không thể mở tài nguyên</h2><p style="margin:9px 0 22px;color:var(--text-muted);font-size:12px;line-height:1.7">${escapeHtmlOutput(errorMessage)}</p><button class="btn-premium" onclick="window.location.reload()">Tải lại trang</button></div>`;
    }

    function renderFatalConfigurationFailure() {
      rootContainer.innerHTML = `
        <div class="p-card" style="border-top:4px solid var(--danger); margin-top:40px; padding: 24px;">
          <h2 style="color:var(--danger); font-size:18px;">Lỗi xác thực cấu hình lõi phân quyền</h2>
          <p style="margin-top:10px; font-size:13px; color:var(--text-muted); line-height:1.6;">
            Cấu hình khóa ứng dụng trong đối tượng cấu trúc <strong>CONFIG.FIREBASE</strong> hoặc khóa công khai tài khoản <strong>CLOUDINARY</strong> chứa chuỗi ký tự tạm rỗng hoặc "PASTE_". Vui lòng kiểm tra lại file index.html.
          </p>
        </div>
      `;
    }

    function toggleButtonUIPendingState(buttonDomNode, isBusyState, overlayTextValue) {
      if (!buttonDomNode) return;
      if (isBusyState) {
        buttonDomNode.setAttribute('data-preserved-text', buttonDomNode.textContent);
        buttonDomNode.textContent = overlayTextValue;
        buttonDomNode.disabled = true;
      } else {
        buttonDomNode.textContent = buttonDomNode.getAttribute('data-preserved-text') || overlayTextValue;
        buttonDomNode.disabled = false;
      }
    }

    function executeTextCopyToClipboardRawString(textStringPayload) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textStringPayload)
          .then(() => triggerToast('Đã sao chép vào bộ nhớ tạm.'))
          .catch(() => fallbackExecutionTextCopyLegacy(textStringPayload));
      } else {
        fallbackExecutionTextCopyLegacy(textStringPayload);
      }
    }

    function fallbackExecutionTextCopyLegacy(fallbackText) {
      const transientTextarea = document.createElement('textarea');
      transientTextarea.value = fallbackText; transientTextarea.style.position = 'fixed'; transientTextarea.style.left = '-9999px';
      document.body.appendChild(transientTextarea); transientTextarea.focus(); transientTextarea.select();
      try { document.execCommand('copy'); triggerToast('Đã sao chép liên kết.'); } catch (err) { triggerToast('Lỗi trích xuất bộ nhớ.', 'error'); }
      document.body.removeChild(transientTextarea);
    }

    function openLightbox(imageSourceUrl) {
      const lightboxContainer = document.getElementById('lightbox');
      document.getElementById('lightboxImg').src = imageSourceUrl;
      lightboxContainer.classList.add('show');
    }

    function closeLightbox() {
      const lightboxContainer = document.getElementById('lightbox');
      lightboxContainer.classList.remove('show');
      document.getElementById('lightboxImg').src = '';
    }

    function getCleanOriginBaseUrl() {
      return window.location.href.split('?')[0].split('#')[0].replace(/index\.html$/i, '');
    }

    function isSystemConfigHealthy() {
      return (
        CONFIG.FIREBASE.apiKey && !CONFIG.FIREBASE.apiKey.includes('PASTE_') &&
        CONFIG.CLOUDINARY_CLOUD_NAME && !CONFIG.CLOUDINARY_CLOUD_NAME.includes('PASTE_')
      );
    }

    function escapeHtmlOutput(unsafeStringValue) {
      return String(unsafeStringValue || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function escapeAttributeData(unsafeAttrValue) { return escapeHtmlOutput(unsafeAttrValue); }
    function clearActiveObjectUrls() { activeObjectUrls.forEach(url => URL.revokeObjectURL(url)); activeObjectUrls = []; }
  </script>
