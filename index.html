<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hệ thống Đối chiếu Ảnh Giám định Xe Cơ giới - Ultra Premium</title>

  <!-- Google Fonts & Firebase SDK Compatibility Version -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card: rgba(17, 24, 39, 0.7);
      --card-solid: #111827;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);
      
      /* Luxury Color Palette */
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --primary-gradient: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
      --dark: #030712;
      --danger: #f43f5e;
      --success: #10b981;
      --warning: #f59e0b;
      
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 6px;
      --shadow-premium: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      color: var(--text-main);
      background-color: var(--bg);
      /* Ambient Glowing Orbs Background Effect */
      background-image: 
        radial-gradient(at 10% 10%, rgba(14, 165, 233, 0.1) 0px, transparent 40%),
        radial-gradient(at 90% 80%, rgba(37, 99, 235, 0.08) 0px, transparent 45%);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* SVG Icon Infrastructure Global Rules */
    .svg-icon {
      width: 1.25rem;
      height: 1.25rem;
      display: inline-block;
      vertical-align: middle;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .svg-icon-lg { width: 2.5rem; height: 2.25rem; }
    .svg-icon-sm { width: 1rem; height: 1rem; }

    /* Ultra-Premium Toast Banner Alerts */
    .toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      left: 24px;
      z-index: 5000;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
    }
    @media (min-width: 640px) { .toast-container { left: auto; width: 380px; } }

    .toast {
      background: #1f2937;
      border: 1px solid var(--border);
      padding: 16px 20px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-premium);
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
      transform: translateY(-20px);
      opacity: 0;
      animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      font-weight: 600;
      font-size: 14px;
    }
    @keyframes slideIn { to { transform: translateY(0); opacity: 1; } }
    .toast.success { border-left: 4px solid var(--success); color: #ecfdf5; }
    .toast.error { border-left: 4px solid var(--danger); color: #fef2f2; }
    .toast.warning { border-left: 4px solid var(--warning); color: #fffbeb; }

    /* Parallel Task Loading Overlay screen */
    .upload-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(12px);
      z-index: 4000;
      display: none;
      place-items: center;
      padding: 20px;
    }
    .upload-overlay-card {
      background: var(--card-solid);
      border: 1px solid var(--border);
      padding: 40px 24px;
      border-radius: var(--radius-lg);
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-premium);
    }
    .upload-overlay-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; color: var(--text-main); letter-spacing: -0.01em; }
    .upload-overlay-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }

    /* Custom Premium Modal Dialog System */
    .p-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.6);
      backdrop-filter: blur(8px);
      z-index: 3500;
      display: none;
      place-items: center;
      padding: 16px;
    }
    .p-modal { background: var(--card-solid); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px 24px; max-width: 440px; width: 100%; box-shadow: var(--shadow-premium); text-align: center; }
    .p-modal h3 { font-size: 18px; margin-bottom: 10px; font-weight: 800; letter-spacing: -0.01em; }
    .p-modal p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
    .p-modal-btns { display: flex; gap: 12px; }

    /* Workspace Architecture Base Grid Grid Layout */
    .app-container { max-width: 1340px; margin: 0 auto; padding: 16px 16px 80px; }
    @media (min-width: 640px) { .app-container { padding: 32px 24px 100px; } }

    /* Premium Navigation System App Bar Header */
    .premium-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      padding: 16px 20px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      box-shadow: var(--shadow-premium);
    }
    @media (min-width: 640px) { .premium-nav { padding: 20px 28px; border-radius: var(--radius-lg); margin-bottom: 40px; } }
    .nav-brand { display: flex; align-items: center; gap: 14px; }
    .nav-logo { width: 44px; height: 44px; background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: var(--radius-md); display: grid; place-items: center; color: var(--primary); }
    .nav-titles h1 { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; color: var(--text-main); }
    .nav-titles p { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

    /* Metric Smart Widgets Grid panels */
    .premium-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    @media (min-width: 640px) { .premium-stats { gap: 24px; margin-bottom: 40px; } }
    .stat-box { background: var(--card); border: 1px solid var(--border); backdrop-filter: blur(10px); border-radius: var(--radius-md); padding: 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-premium); transition: var(--transition); }
    @media (min-width: 640px) { .stat-box { border-radius: var(--radius-lg); padding: 24px; } }
    .stat-box:hover { border-color: var(--primary); box-shadow: 0 10px 30px -10px rgba(56, 189, 248, 0.15); }
    .stat-info .stat-val { font-size: 32px; font-weight: 800; line-height: 1.1; margin-top: 4px; color: var(--text-main); font-family: 'JetBrains Mono', monospace; }
    .stat-info .stat-lbl { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-icon-wrap { width: 44px; height: 44px; border-radius: var(--radius-md); display: grid; place-items: center; background: rgba(255,255,255,0.03); border: 1px solid var(--border); }

    /* Core Content Structure Splits viewports */
    .workspace-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 1024px) { .workspace-grid.two-cols { grid-template-columns: 440px 1fr; gap: 40px; align-items: start; } }
    
    .p-card { background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-premium); }
    @media (min-width: 640px) { .p-card { border-radius: var(--radius-lg); padding: 32px; } }
    .p-card-head { margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    .p-card-head h2 { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
    .p-card-head p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    /* Advanced Form Field controls */
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.02em; }
    .input-premium { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 16px; font-size: 14px; font-family: inherit; color: var(--text-main); background: rgba(0, 0, 0, 0.2); outline: none; transition: var(--transition); }
    .input-premium:focus { background: rgba(0, 0, 0, 0.4); border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary), 0 0 20px rgba(56, 189, 248, 0.15); }

    /* Cyber Drag Dropzone architecture panel */
    .dropzone { border: 2px dashed var(--border); border-radius: var(--radius-md); padding: 32px 20px; text-align: center; background: rgba(0, 0, 0, 0.15); cursor: pointer; transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .dropzone:hover { border-color: var(--primary); background: rgba(56, 189, 248, 0.02); color: var(--primary); }
    .dropzone p { font-size: 13px; color: var(--text-muted); font-weight: 600; }

    .preview-grid-premium { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
    .preview-thumb { aspect-ratio: 1; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); position: relative; }
    .preview-thumb img { width: 100%; height: 100%; object-fit: cover; }

    /* Modern Luxury Controls Buttons Modules */
    .btn-premium { appearance: none; border: 0; font-family: inherit; padding: 14px 24px; font-size: 14px; font-weight: 700; border-radius: var(--radius-md); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; color: #fff; background: var(--primary-gradient); box-shadow: 0 4px 20px rgba(2, 132, 199, 0.3); transition: var(--transition); width: 100%; min-height: 48px; text-decoration: none; }
    .btn-premium:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(2, 132, 199, 0.45); background: var(--primary-hover); }
    .btn-premium:active { transform: translateY(1px); }
    .btn-premium:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-secondary { background: rgba(255, 255, 255, 0.04); color: var(--text-main); box-shadow: none; border: 1px solid var(--border); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--border-hover); }
    .btn-danger-p { background: rgba(244, 63, 94, 0.1); color: var(--danger); box-shadow: none; border: 1px solid rgba(244, 63, 94, 0.2); }
    .btn-danger-p:hover { background: rgba(244, 63, 94, 0.16); border-color: var(--danger); }

    /* Horizontal Link Matrix Blocks */
    .p-share-container { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
    .p-share-row { display: flex; flex-direction: column; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; gap: 14px; transition: var(--transition); }
    @media (min-width: 640px) { .p-share-row { flex-direction: row; align-items: center; justify-content: space-between; gap: 24px; } }
    .p-share-row:hover { border-color: var(--primary); background: rgba(0, 0, 0, 0.3); }
    .p-share-meta { flex: 1; min-width: 0; }
    .p-share-label { font-size: 13px; font-weight: 700; color: var(--text-main); }
    .p-share-url-preview { font-size: 12px; color: var(--primary); font-family: 'JetBrains Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; opacity: 0.8; }
    .p-share-actions { display: flex; gap: 8px; }
    .btn-share-action { padding: 6px 16px; font-size: 13px; min-height: 38px; width: auto; flex: 1; }
    @media (min-width: 640px) { .btn-share-action { flex: initial; } }

    /* Advanced Management Table Frame viewports */
    .table-container { border-radius: var(--radius-md); border: 1px solid var(--border); overflow: hidden; background: rgba(0,0,0,0.1); }
    .p-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    .p-table th { background: rgba(255,255,255,0.02); padding: 16px; font-weight: 700; color: var(--text-muted); border-bottom: 1px solid var(--border); font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; }
    .p-table td { padding: 16px; border-bottom: 1px solid var(--border); vertical-align: middle; transition: var(--transition); }
    .p-table tr:last-child td { border-bottom: none; }
    .p-table tr:hover td { background: rgba(255, 255, 255, 0.02); }
    
    @media (max-width: 639px) {
      .p-table, .p-table tbody, .p-table tr, .p-table td { display: block; width: 100%; }
      .p-table thead { display: none; }
      .p-table tr { border-bottom: 12px solid #030712; padding: 16px 12px; background: rgba(255,255,255,0.01); }
      .p-table tr:last-child { border-bottom: none; }
      .p-table td { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed rgba(255,255,255,0.04); text-align: right; }
      .p-table td::before { content: attr(data-label); font-weight: 700; color: var(--text-muted); font-size: 12px; text-align: left; text-transform: uppercase; }
      .p-table td:last-child { border-bottom: none; flex-direction: column; align-items: stretch; padding-top: 16px; }
      .p-table td:last-child::before { display: none; }
      .p-table td > div { text-align: right; }
      .flex-actions-group { display: grid !important; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
      .flex-actions-group .btn-premium { width: 100% !important; padding: 10px 4px; font-size: 12px; min-height: 38px; }
    }

    .badge-status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .badge-status.pending { background: rgba(245, 158, 11, 0.08); color: var(--warning); border-color: rgba(245, 158, 11, 0.15); }
    .badge-status.completed { background: rgba(16, 185, 129, 0.08); color: var(--success); border-color: rgba(16, 185, 129, 0.15); }
    .flex-actions-group { display: flex; gap: 8px; }

    /* Sandbox Distraction-Free Focus Portals Layouts */
    .focus-portal-layout { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 1024px) { .focus-portal-layout { grid-template-columns: 380px 1fr; gap: 32px; align-items: start; } .sticky-sidebar { position: sticky; top: 24px; } }
    .image-workspace-list { display: flex; flex-direction: column; gap: 20px; }
    @media (min-width: 640px) { .image-workspace-list { gap: 32px; } }
    
    .premium-image-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-premium); display: grid; grid-template-columns: 1fr; }
    @media (min-width: 640px) { .premium-image-card { grid-template-columns: 1fr 1fr; border-radius: var(--radius-lg); } }

    .img-display-pane { background: #030712; display: grid; place-items: center; position: relative; min-height: 240px; border-right: 1px solid var(--border); }
    @media (min-width: 640px) { .img-display-pane { min-height: 340px; } }
    .img-display-pane img { width: 100%; height: 100%; object-fit: contain; max-height: 380px; cursor: zoom-in; transition: transform 0.3s ease; }
    .img-display-pane img:hover { transform: scale(1.01); }
    .img-pane-indicator { position: absolute; left: 14px; top: 14px; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); border: 1px solid var(--border); padding: 6px 14px; border-radius: 999px; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; }

    .inputs-entry-pane { padding: 20px; display: flex; flex-direction: column; justify-content: space-between; background: rgba(255,255,255,0.01); gap: 16px; }
    @media (min-width: 640px) { .inputs-entry-pane { padding: 28px; } }
    .inputs-entry-pane textarea { width: 100%; min-height: 140px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); border-radius: var(--radius-md); padding: 14px; font-family: inherit; font-size: 14px; color: var(--text-main); outline: none; resize: vertical; transition: var(--transition); line-height: 1.6; }
    .inputs-entry-pane textarea:focus { background: rgba(0,0,0,0.5); border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary), 0 0 20px rgba(56, 189, 248, 0.1); }
    
    .summary-row-box { background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 12px; }
    .p-progress-bar { height: 6px; background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden; margin-top: 12px; display: none; }
    .p-progress-bar.active { display: block; }
    .p-progress-fill { height: 100%; width: 0%; background: var(--primary-gradient); transition: width 0.2s ease; }

    /* Luxury Lightbox Window View */
    .premium-lightbox { position: fixed; inset: 0; background: rgba(3, 7, 18, 0.96); backdrop-filter: blur(12px); z-index: 6000; display: none; place-items: center; padding: 20px; opacity: 0; transition: opacity 0.2s ease; }
    .premium-lightbox.show { display: grid; opacity: 1; }
    .premium-lightbox img { max-width: 100%; max-height: 88vh; object-fit: contain; border-radius: var(--radius-md); box-shadow: 0 30px 70px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.05); }
    .lightbox-close-btn { position: absolute; top: 24px; right: 24px; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 24px; cursor: pointer; display: grid; place-items: center; transition: var(--transition); }
    .lightbox-close-btn:hover { background: rgba(255,255,255,0.1); transform: rotate(90deg); }

    .text-link-area { min-height: 80px; font-size: 13px; font-family: 'JetBrains Mono', monospace; color: var(--primary); background: rgba(0,0,0,0.4) !important; cursor: default; border-color: rgba(56, 189, 248, 0.2); }
    .spinner-premium { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.05); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.6s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state-text { text-align: center; color: var(--text-muted); font-style: italic; padding: 32px 16px; font-size: 14px; }

    /* Ultra-Premium Luxury Login System Card Space Matrix */
    .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 65vh; padding: 16px; width: 100%; }
    .login-card { background: var(--card); backdrop-filter: blur(30px); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 40px 32px; max-width: 420px; width: 100%; box-shadow: var(--shadow-premium); text-align: center; position: relative; }
    .login-card::before { content: ''; position: absolute; inset: 0; border-radius: var(--radius-lg); padding: 1px; background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
    .login-badge { display: inline-flex; font-size: 10px; font-weight: 800; background: rgba(56, 189, 248, 0.1); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.2); padding: 4px 12px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 16px; }
    .login-icon-frame { width: 56px; height: 56px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 50%; display: grid; place-items: center; margin: 0 auto 20px; color: var(--primary); }
  </style>
</head>
<body>

  <!-- Hệ thống thông báo tiêu chuẩn High-end Matrix -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Màn hình chờ khóa UI tải lên song song -->
  <div id="uploadOverlay" class="upload-overlay">
    <div class="upload-overlay-card">
      <div class="spinner-premium"></div>
      <div id="uploadOverlayTitle" class="upload-overlay-title">Đang đồng bộ ảnh tổn thất</div>
      <div id="uploadOverlaySubtitle" class="upload-overlay-subtitle">Tiến trình kết nối dữ liệu song song...</div>
      <div class="p-progress-bar active" style="margin-top: 0; background: rgba(255,255,255,0.03);">
        <div id="uploadOverlayProgressFill" class="p-progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- Hộp thoại xác nhận Pop-up Cao cấp -->
  <div id="modalOverlay" class="p-modal-overlay">
    <div class="p-modal">
      <h3 id="modalTitle">Xác nhận</h3>
      <p id="modalMsg">Bạn có chắc chắn muốn thực hiện hành động này?</p>
      <div class="p-modal-btns">
        <button id="modalCancel" class="btn-premium btn-secondary">Hủy</button>
        <button id="modalConfirm" class="btn-premium">Xác nhận</button>
      </div>
    </div>
  </div>

  <div class="app-container">
    <!-- Header App Bar Space -->
    <nav class="premium-nav">
      <div class="nav-brand" id="navBrandClick">
        <div class="nav-logo">
          <svg class="svg-icon svg-icon-lg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div class="nav-titles">
          <h1>Workspace Core Systems</h1>
          <p>Hệ thống Giám định & Đối chiếu tổn thất xe cơ giới thời gian thực</p>
        </div>
      </div>
      <div id="navUserActionSpace"></div>
    </nav>

    /****************************************************

    async function pipelineTriggerCaseCreationFlow() {
      const plateInputVal = document.getElementById('txtPlateNumber').value.trim();
      const garageInputVal = document.getElementById('txtGaragePartner').value.trim();
      const imagesFileList = Array.from(document.getElementById('fileImageUploader').files || []);

      if (!plateInputVal || !garageInputVal || !imagesFileList.length) {
        triggerToast('Vui lòng hoàn tất thông tin trường nhập và tệp tin ảnh.', 'error');
        return;
      }

      toggleUploadOverlay(true, `Đang mã hóa dữ liệu hình ảnh...`, 'Kích nổ cụm luồng dẫn API public...', 0);

      try {
        const secureHostedImageUrlsArray = await executionParallelImagesUploadCore(imagesFileList);
        
        toggleUploadOverlay(true, 'Khởi tạo thực thể cấu trúc...', 'Đồng bộ trường dữ liệu sang máy chủ đám mây...', 95);

        const generatedCaseUniqueToken = 'CASE_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5).toUpperCase();
        const mappedImageNodeObjects = secureHostedImageUrlsArray.map(secureUrl => ({
          linkAnh: secureUrl,
          hangMucBaoGia: ""
        }));

        const finalPayloadStructure = {
          idCa: generatedCaseUniqueToken,
          bienSo: plateInputVal,
          tenGara: garageInputVal,
          trangThai: STATUS_PENDING,
          soLuongAnh: mappedImageNodeObjects.length,
          hinhAnh: mappedImageNodeObjects,
          createdAt: firebase.database.ServerValue.TIMESTAMP
        };

        await dbNodeInstance.ref(`cases/${generatedCaseUniqueToken}`).set(finalPayloadStructure);
        triggerToast('Dữ liệu nghiệp vụ ca xe đã được đẩy lên Cloud.');

        renderInlineCreationSuccessPanel(finalPayloadStructure);

        document.getElementById('txtPlateNumber').value = '';
        document.getElementById('txtGaragePartner').value = '';
        document.getElementById('fileImageUploader').value = '';
        document.getElementById('boxPreviewsHolder').innerHTML = '';
        document.getElementById('lblDropzoneSummary').textContent = 'Chưa có tệp dữ liệu nào được nạp.';
        clearActiveObjectUrls();
      } catch (exception) {
        console.error(exception);
        triggerToast(exception.message || 'Lỗi truyền tải đa luồng.', 'error');
      } finally {
        toggleUploadOverlay(false); 
      }
    }

    async function executionParallelImagesUploadCore(filesArray) {
      let resolvedCounter = 0;
      const totalFilesCount = filesArray.length;

      const parallelPromisesPool = filesArray.map(async (fileItem) => {
        try {
          const cloudSecureUrl = await uploadSingleImageToCloudinaryEngine(fileItem);
          resolvedCounter++;
          
          const accumulatedPercentage = Math.round((resolvedCounter / totalFilesCount) * 100);
          toggleUploadOverlay(true, `Đang xử lý gói ảnh dữ liệu (${resolvedCounter}/${totalFilesCount})`, `Luồng truyền tải song song ổn định: ${accumulatedPercentage}%`, accumulatedPercentage);
          
          return cloudSecureUrl;
        } catch (error) {
          throw new Error(`Lỗi tệp [${fileItem.name}]: ${error.message}`);
        }
      });

      return await Promise.all(parallelPromisesPool);
    }

    async function uploadSingleImageToCloudinaryEngine(fileBlob) {
      const targetApiEndpointUrl = `https://api.cloudinary.com/v1_1/${encodeURIComponent(CONFIG.CLOUDINARY_CLOUD_NAME)}/image/upload`;
      const multiPartFormData = new FormData();
      multiPartFormData.append('file', fileBlob);
      multiPartFormData.append('upload_preset', CONFIG.CLOUDINARY_UPLOAD_PRESET);
      if (CONFIG.CLOUDINARY_FOLDER) {
        multiPartFormData.append('folder', CONFIG.CLOUDINARY_FOLDER);
      }

      const networkResponse = await fetch(targetApiEndpointUrl, { method: 'POST', body: multiPartFormData });
      const parsedTextResponse = await networkResponse.text();
      
      let convertedJSONData;
      try { convertedJSONData = JSON.parse(parsedTextResponse); } catch(err) { throw new Error('Cấu trúc Media phản hồi lỗi.'); }

      if (!networkResponse.ok || !convertedJSONData.secure_url) {
        throw new Error(convertedJSONData?.error?.message || 'Lỗi API.');
      }
      return convertedJSONData.secure_url;
    }

    function toggleUploadOverlay(show, title = '', subtitle = '', percent = 0) {
      const overlay = document.getElementById('uploadOverlay');
      const tEl = document.getElementById('uploadOverlayTitle');
      const sEl = document.getElementById('uploadOverlaySubtitle');
      const bar = document.getElementById('uploadOverlayProgressFill');
      if (!overlay) return;

      if (show) {
        overlay.style.display = 'grid';
        if (title) tEl.textContent = title;
        if (subtitle) sEl.textContent = subtitle;
        if (bar) bar.style.width = `${percent}%`;
      } else {
        overlay.style.display = 'none';
      }
    }

        </div>

        <div class="p-share-container">
          <div class="p-share-row">
            <div class="p-share-meta">
              <div class="p-share-label">Cổng bàn giao tác nghiệp đối tác (Garage nhập bộ phận)</div>
              <div class="p-share-url-preview">${escapeHtmlOutput(shareLinkGara)}</div>
            </div>
            <div class="p-share-actions">
              <button class="btn-premium btn-share-action" onclick="executeTextCopyToClipboardRawString('${escapeAttributeData(shareLinkGara)}')">${SVGS.COPY} Sao chép Link</button>
              <button class="btn-premium btn-secondary btn-share-action" onclick="window.open('${escapeAttributeData(shareLinkGara)}', '_blank')">${SVGS.EXTERNAL} Mở tab</button>
            </div>
          </div>

          <div class="p-share-row">
            <div class="p-share-meta">
              <div class="p-share-label">Cổng theo dõi nghiệp vụ nội bộ (Giám định viên đối chiếu)</div>
              <div class="p-share-url-preview">${escapeHtmlOutput(shareLinkView)}</div>
            </div>
            <div class="p-share-actions">
              <button class="btn-premium btn-share-action" style="background:var(--dark);" onclick="executeTextCopyToClipboardRawString('${escapeAttributeData(shareLinkView)}')">${SVGS.COPY} Sao chép Link</button>
              <button class="btn-premium btn-secondary btn-share-action" onclick="window.open('${escapeAttributeData(shareLinkView)}', '_blank')">${SVGS.EXTERNAL} Truy cập</button>
            </div>
          </div>
        </div>
      `;
      outputCardBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /****************************************************
     * 2. DISTRACTION-FREE ISOLATED PORTAL WORKSPACE
     ****************************************************/
    function bindAndFetchCaseRealtimeSync(caseId, currentViewFlag) {
      renderLoadingLayoutIndicator('Đang khởi chạy luồng liên kết bảo mật dữ liệu...');

      dbNodeInstance.ref(`cases/${caseId}`).on('value', (dataSnapshot) => {
        const databaseValueObject = dataSnapshot.val();
        
        if (!databaseValueObject) {
          renderErrorLayoutState('Mã định danh ca xe không hợp lệ hoặc tài nguyên đã bị xóa trên cơ sở dữ liệu Cloud.');
          return;
        }

        localActiveCaseNode = databaseValueObject;
        localActiveImageStack = Array.isArray(databaseValueObject.hinhAnh) ? databaseValueObject.hinhAnh : Object.values(databaseValueObject.hinhAnh || {});

        const shouldForceReadOnlyResultView = currentViewFlag === 'result';
        const isCaseLockedByGarageSubmission = localActiveCaseNode.trangThai === STATUS_COMPLETED;

        if (shouldForceReadOnlyResultView || isCaseLockedByGarageSubmission) {
          renderPortalResultReadOnlyView(shouldForceReadOnlyResultView ? 'result' : 'garage-locked');
        } else {
          renderPortalGarageInteractiveInputView();
        }
      }, (networkException) => {
        renderErrorLayoutState('Lỗi cổng kết nối truyền tải: ' + networkException.message);
      });
    }

    function buildHtmlComponentSidebarCaseMetadata(viewContextMode) {
      const isReadOnlyMode = (viewContextMode === 'result' || viewContextMode === 'garage-locked');
      const showBackButton = (viewContextMode === 'result');
      const node = localActiveCaseNode || {};

      return `
        <div class="p-card sticky-sidebar">
          <div class="p-card-head">
            <h2>${isReadOnlyMode ? 'Dữ liệu Đối chiếu' : 'Khai báo Bộ phận'}</h2>
            <p>${isReadOnlyMode ? 'Chế độ biên bản chốt chặn' : 'Cửa sổ tác nghiệp dành cho Garage'}</p>
          </div>

          ${showBackButton ? `<button class="btn-premium btn-secondary" style="width:100%; margin-bottom:16px; gap:6px;" onclick="goHome()">${SVGS.ARROW_LEFT} Quay lại Dashboard</button>` : ''}

          <div class="form-group">
            <label style="margin:0;">Mã định danh ca xe</label>
            <div style="font-weight:700; font-size:14px; color:var(--text-main); font-family:'JetBrains Mono', monospace;">${node.idCa}</div>
          </div>
          <div class="form-group">
            <label style="margin:0;">Biển số xe kiểm soát</label>
            <div style="font-weight:700; font-size:14px; color:var(--text-main)">${escapeHtmlOutput(node.bienSo)}</div>
          </div>
          <div class="form-group">
            <label style="margin:0;">Cơ sở sửa chữa phụ trách</label>
            <div style="font-weight:700; font-size:14px; color:var(--text-main)">${escapeHtmlOutput(node.tenGara)}</div>
          </div>
          <div class="form-group">
            <label style="margin:0;">Trạng thái tài nguyên</label>
            <span class="badge-status ${node.trangThai === STATUS_COMPLETED ? 'completed' : 'pending'}" style="margin-top:4px;">
              ${escapeHtmlOutput(node.trangThai)}
            </span>
          </div>

          ${showBackButton ? `
            <div style="border-top:1px solid var(--border); padding-top:16px; margin-top:16px;">
              <button class="btn-premium" style="width:100%; gap:6px;" onclick="executeCopyAggregatedRawText()">${SVGS.COPY} Trích xuất văn bản tổng</button>
            </div>
          ` : isReadOnlyMode ? `
            <div style="border-top:1px solid var(--border); padding-top:16px; margin-top:16px;">
              <div class="badge-status completed" style="width:100%; padding:12px; justify-content:center; gap:6px;">${SVGS.CHECK_CIRCLE} Hồ sơ đã khóa & chuyển tiếp bảo hiểm</div>
            </div>
          ` : `
            <div style="border-top:1px solid var(--border); padding-top:16px; margin-top:16px;">
              <button id="btnSubmitGarageFinalResponse" class="btn-premium" style="width:100%; gap:6px;">${SVGS.CHECK_CIRCLE} Hoàn tất & Gửi báo giá</button>
            </div>
          `}
        </div>
      `;
    }

    function renderPortalGarageInteractiveInputView() {
      if (!localActiveImageStack.length) {
        renderErrorLayoutState('Ca xe hiện tại chưa ghi nhận danh sách hình ảnh chứng từ gốc.');
        return;
      }

      const generatedImagesCardsListHTML = localActiveImageStack.map((item, index) => {
        return `
          <div class="premium-image-card">
            <div class="img-display-pane">
              <span class="img-pane-indicator">Ảnh tổn thất chi tiết số ${index + 1}</span>
              <img src="${escapeAttributeData(item.linkAnh)}" alt="Ảnh tổn thất số ${index + 1}" loading="lazy" onclick="openLightbox('${escapeAttributeData(item.linkAnh)}')" />
            </div>
            <div class="inputs-entry-pane">
              <div class="form-group" style="width:100%">
                <label>Xác định tên bộ phận / Phương án khắc phục vùng ảnh ${index + 1}</label>
                <textarea class="garage-quote-textarea-node" data-index-token="${index}" placeholder="Ví dụ khai báo rõ ràng:&#10;- Thay mới cụm đèn pha trước phải chính hãng&#10;- Gò nắn phục hồi biến dạng ụ bắt giảm xóc&#10;- Sơn hấp phủ chỉ sườn phải trước"></textarea>
              </div>
              <button class="btn-premium btn-secondary" style="padding:6px 12px; font-size:12px; align-self: flex-start; gap:4px; min-height:36px;" onclick="window.open('${escapeAttributeData(item.linkAnh)}', '_blank')">${SVGS.EXTERNAL} Phóng to ảnh gốc độ nét cao</button>
            </div>
          </div>
        `;
      }).join('');

      rootContainer.innerHTML = `
        <div class="focus-portal-layout">
          ${buildHtmlComponentSidebarCaseMetadata('input')}
          <div class="image-workspace-list">${generatedImagesCardsListHTML}</div>
        </div>
      `;

      document.getElementById('btnSubmitGarageFinalResponse').addEventListener('click', pipelineTriggerGarageDataLockSubmission);
    }

    async function pipelineTriggerGarageDataLockSubmission() {
      const DOMTextareaElements = Array.from(document.querySelectorAll('.garage-quote-textarea-node'));
      const emptyFieldsCounter = DOMTextareaElements.filter(tx => !tx.value.trim()).length;

      if (emptyFieldsCounter > 0) {
        const proceedBlank = await showConfirmModal('Phát hiện ô trống dữ liệu', `Hệ thống ghi nhận còn ${emptyFieldsCounter} hình ảnh chưa được điền thông tin tên bộ phận. Bạn vẫn muốn tiếp tục gửi chốt?`);
        if (!proceedBlank) return;
      }

      const finalFreezeConfirmation = await showConfirmModal('Xác nhận khóa hồ sơ', 'Sau khi chốt gửi, biểu mẫu tác nghiệp sẽ chuyển về trạng thái chỉ đọc để chuyển tiếp Giám định viên. Xác nhận gửi?');
      if (!finalFreezeConfirmation) return;

      const packagedItemsPayload = DOMTextareaElements.map(tx => {
        const numericIndex = Number(tx.dataset.indexToken);
        return {
          linkAnh: localActiveImageStack[numericIndex].linkAnh,
          hangMucBaoGia: tx.value.trim()
        };
      });

      try {
        await dbNodeInstance.ref(`cases/${localActiveCaseNode.idCa}`).update({
          hinhAnh: packagedItemsPayload,
          trangThai: STATUS_COMPLETED
        });

        triggerToast('Dữ liệu danh mục bộ phận xe cơ giới đã gửi thành công.');
        const finalizedResultUrl = `${getCleanOriginBaseUrl()}?idCa=${encodeURIComponent(localActiveCaseNode.idCa)}`;
        window.history.replaceState({}, '', finalizedResultUrl);
        evaluateViewRoutingState(firebase.auth().currentUser);
      } catch (err) {
        console.error(err);
        triggerToast('Lỗi đồng bộ truyền tải: ' + err.message, 'error');
      }
    }

    function renderPortalResultReadOnlyView(renderMode) {
      if (!localActiveImageStack.length) {
        renderErrorLayoutState('Không thể cấu trúc mảng hình ảnh.');
        return;
      }

      const generatedReadOnlyCardsHTML = localActiveImageStack.map((item, index) => {
        const textContentClean = String(item.hangMucBaoGia || '').trim();

        return `
          <div class="premium-image-card">
            <div class="img-display-pane">
              <span class="img-pane-indicator" style="background:rgba(2, 132, 199, 0.3); border-color:var(--primary)">Vùng ảnh giám định #${index + 1}</span>
              <img src="${escapeAttributeData(item.linkAnh)}" alt="Ảnh kết quả vùng ${index + 1}" loading="lazy" onclick="openLightbox('${escapeAttributeData(item.linkAnh)}')" />
            </div>
            <div class="inputs-entry-pane">
              <div class="form-group" style="width:100%;">
                <label style="color:var(--primary); font-weight:800; tracking-spacing:0.02em;">Chi tiết hạng mục bộ phận ghi nhận từ Garage đối tác</label>
                <div style="background:rgba(0,0,0,0.4); border:1px solid var(--border); padding:18px; border-radius:var(--radius-md); font-size:14px; font-weight:700; white-space:pre-wrap; min-height:110px; color:var(--text-main); border-left: 3px solid var(--primary);" class="${textContentClean ? '':'empty-state-text'}">${textContentClean ? escapeHtmlOutput(textContentClean) : 'Đơn vị đối tác không khai báo danh mục bộ phận cho vùng ảnh tổn thất này.'}</div>
              </div>
              <button class="btn-premium btn-secondary" style="padding:6px 12px; font-size:12px; align-self:flex-start; gap:4px; min-height:36px;" onclick="window.open('${escapeAttributeData(item.linkAnh)}', '_blank')">${SVGS.EXTERNAL} Mở ảnh chứng cứ gốc</button>
            </div>
          </div>
        `;
      }).join('');

      rootContainer.innerHTML = `
        <div class="focus-portal-layout">
          ${buildHtmlComponentSidebarCaseMetadata(renderMode)}
          <div class="image-workspace-list">
            ${generatedReadOnlyCardsHTML}
          </div>
        </div>
      `;
    }

    function compileRawTextSummaryReportBlock() {
      const node = localActiveCaseNode || {};
      const outputLinesBuffer = [];

      outputLinesBuffer.push('==================================================');
      outputLinesBuffer.push('   BIÊN BẢN TỔNG HỢP HẠNG MỤC PHƯƠNG TIỆN CƠ GIỚI   ');
      outputLinesBuffer.push('==================================================');
      outputLinesBuffer.push(`- Mã ca giám định:    ${node.idCa || ''}`);
      outputLinesBuffer.push(`- Biển kiểm soát xe:  ${node.bienSo || ''}`);
      outputLinesBuffer.push(`- Đơn vị sửa chữa:    ${node.tenGara || ''}`);
      outputLinesBuffer.push(`- Tình trạng dữ liệu: ${node.trangThai || ''}`);
      outputLinesBuffer.push('--------------------------------------------------\n');

      localActiveImageStack.forEach((item, index) => {
        outputLinesBuffer.push(`[VÙNG ẢNH KHAI BÁO SỐ ${index + 1}]`);
        outputLinesBuffer.push(`+ Chi tiết hạng mục bộ phận: \n${item.hangMucBaoGia || 'Không ghi nhận hạng mục.'}`);
        outputLinesBuffer.push(`+ URL ảnh chứng cứ gốc: ${item.linkAnh || ''}`);
        outputLinesBuffer.push('');
      });

      return outputLinesBuffer.join('\n');
    }

    function executeCopyAggregatedRawText() {
      executeTextCopyToClipboardRawString(compileRawTextSummaryReportBlock());
    }

    /****************************************************
     * GENERIC INFRASTRUCTURE HELPERS UTILS
     ****************************************************/
    function renderLoadingLayoutIndicator(friendlyMessage) {
      rootContainer.innerHTML = `
        <div class="p-card" style="text-align:center; padding:60px 20px; background:var(--card)">
          <div class="spinner-premium"></div>
          <h3 style="font-size:15px; font-weight:700; margin-bottom:4px;">${escapeHtmlOutput(friendlyMessage)}</h3>
          <p style="font-size:12px; color:var(--text-muted);">Mạng lưới dữ liệu thời gian thực đang đồng bộ đám mây.</p>
        </div>
      `;
    }

    function renderErrorLayoutState(errorMessage) {
      rootContainer.innerHTML = `
        <div class="p-card" style="border-top: 4px solid var(--danger);">
          <div class="p-card-head">
            <h2 style="color:var(--danger)">Cảnh báo hệ thống: Lỗi tài nguyên gói</h2>
          </div>
          <div style="background:rgba(244,63,94,0.05); border:1px solid rgba(244,63,94,0.15); color:var(--danger); padding:16px; border-radius:var(--radius-md); font-size:13px; font-weight:600; margin-bottom:20px; line-height:1.6;">
            ${escapeHtmlOutput(errorMessage)}
          </div>
          <div class="flex-actions-group">
            <button class="btn-premium" onclick="window.location.reload()">Tải lại trang</button>
          </div>
        </div>
      `;
    }

    function renderFatalConfigurationFailure() {
      rootContainer.innerHTML = `
        <div class="p-card" style="border-top:4px solid var(--danger); margin-top:40px;">
          <h2 style="color:var(--danger); font-size:18px;">Lỗi xác thực cấu hình lõi phân quyền</h2>
          <p style="margin-top:10px; font-size:13px; color:var(--text-muted); line-height:1.6;">
            Cấu hình khóa ứng dụng trong đối tượng cấu trúc <strong>CONFIG.FIREBASE</strong> hoặc khóa công khai tài khoản <strong>CLOUDINARY</strong> chứa chuỗi ký tự tạm rỗng hoặc "PASTE_". Vui lòng kiểm tra lại file index.html.
          </p>
        </div>
      `;
    }

    function toggleButtonUIPendingState(buttonDomNode, isBusyState, overlayTextValue) {
      if (!buttonDomNode) return;
      if (isBusyState) {
        buttonDomNode.setAttribute('data-preserved-text', buttonDomNode.textContent);
        buttonDomNode.textContent = overlayTextValue;
        buttonDomNode.disabled = true;
      } else {
        buttonDomNode.textContent = buttonDomNode.getAttribute('data-preserved-text') || overlayTextValue;
        buttonDomNode.disabled = false;
      }
    }

    function executeTextCopyToClipboardRawString(textStringPayload) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textStringPayload)
          .then(() => triggerToast('Đã sao chép liên kết vào bộ nhớ ảo.'))
          .catch(() => fallbackExecutionTextCopyLegacy(textStringPayload));
      } else {
        fallbackExecutionTextCopyLegacy(textStringPayload);
      }
    }

    function fallbackExecutionTextCopyLegacy(fallbackText) {
      const transientTextarea = document.createElement('textarea');
      transientTextarea.value = fallbackText; transientTextarea.style.position = 'fixed'; transientTextarea.style.left = '-9999px';
      document.body.appendChild(transientTextarea); transientTextarea.focus(); transientTextarea.select();
      try { document.execCommand('copy'); triggerToast('Đã sao chép liên kết.'); } catch (err) { triggerToast('Lỗi trích xuất bộ nhớ.', 'error'); }
      document.body.removeChild(transientTextarea);
    }

    function openLightbox(imageSourceUrl) {
      const lightboxContainer = document.getElementById('lightbox');
      document.getElementById('lightboxImg').src = imageSourceUrl;
      lightboxContainer.classList.add('show');
    }

    function closeLightbox() {
      const lightboxContainer = document.getElementById('lightbox');
      lightboxContainer.classList.remove('show');
      document.getElementById('lightboxImg').src = '';
    }

    function getCleanOriginBaseUrl() {
      return window.location.href.split('?')[0].split('#')[0].replace(/index\.html$/i, '');
    }

    function isSystemConfigHealthy() {
      return (
        CONFIG.FIREBASE.apiKey && !CONFIG.FIREBASE.apiKey.includes('PASTE_') &&
        CONFIG.CLOUDINARY_CLOUD_NAME && !CONFIG.CLOUDINARY_CLOUD_NAME.includes('PASTE_')
      );
    }

    function escapeHtmlOutput(unsafeStringValue) {
      return String(unsafeStringValue || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function escapeAttributeData(unsafeAttrValue) { return escapeHtmlOutput(unsafeAttrValue); }
  </script>
</body>
</html>
