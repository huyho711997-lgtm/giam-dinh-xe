<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hệ thống Đối chiếu Ảnh Giám định Xe Cơ giới - Premium</title>

  <!-- Google Fonts & Firebase SDK Compatibility Version -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --panel-bg: rgba(255, 255, 255, 0.85);
      --card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      
      /* Premium Color Palette */
      --primary: #0284c7;
      --primary-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      --accent: #0ea5e9;
      --dark: #0f172a;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-premium: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 20px 40px -10px rgba(0, 0, 0, 0.03);
      --shadow-hover: 0 20px 40px -5px rgba(2, 132, 199, 0.12);
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      color: var(--text-main);
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(2, 132, 199, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.03) 0px, transparent 50%);
      min-height: 100vh;
      line-height: 1.5;
    }

    .svg-icon {
      width: 1.25rem;
      height: 1.25rem;
      display: inline-block;
      vertical-align: middle;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    
    .svg-icon-lg { width: 2.25rem; height: 2.25rem; }
    .svg-icon-sm { width: 1rem; height: 1rem; }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      top: 16px;
      right: 16px;
      left: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
    }
    @media (min-width: 640px) {
      .toast-container { left: auto; width: 360px; top: 24px; right: 24px; }
    }

    .toast {
      background: var(--card);
      border-left: 4px solid var(--primary);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
      transform: translateY(-20px);
      opacity: 0;
      animation: slideIn 0.3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.1);
      font-weight: 600;
      font-size: 14px;
    }

    @keyframes slideIn { to { transform: translateY(0); opacity: 1; } }
    .toast.success { border-left-color: var(--success); color: #065f46; background: #f0fdf4; }
    .toast.error { border-left-color: var(--danger); color: #991b1b; background: #fef2f2; }
    .toast.warning { border-left-color: var(--warning); color: #92400e; background: #fffbeb; }

    /* Premium Fullscreen Upload Loading Screen Overlay */
    .upload-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(6px);
      z-index: 3000;
      display: none;
      place-items: center;
      padding: 20px;
    }
    .upload-overlay-card {
      background: var(--card);
      padding: 32px 24px;
      border-radius: var(--radius-lg);
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-premium);
      animation: modalUnfold 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards;
    }
    .upload-overlay-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; color: var(--text-main); }
    .upload-overlay-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

    /* Custom Premium Modal */
    .p-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 999;
      display: none;
      place-items: center;
      padding: 16px;
    }
    .p-modal { background: var(--card); border-radius: var(--radius-lg); padding: 24px; max-width: 440px; width: 100%; box-shadow: var(--shadow-premium); text-align: center; }
    .p-modal h3 { font-size: 18px; margin-bottom: 12px; font-weight: 700; }
    .p-modal p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
    .p-modal-btns { display: flex; gap: 12px; }

    /* Layout Containers */
    .app-container { max-width: 1340px; margin: 0 auto; padding: 12px 12px 60px; }
    @media (min-width: 640px) { .app-container { padding: 24px 20px 80px; } }

    /* Navigation Header */
    .premium-nav { display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); backdrop-filter: blur(12px); border: 1px solid var(--border); padding: 12px 16px; border-radius: var(--radius-md); margin-bottom: 16px; box-shadow: var(--shadow-premium); }
    @media (min-width: 640px) { .premium-nav { padding: 16px 24px; border-radius: var(--radius-lg); margin-bottom: 32px; } }
    .nav-brand { display: flex; align-items: center; gap: 12px; }
    .nav-logo { width: 40px; height: 40px; background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%); border-radius: var(--radius-md); display: grid; place-items: center; color: var(--primary); }
    .nav-titles h1 { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }
    .nav-titles p { font-size: 11px; color: var(--text-muted); font-weight: 500; }

    /* Stats Grid */
    .premium-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
    @media (min-width: 640px) { .premium-stats { gap: 20px; margin-bottom: 32px; } }
    .stat-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-premium); }
    @media (min-width: 640px) { .stat-box { border-radius: var(--radius-lg); padding: 24px; } }
    .stat-info .stat-val { font-size: 24px; font-weight: 800; line-height: 1.2; margin-top: 2px; }
    .stat-info .stat-lbl { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .stat-icon-wrap { width: 40px; height: 40px; border-radius: var(--radius-md); display: grid; place-items: center; background: #f1f5f9; }

    /* Workspace Structural Grid */
    .workspace-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 1024px) { .workspace-grid.two-cols { grid-template-columns: 420px 1fr; gap: 32px; align-items: start; } }
    .p-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; box-shadow: var(--shadow-premium); }
    @media (min-width: 640px) { .p-card { border-radius: var(--radius-lg); padding: 28px; } }
    .p-card-head { margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .p-card-head h2 { font-size: 16px; font-weight: 700; }
    .p-card-head p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* Controls Elements */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .input-premium { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 14px; font-size: 14px; font-family: inherit; color: var(--text-main); background: #f8fafc; outline: none; transition: var(--transition); }
    .input-premium:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12); }
    .dropzone { border: 2px dashed #cbd5e1; border-radius: var(--radius-md); padding: 24px 16px; text-align: center; background: #f8fafc; cursor: pointer; transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .dropzone:hover { border-color: var(--primary); background: rgba(2, 132, 199, 0.02); }
    .dropzone p { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .preview-grid-premium { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
    .preview-thumb { aspect-ratio: 1; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); }
    .preview-thumb img { width: 100%; height: 100%; object-fit: cover; }

    /* Premium Active Buttons */
    .btn-premium { appearance: none; border: 0; font-family: inherit; padding: 12px 20px; font-size: 14px; font-weight: 700; border-radius: var(--radius-md); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: #fff; background: var(--primary-gradient); box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15); transition: var(--transition); width: 100%; min-height: 44px; text-decoration: none; }
    .btn-premium:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); }
    .btn-premium:active { transform: translateY(1px); }
    .btn-premium:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-secondary { background: #f1f5f9; color: #334155; box-shadow: none; border: 1px solid var(--border); }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger-p { background: #fef2f2; color: var(--danger); box-shadow: none; }
    .btn-danger-p:hover { background: #fee2e2; }

    /* Output Generation Box Link Matrix Components */
    .p-share-container { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
    .p-share-row { display: flex; flex-direction: column; background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; gap: 12px; transition: var(--transition); }
    @media (min-width: 640px) { .p-share-row { flex-direction: row; align-items: center; justify-content: space-between; gap: 24px; } }
    .p-share-meta { flex: 1; min-width: 0; }
    .p-share-label { font-size: 13px; font-weight: 700; color: var(--text-main); }
    .p-share-url-preview { font-size: 12px; color: var(--text-muted); font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .p-share-actions { display: flex; gap: 8px; }
    .btn-share-action { padding: 6px 14px; font-size: 13px; min-height: 36px; width: auto; flex: 1; }
    @media (min-width: 640px) { .btn-share-action { flex: initial; } }

    /* Table & Responsive Matrix */
    .table-container { border-radius: var(--radius-md); border: 1px solid var(--border); overflow: hidden; }
    .p-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    .p-table th { background: #f8fafc; padding: 14px 16px; font-weight: 700; color: #475569; border-bottom: 1px solid var(--border); }
    .p-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); background: #fff; vertical-align: middle; }
    
    @media (max-width: 639px) {
      .p-table, .p-table tbody, .p-table tr, .p-table td { display: block; width: 100%; }
      .p-table thead { display: none; }
      .p-table tr { background: #fff; border-bottom: 8px solid #f1f5f9; padding: 12px; }
      .p-table tr:last-child { border-bottom: none; }
      .p-table td { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #f1f5f9; text-align: right; }
      .p-table td::before { content: attr(data-label); font-weight: 700; color: var(--text-muted); font-size: 12px; text-align: left; }
      .p-table td:last-child { border-bottom: none; flex-direction: column; align-items: stretch; padding-top: 12px; }
      .p-table td:last-child::before { display: none; }
      .flex-actions-group { display: grid !important; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; margin-top: 4px; }
      .flex-actions-group .btn-premium { width: 100% !important; padding: 8px 4px; font-size: 11px; min-height: 36px; }
    }

    .badge-status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .badge-status.pending { background: #fff7ed; color: var(--warning); }
    .badge-status.completed { background: #ecfdf5; color: var(--success); }

    /* Portal Layout Design */
    .focus-portal-layout { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 1024px) { .focus-portal-layout { grid-template-columns: 360px 1fr; gap: 28px; align-items: start; } .sticky-sidebar { position: sticky; top: 24px; } }
    .image-workspace-list { display: flex; flex-direction: column; gap: 16px; }
    @media (min-width: 640px) { .image-workspace-list { gap: 24px; } }
    .premium-image-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-premium); display: grid; grid-template-columns: 1fr; }
    @media (min-width: 640px) { .premium-image-card { grid-template-columns: 1fr 1fr; border-radius: var(--radius-lg); } }
    .img-display-pane { background: #0f172a; display: grid; place-items: center; position: relative; min-height: 220px; }
    @media (min-width: 640px) { .img-display-pane { min-height: 320px; } }
    .img-display-pane img { width: 100%; height: 100%; object-fit: contain; max-height: 360px; cursor: zoom-in; }
    .img-pane-indicator { position: absolute; left: 12px; top: 12px; background: rgba(15,23,42,0.6); backdrop-filter: blur(8px); padding: 4px 10px; border-radius: 999px; color: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .inputs-entry-pane { padding: 16px; display: flex; flex-direction: column; justify-content: space-between; background: #fff; gap: 12px; }
    @media (min-width: 640px) { .inputs-entry-pane { padding: 24px; } }
    .inputs-entry-pane textarea { width: 100%; min-height: 120px; border: 1px solid var(--border); background: #f8fafc; border-radius: var(--radius-md); padding: 12px; font-family: inherit; font-size: 14px; outline: none; resize: vertical; transition: var(--transition); line-height: 1.5; }
    .inputs-entry-pane textarea:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1); }
    
    .p-progress-bar { height: 6px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-top: 12px; display: none; }
    .p-progress-bar.active { display: block; }
    .p-progress-fill { height: 100%; width: 0%; background: var(--primary-gradient); transition: width 0.2s ease; }

    /* Lightbox Custom block */
    .premium-lightbox { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); z-index: 2000; display: none; place-items: center; padding: 16px; opacity: 0; transition: opacity 0.2s ease; }
    .premium-lightbox.show { display: grid; opacity: 1; }
    .premium-lightbox img { max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: var(--radius-md); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .lightbox-close-btn { position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 24px; cursor: pointer; display: grid; place-items: center; }
    .empty-state-text { text-align: center; color: var(--text-muted); font-style: italic; padding: 24px 16px; font-size: 14px; }
  </style>
</head>
<body>

  <!-- Hệ thống Toast thông báo -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Màn hình chờ tải lên song song công công công nghệ cao -->
  <div id="uploadOverlay" class="upload-overlay">
    <div class="upload-overlay-card">
      <div class="spinner-premium"></div>
      <div id="uploadOverlayTitle" class="upload-overlay-title">Đang đồng bộ ảnh tổn thất</div>
      <div id="uploadOverlaySubtitle" class="upload-overlay-subtitle">Tiến trình kết nối dữ liệu song song...</div>
      <div class="p-progress-bar active" style="margin-top: 0;">
        <div id="uploadOverlayProgressFill" class="p-progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- Hộp thoại xác nhận Pop-up -->
  <div id="modalOverlay" class="p-modal-overlay">
    <div class="p-modal">
      <h3 id="modalTitle">Xác nhận</h3>
      <p id="modalMsg">Bạn có chắc chắn muốn thực hiện hành động này?</p>
      <div class="p-modal-btns">
        <button id="modalCancel" class="btn-premium btn-secondary">Hủy</button>
        <button id="modalConfirm" class="btn-premium">Xác nhận</button>
      </div>
    </div>
  </div>

  <div class="app-container">
    <nav class="premium-nav">
      <div class="nav-brand" id="navBrandClick">
        <div class="nav-logo">
          <svg class="svg-icon svg-icon-lg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div class="nav-titles">
          <h1>Workspace Core Systems</h1>
          <p>Hệ thống Giám định & Đối chiếu tổn thất xe cơ giới thời gian thực</p>
        </div>
      </div>
    </nav>

    <main id="appRoot"></main>
  </div>

  <div id="lightbox" class="premium-lightbox" onclick="closeLightbox()">
    <button class="lightbox-close-btn" type="button" onclick="closeLightbox()">×</button>
    <img id="lightboxImg" src="" alt="Zoomed View">
  </div>

  <script>
    const CONFIG = {
      FIREBASE: {
        apiKey: "AIzaSyCZoQ3_YFxGLPb7eRJ6Ming0mghMUafSKI",
        authDomain: "doi-chieu-gara.firebaseapp.com",
        databaseURL: "https://doi-chieu-gara-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "doi-chieu-gara",

        messagingSenderId: "455769692413",
        appId: "1:455769692413:web:241f9daff918ecc69b8694",
        measurementId: "G-VBXHGY09XX"
      },

      CLOUDINARY_UPLOAD_PRESET: 'giam_dinh_xe_unsigned',

    };

    const STATUS_PENDING = 'Chờ điền';
    const STATUS_COMPLETED = 'Đã điền';

    const SVGS = {

      CLOCK: `<svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,

      CAMERA: `<svg class="svg-icon svg-icon-lg" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`,
      ARROW_LEFT: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`,

      TRASH: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
      SPARKLES: `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707.707"/></svg>`
    };

    const rootContainer = document.getElementById('appRoot');
    let dbNodeInstance = null;
    let localActiveCaseNode = null;
    let localActiveImageStack = [];
    let activeObjectUrls = []; 

    function showConfirmModal(title, msg) {
      return new Promise((resolve) => {
        const overlay = document.getElementById('modalOverlay');
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalMsg').textContent = msg;
        overlay.style.display = 'grid';
        
        const cleanUp = (res) => {
          overlay.style.display = 'none';
          document.getElementById('modalConfirm').onclick = null;
          document.getElementById('modalCancel').onclick = null;
          resolve(res);
        };
        document.getElementById('modalConfirm').onclick = () => cleanUp(true);
        document.getElementById('modalCancel').onclick = () => cleanUp(false);
      });
    }

    function triggerToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const element = document.createElement('div');
      element.className = `toast ${type}`;
      element.textContent = message;
      container.appendChild(element);

      evaluateViewRoutingState();

    function evaluateViewRoutingState() {
      const URLQueryStrings = new URLSearchParams(window.location.search);
      const caseIdToken = URLQueryStrings.get('idCa');
      const targetedViewArg = URLQueryStrings.get('view');
      const brandElement = document.getElementById('navBrandClick');

      dbNodeInstance.ref('cases').off();
      if (localActiveCaseNode && localActiveCaseNode.idCa) {
        dbNodeInstance.ref(`cases/${localActiveCaseNode.idCa}`).off();
      }

      if (!caseIdToken) {
        if (brandElement) {
          brandElement.style.cursor = 'pointer';
          brandElement.onclick = goHome;
        }
        renderManagerDashboardWorkspace();
      } else {
        if (targetedViewArg !== 'result') {
          if (brandElement) {
            brandElement.style.cursor = 'default';
            brandElement.onclick = null;
          }
        } else {
          if (brandElement) {
            brandElement.style.cursor = 'pointer';
            brandElement.onclick = goHome;
          }
        }
        bindAndFetchCaseRealtimeSync(caseIdToken, targetedViewArg);
      }
    }

      const computedTableRowsHTML = Object.keys(casesPayload).reverse().map(uniqueKeyToken => {

          <tr>

              <div style="font-weight:700; color:var(--dark); font-size:15px;">${escapeHtmlOutput(entityNode.bienSo)}</div>

     ****************************************************/
    async function pipelineTriggerCaseCreationFlow() {
      const plateInputVal = document.getElementById('txtPlateNumber').value.trim();
      const garageInputVal = document.getElementById('txtGaragePartner').value.trim();
      const imagesFileList = Array.from(document.getElementById('fileImageUploader').files || []);

      if (!plateInputVal || !garageInputVal || !imagesFileList.length) {
        triggerToast('Vui lòng nhập đầy đủ Biển số, Tên Garage và tải lên hình ảnh.', 'error');
        return;
      }

      // Kích hoạt màn hình chờ toàn diện UI
      toggleUploadOverlay(true, `Đang khởi tạo ${imagesFileList.length} ảnh tổn thất...`, 'Kết nối hạ tầng Cloudinary API', 0);

      try {
        // Thực thi luồng xử lý tải song song (Parallel Promise Stream Pooling)
        const secureHostedImageUrlsArray = await executionParallelImagesUploadCore(imagesFileList);
        
        toggleUploadOverlay(true, 'Đang ghi nhận cấu trúc dữ liệu...', 'Đồng bộ thời gian thực với Firebase...', 95);

        const generatedCaseUniqueToken = 'CASE_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5).toUpperCase();
        const mappedImageNodeObjects = secureHostedImageUrlsArray.map(secureUrl => ({
          linkAnh: secureUrl,
          hangMucBaoGia: ""
        }));

        const finalPayloadStructure = {
          idCa: generatedCaseUniqueToken,
          bienSo: plateInputVal,
          tenGara: garageInputVal,
          trangThai: STATUS_PENDING,
          soLuongAnh: mappedImageNodeObjects.length,
          hinhAnh: mappedImageNodeObjects,
          createdAt: firebase.database.ServerValue.TIMESTAMP
        };

        await dbNodeInstance.ref(`cases/${generatedCaseUniqueToken}`).set(finalPayloadStructure);
        triggerToast('Hồ sơ giám định trực tuyến đã đồng bộ thành công.');

        renderInlineCreationSuccessPanel(finalPayloadStructure);

        // Đóng form
        document.getElementById('txtPlateNumber').value = '';
        document.getElementById('txtGaragePartner').value = '';
        document.getElementById('fileImageUploader').value = '';
        document.getElementById('boxPreviewsHolder').innerHTML = '';
        document.getElementById('lblDropzoneSummary').textContent = 'Chưa có ảnh nào được chọn.';
        clearActiveObjectUrls();
      } catch (exception) {
        console.error(exception);
        triggerToast(exception.message || 'Lỗi nghẽn mạng phát sinh trong tiến trình upload song song.', 'error');
      } finally {
        toggleUploadOverlay(false); // Đóng màn hình chờ tải lên
      }
    }

    // Công cụ lõi xử lý Multi-thread Upload song song
    async function executionParallelImagesUploadCore(filesArray) {
      let resolvedCounter = 0;
      const totalFilesCount = filesArray.length;

      // Map danh sách mảng thành tập hợp các Promise bất đồng bộ chạy đồng thời
      const parallelPromisesPool = filesArray.map(async (fileItem) => {
        try {
          const cloudSecureUrl = await uploadSingleImageToCloudinaryEngine(fileItem);
          resolvedCounter++;
          
          // Tính toán phần trăm hoàn thành thực tế dựa theo số luồng phản hồi thành công
          const accumulatedPercentage = Math.round((resolvedCounter / totalFilesCount) * 100);
          toggleUploadOverlay(true, `Đang truyền tải ảnh tổn thất (${resolvedCounter}/${totalFilesCount})`, `Băng thông đám mây tốc độ cao: ${accumulatedPercentage}%`, accumulatedPercentage);
          
          return cloudSecureUrl;
        } catch (error) {
          throw new Error(`Tệp tin [${fileItem.name}] thất bại: ${error.message}`);
        }
      });

      // Kích nổ toàn bộ các Request đồng thời, gom kết quả trả về trong một mảng sau cùng
      return await Promise.all(parallelPromisesPool);
    }

    async function uploadSingleImageToCloudinaryEngine(fileBlob) {
      const targetApiEndpointUrl = `https://api.cloudinary.com/v1_1/${encodeURIComponent(CONFIG.CLOUDINARY_CLOUD_NAME)}/image/upload`;
      const multiPartFormData = new FormData();
      multiPartFormData.append('file', fileBlob);
      multiPartFormData.append('upload_preset', CONFIG.CLOUDINARY_UPLOAD_PRESET);
      if (CONFIG.CLOUDINARY_FOLDER) {
        multiPartFormData.append('folder', CONFIG.CLOUDINARY_FOLDER);
      }

      const networkResponse = await fetch(targetApiEndpointUrl, { method: 'POST', body: multiPartFormData });
      const parsedTextResponse = await networkResponse.text();
      
      let convertedJSONData;
      try { convertedJSONData = JSON.parse(parsedTextResponse); } catch(err) { throw new Error('Phản hồi Server lỗi.'); }

      if (!networkResponse.ok || !convertedJSONData.secure_url) {
        throw new Error(convertedJSONData?.error?.message || 'Lỗi truyền tải.');
      }
      return convertedJSONData.secure_url;
    }

        if (subtitle) sEl.textContent = subtitle;
        if (bar) bar.style.width = `${percent}%`;
      } else {
        overlay.style.display = 'none';
      }
    }

                <textarea class="garage-quote-textarea-node" data-index-token="${index}" placeholder="Ví dụ phương án rõ ràng:&#10;- Thay mới cản trước chính hãng&#10;- Gò nắn chắn bùn trước trái&#10;- Sơn hấp xử lý xước dặm sườn xe">${escapeHtmlOutput(item.hangMucBaoGia || '')}</textarea>
              </div>
              <button class="btn-premium btn-secondary" style="padding:6px 12px; font-size:12px; align-self: flex-start; gap:4px; min-height:36px;" onclick="window.open('${escapeAttributeData(item.linkAnh)}', '_blank')">${SVGS.EXTERNAL} Xem ảnh gốc phóng to</button>
            </div>
          </div>
        `;
      }).join('');

      rootContainer.innerHTML = `
        <div class="focus-portal-layout">
          ${buildHtmlComponentSidebarCaseMetadata('input')}
          <div class="image-workspace-list">${generatedImagesCardsListHTML}</div>
        </div>
      `;

      document.getElementById('btnSubmitGarageFinalResponse').addEventListener('click', pipelineTriggerGarageDataLockSubmission);
    }

    async function pipelineTriggerGarageDataLockSubmission() {
      const DOMTextareaElements = Array.from(document.querySelectorAll('.garage-quote-textarea-node'));
      const emptyFieldsCounter = DOMTextareaElements.filter(tx => !tx.value.trim()).length;

      if (emptyFieldsCounter > 0) {
        const proceedBlank = await showConfirmModal('Phát hiện ô trống bộ phận', `Có ${emptyFieldsCounter} vùng ảnh chưa điền bộ phận tổn thất. Bạn vẫn muốn tiếp tục gửi đi?`);
        if (!proceedBlank) return;
      }

      const finalFreezeConfirmation = await showConfirmModal('Xác nhận chốt hồ sơ', 'Sau khi gửi, toàn bộ dữ liệu hạng mục bộ phận sẽ khóa tự động để bảo hiểm đối chiếu. Xác nhận gửi?');
      if (!finalFreezeConfirmation) return;

      const packagedItemsPayload = DOMTextareaElements.map(tx => {
        const numericIndex = Number(tx.dataset.indexToken);
        return {
          linkAnh: localActiveImageStack[numericIndex].linkAnh,
          hangMucBaoGia: tx.value.trim()
        };
      });

      try {
        await dbNodeInstance.ref(`cases/${localActiveCaseNode.idCa}`).update({
          hinhAnh: packagedItemsPayload,
          trangThai: STATUS_COMPLETED
        });

        triggerToast('Hồ sơ báo giá bộ phận cơ giới đã được khóa an toàn.');
        const finalizedResultUrl = `${getCleanOriginBaseUrl()}?idCa=${encodeURIComponent(localActiveCaseNode.idCa)}`;
        window.history.replaceState({}, '', finalizedResultUrl);
        evaluateViewRoutingState();
      } catch (err) {
        console.error(err);
        triggerToast('Lỗi nghẽn mạng đồng bộ: ' + err.message, 'error');
      }
    }

    function renderPortalResultReadOnlyView(renderMode) {
      if (!localActiveImageStack.length) {
        renderErrorLayoutState('Không trích xuất được danh sách hình ảnh.');
        return;
      }

      const generatedReadOnlyCardsHTML = localActiveImageStack.map((item, index) => {
        const textContentClean = String(item.hangMucBaoGia || '').trim();

        return `
          <div class="premium-image-card">
            <div class="img-display-pane">
              <span class="img-pane-indicator" style="background:var(--primary);">Ảnh chứng cứ #${index + 1}</span>
              <img src="${escapeAttributeData(item.linkAnh)}" alt="Ảnh kết quả vùng ${index + 1}" loading="lazy" onclick="openLightbox('${escapeAttributeData(item.linkAnh)}')" />
            </div>
            <div class="inputs-entry-pane" style="background:#fafafa;">
              <div class="form-group" style="width:100%;">
                <label style="color:var(--primary); font-weight:800; text-transform:uppercase; letter-spacing:0.02em;">Bộ phận tổn thất & hạng mục ghi nhận từ đối tác</label>
                <div style="background:#fff; border:1px solid var(--border); padding:16px; border-radius:var(--radius-md); font-size:15px; font-weight:700; white-space:pre-wrap; min-height:110px;" class="${textContentClean ? '':'empty-state-text'}">${textContentClean ? escapeHtmlOutput(textContentClean) : 'Garage bỏ trống không khai báo thông tin bộ phận tổn thất cho ảnh này.'}</div>
              </div>
              <button class="btn-premium btn-secondary" style="padding:6px 12px; font-size:12px; align-self:flex-start; gap:4px; min-height:36px;" onclick="window.open('${escapeAttributeData(item.linkAnh)}', '_blank')">${SVGS.EXTERNAL} Xem ảnh gốc kết quả</button>
            </div>
          </div>
        `;
      }).join('');

      rootContainer.innerHTML = `
        <div class="focus-portal-layout">
          ${buildHtmlComponentSidebarCaseMetadata(renderMode)}
          <div class="image-workspace-list">
            ${generatedReadOnlyCardsHTML}
          </div>
        </div>
      `;
    }

    function compileRawTextSummaryReportBlock() {
      const node = localActiveCaseNode || {};
      const outputLinesBuffer = [];

      outputLinesBuffer.push('==================================================');
      outputLinesBuffer.push('   BIÊN BẢN TỔNG HỢP HẠNG MỤC PHƯƠNG TIỆN CƠ GIỚI   ');
      outputLinesBuffer.push('==================================================');
      outputLinesBuffer.push(`- Mã ca giám định:    ${node.idCa || ''}`);
      outputLinesBuffer.push(`- Biển kiểm soát xe:  ${node.bienSo || ''}`);
      outputLinesBuffer.push(`- Đơn vị sửa chữa:    ${node.tenGara || ''}`);
      outputLinesBuffer.push(`- Tình trạng dữ liệu: ${node.trangThai || ''}`);
      outputLinesBuffer.push('--------------------------------------------------\n');

      localActiveImageStack.forEach((item, index) => {
        outputLinesBuffer.push(`[VÙNG ẢNH KHAI BÁO SỐ ${index + 1}]`);
        outputLinesBuffer.push(`+ Chi tiết hạng mục bộ phận: \n${item.hangMucBaoGia || 'Không ghi nhận hạng mục.'}`);
        outputLinesBuffer.push(`+ URL ảnh chứng cứ gốc: ${item.linkAnh || ''}`);
        outputLinesBuffer.push('');
      });

      return outputLinesBuffer.join('\n');
    }

    function executeCopyAggregatedRawText() {
      executeTextCopyToClipboardRawString(compileRawTextSummaryReportBlock());
    }

    /****************************************************
     * UTILS HELPERS
     ****************************************************/
    function renderLoadingLayoutIndicator(friendlyMessage) {
      rootContainer.innerHTML = `
        <div class="p-card" style="text-align:center; padding:48px 16px;">
          <div class="spinner-premium"></div>
          <h3 style="font-size:15px; font-weight:700; margin-bottom:4px;">${escapeHtmlOutput(friendlyMessage)}</h3>
          <p style="font-size:12px; color:var(--text-muted);">Mạng lưới dữ liệu thời gian thực đang đồng bộ.</p>
        </div>
      `;
    }

    function renderErrorLayoutState(errorMessage) {
      rootContainer.innerHTML = `
        <div class="p-card" style="border-top: 4px solid var(--danger);">
          <div class="p-card-head">
            <h2 style="color:var(--danger)">Cảnh báo: Không tải được tài nguyên hồ sơ</h2>
          </div>
          <div style="background:#fff5f5; border:1px solid #fed7d7; color:#c53030; padding:14px; border-radius:var(--radius-md); font-size:13px; font-weight:600; margin-bottom:16px;">
            ${escapeHtmlOutput(errorMessage)}
          </div>
          <div class="flex-actions-group">
            <button class="btn-premium" onclick="window.location.reload()">Thử tải lại trang</button>
          </div>
        </div>
      `;
    }

    function renderFatalConfigurationFailure() {
      rootContainer.innerHTML = `
        <div class="p-card" style="border-top:4px solid var(--danger); margin-top:40px;">
          <h2 style="color:var(--danger); font-size:18px;">Lỗi xác thực cấu hình phân quyền</h2>
          <p style="margin-top:10px; font-size:13px; color:var(--text-muted); line-height:1.6;">
            Biến cấu hình đám mây chứa chuỗi ký tự mặc định "PASTE_". Vui lòng cấu hình thật file index.html.
          </p>
        </div>
      `;
    }

    function executeTextCopyToClipboardRawString(textStringPayload) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textStringPayload)
          .then(() => triggerToast('Đã sao chép liên kết hồ sơ vào bộ nhớ tạm.'))
          .catch(() => fallbackExecutionTextCopyLegacy(textStringPayload));
      } else {
        fallbackExecutionTextCopyLegacy(textStringPayload);
      }
    }

    function fallbackExecutionTextCopyLegacy(fallbackText) {
      const transientTextarea = document.createElement('textarea');
      transientTextarea.value = fallbackText; transientTextarea.style.position = 'fixed'; transientTextarea.style.left = '-9999px';
      document.body.appendChild(transientTextarea); transientTextarea.focus(); transientTextarea.select();
      try { document.execCommand('copy'); triggerToast('Đã sao chép liên kết.'); } catch (err) { triggerToast('Lỗi sao chép.', 'error'); }
      document.body.removeChild(transientTextarea);
    }

    function openLightbox(imageSourceUrl) {
      const lightboxContainer = document.getElementById('lightbox');
      document.getElementById('lightboxImg').src = imageSourceUrl;
      lightboxContainer.classList.add('show');
    }

    function closeLightbox() {
      const lightboxContainer = document.getElementById('lightbox');
      lightboxContainer.classList.remove('show');
      document.getElementById('lightboxImg').src = '';
    }

    function getCleanOriginBaseUrl() {
      return window.location.href.split('?')[0].split('#')[0].replace(/index\.html$/i, '');
    }

    function isSystemConfigHealthy() {
      return (
        CONFIG.FIREBASE.apiKey && !CONFIG.FIREBASE.apiKey.includes('PASTE_') &&
        CONFIG.CLOUDINARY_CLOUD_NAME && !CONFIG.CLOUDINARY_CLOUD_NAME.includes('PASTE_')
      );
    }

    function escapeHtmlOutput(unsafeStringValue) {
      return String(unsafeStringValue || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    // Escape dữ liệu attribute an toàn chống XSS độc hại
    function escapeAttributeData(unsafeAttrValue) { return escapeHtmlOutput(unsafeAttrValue); }
  </script>
</body>
</html>
