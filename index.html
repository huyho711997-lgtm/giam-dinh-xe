<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Hệ thống Đối chiếu Ảnh Giám định Xe Cơ giới</title>

  <!-- Firebase SDK Compatibility Version -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #f3f6fb;
      --bg-soft: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #0f766e;
      --primary-2: #14b8a6;
      --dark: #0f172a;
      --blue: #2563eb;
      --danger: #dc2626;
      --success: #059669;
      --warning: #d97706;
      --radius: 22px;
      --shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
      --shadow-soft: 0 8px 28px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(20,184,166,.18), transparent 28%),
        radial-gradient(circle at 90% 0%, rgba(37,99,235,.12), transparent 26%),
        linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    .app {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 18px 14px 110px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      padding: 22px;
      margin-bottom: 18px;
      color: #fff;
      background:
        linear-gradient(135deg, rgba(15,23,42,.98), rgba(15,118,110,.96)),
        repeating-linear-gradient(45deg, rgba(255,255,255,.04) 0 1px, transparent 1px 12px);
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -70px;
      top: -80px;
      width: 210px;
      height: 210px;
      border-radius: 999px;
      background: rgba(20,184,166,.35);
      filter: blur(3px);
    }

    .hero-head {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      cursor: pointer;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 17px;
      display: grid;
      place-items: center;
      font-size: 25px;
      background: rgba(255,255,255,.13);
      border: 1px solid rgba(255,255,255,.24);
      flex: 0 0 auto;
    }

    .brand-title {
      font-weight: 900;
      letter-spacing: -.03em;
      font-size: 17px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      margin-top: 2px;
      color: rgba(255,255,255,.7);
      font-size: 13px;
    }

    .pill {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      color: #d1fae5;
      background: rgba(16,185,129,.12);
      border: 1px solid rgba(167,243,208,.28);
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #34d399;
      box-shadow: 0 0 0 5px rgba(52,211,153,.15);
    }

    .hero h1 {
      position: relative;
      z-index: 1;
      margin: 24px 0 8px;
      font-size: clamp(24px, 4vw, 42px);
      line-height: 1.1;
      letter-spacing: -.045em;
      max-width: 850px;
    }

    .hero p {
      position: relative;
      z-index: 1;
      margin: 0;
      color: rgba(255,255,255,.76);
      font-size: 15px;
      max-width: 760px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .card {
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(226,232,240,.95);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(12px);
      margin-bottom: 16px;
    }

    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .card-title h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: -.025em;
      color: var(--dark);
    }

    .card-title small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    /* Dashboard UI Elements */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card {
      padding: 16px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 20px;
      background: #f1f5f9;
    }

    .stat-data {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    .stat-num {
      font-size: 24px;
      font-weight: 900;
      color: var(--text);
      margin-top: 2px;
    }

    /* Table custom styles */
    .table-responsive {
      overflow-x: auto;
      margin-top: 10px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f8fafc;
      padding: 14px 16px;
      font-weight: 800;
      color: #475569;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: #f8fafc;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .status-badge.pending {
      background: #fffbe6;
      color: #d97706;
    }

    .status-badge.completed {
      background: #ecfdf5;
      color: #059669;
    }

    .action-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-sm {
      padding: 6px 12px;
      min-height: unset;
      font-size: 12px;
      border-radius: 8px;
      width: auto;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 13px;
      font-weight: 850;
      color: #334155;
    }

    input[type="text"],
    input[type="file"],
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px 14px;
      font-size: 16px;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      border-color: rgba(20,184,166,.75);
      box-shadow: 0 0 0 4px rgba(20,184,166,.13);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.45;
    }

    input:disabled,
    textarea:disabled {
      background: #f8fafc;
      color: #475569;
      opacity: 1;
      -webkit-text-fill-color: #475569;
    }

    .help {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      min-height: 48px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 12px 24px rgba(20,184,166,.2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      width: 100%;
      transition: transform .12s ease, opacity .12s ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .btn-dark {
      background: linear-gradient(135deg, #0f172a, #334155);
      box-shadow: 0 12px 24px rgba(15,23,42,.15);
    }

    .btn-light {
      color: #0f172a;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .btn-blue {
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      box-shadow: 0 12px 24px rgba(37,99,235,.18);
    }

    .btn-danger {
      background: linear-gradient(135deg, #dc2626, #f87171);
      box-shadow: 0 12px 24px rgba(220,38,38,.18);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .notice {
      border-radius: 18px;
      padding: 13px 14px;
      margin: 12px 0;
      font-size: 14px;
      border: 1px solid transparent;
    }

    .notice.success { background: #ecfdf5; color: #065f46; border-color: #a7f3d0; }
    .notice.warning { background: #fffbeb; color: #92400e; border-color: #fde68a; }
    .notice.error { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
    .notice.info { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }

    .meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .meta-item {
      padding: 12px;
      border-radius: 17px;
      background: #f8fafc;
      border: 1px solid var(--border);
      min-width: 0;
    }

    .meta-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .meta-value {
      margin-top: 4px;
      font-size: 15px;
      font-weight: 900;
      word-break: break-word;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-top: 12px;
    }

    .preview {
      overflow: hidden;
      border-radius: 15px;
      border: 1px solid var(--border);
      background: #e2e8f0;
      aspect-ratio: 1 / 1;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .progress {
      display: none;
      margin-top: 14px;
    }

    .progress.show {
      display: block;
    }

    .progress-text {
      color: var(--primary);
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .bar {
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: #ccfbf1;
    }

    .bar-fill {
      height: 100%;
      width: 5%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      transition: width .25s ease;
    }

    .case-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .case-panel {
      position: static;
    }

    .image-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .image-card {
      overflow: hidden;
      background: #fff;
      border: 1px solid rgba(226,232,240,.96);
      border-radius: 24px;
      box-shadow: var(--shadow-soft);
    }

    .image-content {
      display: grid;
      grid-template-columns: 1fr;
    }

    .image-frame {
      position: relative;
      background: #0f172a;
      min-height: 220px;
      display: grid;
      place-items: center;
    }

    .image-frame img {
      width: 100%;
      max-height: 78vh;
      object-fit: contain;
      display: block;
      cursor: zoom-in;
      background: #0f172a;
    }

    .image-badge {
      position: absolute;
      left: 12px;
      top: 12px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border-radius: 999px;
      color: #fff;
      background: rgba(15,23,42,.74);
      backdrop-filter: blur(10px);
      font-size: 12px;
      font-weight: 900;
    }

    .image-side {
      padding: 15px;
    }

    .note-box {
      margin-top: 10px;
      padding: 14px;
      border-radius: 18px;
      background: linear-gradient(180deg, #f8fafc, #fff);
      border: 1px solid var(--border);
    }

    .note-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .note-content {
      margin-top: 8px;
      font-size: 18px;
      line-height: 1.45;
      font-weight: 900;
      color: var(--text);
      word-break: break-word;
      white-space: pre-wrap;
    }

    .empty-note {
      color: #94a3b8;
      font-style: italic;
      font-weight: 700;
    }

    .copy-area {
      min-height: 130px;
      font-size: 14px;
      background: #f8fafc;
    }

    .result-summary {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .summary-row {
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #f8fafc;
    }

    .summary-row strong {
      display: block;
      margin-bottom: 4px;
    }

    .sticky-submit {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      padding: 12px 14px 16px;
      background: rgba(248,250,252,.9);
      border-top: 1px solid rgba(226,232,240,.95);
      backdrop-filter: blur(16px);
      box-shadow: 0 -18px 42px rgba(15,23,42,.08);
    }

    .sticky-inner {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .loading {
      min-height: 260px;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #ccfbf1;
      border-top-color: var(--primary);
      border-radius: 999px;
      animation: spin .8s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(2,6,23,.92);
      padding: 18px;
    }

    .lightbox.show { display: grid; place-items: center; }
    .lightbox img { max-width: 100%; max-height: 88vh; object-fit: contain; border-radius: 18px; background: #000; }
    .lightbox-close { position: fixed; right: 16px; top: 16px; width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.12); color: #fff; font-size: 24px; cursor: pointer; }

    .desktop-only { display: none; }

    @media (min-width: 720px) {
      .app { padding: 26px 20px 120px; }
      .hero { padding: 30px; }
      .layout.two { grid-template-columns: 1.05fr .95fr; align-items: start; }
      .actions, .sticky-inner { grid-template-columns: repeat(2, 1fr); }
      .preview-grid { grid-template-columns: repeat(4, 1fr); }
      .meta { grid-template-columns: repeat(4, 1fr); }
      .desktop-only { display: inline; }
    }

    @media (min-width: 980px) {
      .case-grid { grid-template-columns: 360px 1fr; align-items: start; }
      .case-panel { position: sticky; top: 20px; }
      .image-content { grid-template-columns: minmax(420px, 1.1fr) minmax(280px, .9fr); }
      .image-frame { min-height: 360px; }
      .image-frame img { height: 100%; max-height: 620px; }
      .image-side { padding: 18px; }
      .sticky-submit { display: none; }
      .desktop-submit { display: grid; }
    }

    @media (max-width: 979px) { .desktop-submit { display: none; } }

    @media print {
      body { background: #fff; }
      .hero, .actions, .sticky-submit, .btn, .lightbox, .stats-grid, th:last-child, td:last-child { display: none !important; }
      .app { width: 100%; padding: 0; }
      .case-grid { display: block; }
      .card, .image-card { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
      .image-content { display: block; }
      .image-frame { background: #fff; }
      .image-frame img { max-height: none; background: #fff; }
    }
  </style>
</head>

<body>
  <div class="app">
    <section class="hero">
      <div class="hero-head">
        <div class="brand" onclick="goHome()">
          <div class="logo">🚘</div>
          <div>
            <div class="brand-title">Garage Realtime Review</div>
            <div class="brand-sub">Hệ thống Đối chiếu Ảnh Giám định & Báo giá</div>
          </div>
        </div>

        <div class="pill">
          <span class="dot"></span>
          Firebase Realtime
        </div>
      </div>

      <h1>Đối chiếu ảnh tổn thất xe cơ giới</h1>
      <p>
        Tự động đồng bộ thời gian thực. Tạo ca, gửi link nhập dữ liệu cho Garage và quản lý toàn bộ tiến độ tập trung trên Dashboard.
      </p>
    </section>

    <main id="app"></main>
  </div>

  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" type="button" onclick="closeLightbox()">×</button>
    <img id="lightboxImg" src="" alt="Ảnh phóng to">
  </div>

  <script>
    /****************************************************
     * CẤU HÌNH HỆ THỐNG (BẮT BUỘC THAY ĐỔI)
     ****************************************************/
    const CONFIG = {
      // 1. Cấu hình Firebase Web App của bạn
      FIREBASE: {
        apiKey: "AIzaSyCZoQ3_YFxGLPb7eRJ6Ming0mghMUafSKI",
        authDomain: "doi-chieu-gara.firebaseapp.com",
        databaseURL: "https://doi-chieu-gara-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "doi-chieu-gara",
        storageBucket: "doi-chieu-gara.firebasestorage.app",
        messagingSenderId: "455769692413",
        appId: "1:455769692413:web:241f9daff918ecc69b8694",
        measurementId: "G-VBXHGY09XX"
      },

      // 2. Cấu hình Cloudinary để tải ảnh lên công khai
      CLOUDINARY_CLOUD_NAME: 'ug4spdjp',
      CLOUDINARY_UPLOAD_PRESET: 'giam_dinh_xe_unsigned',
      CLOUDINARY_FOLDER: 'giam_dinh_xe'
    };

    const STATUS_CHO_DIEN = 'Chờ điền';
    const STATUS_DA_DIEN = 'Đã điền';

    const app = document.getElementById('app');
    let db = null;
    let currentCase = null;
    let currentImages = [];

    document.addEventListener('DOMContentLoaded', init);

    function init() {
      if (!isConfigValid()) {
        renderConfigError();
        return;
      }

      // Khởi tạo Firebase
      firebase.initializeApp(CONFIG.FIREBASE);
      db = firebase.database();

      route();
    }

    // Điều hướng View dựa theo URL Query Parameters
    function route() {
      const params = new URLSearchParams(window.location.search);
      const idCa = params.get('idCa');
      const view = params.get('view');

      if (!idCa) {
        renderDashboardView();
      } else {
        loadCaseRealtime(idCa, view);
      }
    }

    function goHome() {
      window.history.pushState({}, '', getBaseUrl());
      route();
    }

    /****************************************************
     * MÀN HÌNH QUẢN LÝ TẬP TRUNG (DASHBOARD)
     ****************************************************/
    function renderDashboardView() {
      app.innerHTML = `
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon" style="color:var(--primary); background:rgba(20,184,166,.1);">📁</div>
            <div class="stat-data">
              <span class="stat-label">Tổng số ca</span>
              <span class="stat-num" id="statTotal">0</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="color:var(--warning); background:rgba(217,119,6,.1);">⏳</div>
            <div class="stat-data">
              <span class="stat-label">Chờ nhập liệu</span>
              <span class="stat-num" id="statPending">0</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="color:var(--success); background:rgba(5,150,105,.1);">✅</div>
            <div class="stat-data">
              <span class="stat-label">Đã hoàn thành</span>

    function renderTableData(data) {
      const tbody = document.getElementById('caseTableBody');
      const statTotal = document.getElementById('statTotal');
      const statPending = document.getElementById('statPending');
      const statCompleted = document.getElementById('statCompleted');

      if (!tbody) return; 

      if (!data) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--muted);">Chưa có phiên nào được khởi tạo.</td></tr>`;
        statTotal.textContent = 0;
        statPending.textContent = 0;
        statCompleted.textContent = 0;
        return;
      }

      let total = 0, pending = 0, completed = 0;
      const rowsHtml = Object.keys(data).reverse().map(key => {
        const item = data[key];
        total++;
        if (item.trangThai === STATUS_DA_DIEN) completed++;
        else pending++;

        const isDone = item.trangThai === STATUS_DA_DIEN;
        const statusClass = isDone ? 'completed' : 'pending';
        const linkGarage = `${getBaseUrl()}?idCa=${key}`;
        const linkResult = `${getBaseUrl()}?idCa=${key}&view=result`;

        return `
          <tr>
            <td>
              <strong style="font-size:15px; color:var(--dark);">${escapeHtml(item.bienSo)}</strong>
              <div style="font-size:12px; color:var(--muted); margin-top:2px;">${escapeHtml(item.tenGara)}</div>
            </td>
            <td><strong>${item.soLuongAnh || 0}</strong></td>
            <td>
              <span class="status-badge ${statusClass}">
                <span class="dot" style="background-color:${isDone ? '#10b981':'#f59e0b'}; box-shadow:none; width:6px; height:6px;"></span>
                ${escapeHtml(item.trangThai)}
              </span>
            </td>
            <td>
              <div class="action-group">
                <button class="btn btn-sm" onclick="openLink('${linkGarage}')">Link Nhập</button>
                <button class="btn btn-sm btn-dark" onclick="openLink('${linkResult}')">Xem kết quả</button>
                <button class="btn btn-sm btn-danger" onclick="deleteCase('${key}', '${escapeAttr(item.bienSo)}')">Xoá</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      tbody.innerHTML = rowsHtml;
      statTotal.textContent = total;
      statPending.textContent = pending;
      statCompleted.textContent = completed;
    }

    function openLink(url) {
      window.open(url, '_blank');
    }

    async function deleteCase(idCa, bienSo) {
      if (confirm(`Bạn có chắc chắn muốn xoá toàn bộ dữ liệu của phiên xe: ${bienSo}?`)) {
        await db.ref(`cases/${idCa}`).remove();
        alert('Đã xoá phiên thành công.');
      }
    }

    function handlePreview() {
      const files = Array.from(document.getElementById('images').files || []);
      const info = document.getElementById('fileInfo');
      const grid = document.getElementById('previewGrid');

      grid.innerHTML = '';
      if (!files.length) {
        info.textContent = 'Có thể chọn nhiều ảnh cùng lúc.';
        return;
      }

      info.textContent = `Đã lựa chọn ${files.length} tập tin ảnh.`;
      files.slice(0, 8).forEach(file => {
        const url = URL.createObjectURL(file);
        const div = document.createElement('div');
        div.className = 'preview';
        div.innerHTML = `<img src="${url}" alt="Preview">`;
        grid.appendChild(div);
      });

      if (files.length > 8) {
        const div = document.createElement('div');
        div.className = 'preview';
        div.style.display = 'grid';
        div.style.placeItems = 'center';
        div.style.fontWeight = '900';
        div.style.color = '#64748b';
        div.textContent = `+${files.length - 8}`;
        grid.appendChild(div);
      }
    }

    /****************************************************
     * LUỒNG TẠO PHIÊN (CREATE CASE)
     ****************************************************/
    async function createCaseFlow() {
      const bienSo = document.getElementById('bienSo').value.trim();
      const tenGara = document.getElementById('tenGara').value.trim();
      const files = Array.from(document.getElementById('images').files || []);
      const btn = document.getElementById('createBtn');

      if (!bienSo || !tenGara || !files.length) {
        alert('Vui lòng điền đầy đủ thông tin Biển số, Tên Gara và chọn ít nhất 1 ảnh.');
        return;
      }

      try {
        setButtonBusy(btn, true, 'Đang tiến hành...');
        setProgress('Đang khởi chạy luồng tải ảnh...', 5);

        // Upload ảnh lên Cloudinary
        const imageLinks = await uploadImages(files);
        setProgress('Ảnh đã lưu. Đang đồng bộ cấu trúc Firebase...', 85);

        // Chuẩn bị dữ liệu để đồng bộ sang Firebase
        const idCa = 'CASE_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5).toUpperCase();
        
        const formatHinhAnh = imageLinks.map(link => ({
          linkAnh: link,
          hangMucBaoGia: ""
        }));

        const newCaseData = {
          idCa,
          bienSo,
          tenGara,
          trangThai: STATUS_CHO_DIEN,
          soLuongAnh: formatHinhAnh.length,
          hinhAnh: formatHinhAnh,
          createdAt: firebase.database.ServerValue.TIMESTAMP
        };

        // Lưu trực tiếp vào Firebase Realtime Database
        await db.ref(`cases/${idCa}`).set(newCaseData);

        setProgress('Xử lý hoàn tất.', 100);

        const garageLink = `${getBaseUrl()}?idCa=${idCa}`;
        const resultLink = `${getBaseUrl()}?idCa=${idCa}&view=result`;

        renderCreateSuccess(newCaseData, garageLink, resultLink);

        // Xoá form nhập sau khi hoàn thành
        document.getElementById('bienSo').value = '';
        document.getElementById('tenGara').value = '';
        document.getElementById('images').value = '';
        document.getElementById('previewGrid').innerHTML = '';

      } catch (err) {
        console.error(err);
        alert(err.message || 'Lỗi xảy ra trong quá trình khởi tạo.');
        setProgress('', 0);
      } finally {
        setButtonBusy(btn, false, 'Bắt đầu upload & Tạo ca');
      }
    }

    /****************************************************
     * LUỒNG TẢI VÀ ĐỒNG BỘ MÀN HÌNH REALTIME (VIEW)
     ****************************************************/
    function loadCaseRealtime(idCa, view) {
      renderLoading('Đang thiết lập kết nối thời gian thực...');

      // Thiết lập cổng lắng nghe sự kiện thay đổi dữ liệu liên tục từ Firebase Realtime Database
      db.ref(`cases/${idCa}`).on('value', (snapshot) => {
        const val = snapshot.val();
        
        if (!val) {
          renderError('Mã phiên giám định không tồn tại hoặc đã bị gỡ bỏ.');
          return;
        }

        currentCase = val;
        currentImages = Array.isArray(val.hinhAnh) ? val.hinhAnh : Object.values(val.hinhAnh || {});

        const forcedResult = view === 'result';
        const isLocked = currentCase.trangThai === STATUS_DA_DIEN;

        // Tự động hoán đổi giao diện ngay lập tức khi trạng thái thay đổi ở bất kỳ đâu
        if (forcedResult || isLocked) {
          renderResultView();
        } else {
          renderGarageInputView();
        }
      }, (error) => {
        renderError('Lỗi phân quyền hoặc mất kết nối tới Database: ' + error.message);
      });
    }

    async function submitGarageItems() {
      const inputs = Array.from(document.querySelectorAll('.quote-input'));
      const blankCount = inputs.filter(input => !input.value.trim()).length;

      if (blankCount > 0) {
        if (!confirm(`Hiện có ${blankCount} bức ảnh để trống nội dung. Xác nhận tiếp tục gửi?`)) return;
      }

      if (!confirm('Sau khi gửi, toàn bộ biểu mẫu sẽ được khóa tự động để Giám định viên đối chiếu. Xác nhận hoàn tất?')) return;

      const items = inputs.map(input => {
        const index = Number(input.dataset.index);
        return {
          linkAnh: currentImages[index].linkAnh,
          hangMucBaoGia: input.value.trim()
        };
      });

      try {
        // Cập nhật cấu trúc mảng lên thẳng node Firebase Realtime Database
        await db.ref(`cases/${currentCase.idCa}`).update({
          hinhAnh: items,
          trangThai: STATUS_DA_DIEN
        });

        // Đổi url tĩnh sang view result, giao diện sẽ tự render lại nhờ cổng lắng nghe .on()
        const resultUrl = `${getBaseUrl()}?idCa=${encodeURIComponent(currentCase.idCa)}&view=result`;
        window.history.replaceState({}, '', resultUrl);

      } catch (err) {
        console.error(err);
        alert('Lỗi mất đồng bộ dữ liệu: ' + err.message);
      }
    }

    function buildResultText() {
      const ca = currentCase || {};
      const lines = [];

      lines.push('=============================================');
      lines.push('       KẾT QUẢ ĐỐI CHIẾU HẠNG MỤC TỔN THẤT   ');
      lines.push('=============================================');
      lines.push(`- Mã hồ sơ: ${ca.idCa || ''}`);
      lines.push(`- Biển kiểm soát: ${ca.bienSo || ''}`);
      lines.push(`- Đơn vị báo giá: ${ca.tenGara || ''}`);
      lines.push(`- Tình trạng biểu mẫu: ${ca.trangThai || ''}`);
      lines.push('---------------------------------------------\n');

      currentImages.forEach((item, index) => {
        lines.push(`[Ảnh chụp số ${index + 1}]`);
        lines.push(`+ Hạng mục sửa chữa: ${item.hangMucBaoGia || 'Không khai báo'}`);
        lines.push(`+ URL ảnh gốc: ${item.linkAnh || ''}`);
        lines.push('');
      });

      return lines.join('\n');
    }

    function copyResultText() { copyText(buildResultText()); }

    /****************************************************
     * XỬ LÝ API CORE - CLOUDINARY UPLOAD
     ****************************************************/
    async function uploadImages(files) {
      const links = [];
      for (let i = 0; i < files.length; i++) {
        const percent = Math.round(((i + 1) / files.length) * 80);
        setProgress(`Đang tiến hành truyền tải tệp ảnh (${i + 1}/${files.length})...`, percent);

        const link = await uploadOneImage(files[i]);
        links.push(link);
      }
      return links;
    }

    async function uploadOneImage(file) {
      const url = `https://api.cloudinary.com/v1_1/${encodeURIComponent(CONFIG.CLOUDINARY_CLOUD_NAME)}/image/upload`;
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CONFIG.CLOUDINARY_UPLOAD_PRESET);
      if (CONFIG.CLOUDINARY_FOLDER) {
        formData.append('folder', CONFIG.CLOUDINARY_FOLDER);
      }

      const response = await fetch(url, { method: 'POST', body: formData });
      const text = await response.text();
      
      let data;
      try { data = JSON.parse(text); } catch(e) { throw new Error('Cloudinary server response invalid format JSON.'); }

      if (!response.ok || !data.secure_url) {
        throw new Error(data?.error?.message || 'Lỗi tải ảnh lên Cloudinary.');
      }
      return data.secure_url;
    }

    /****************************************************
     * THÀNH PHẦN HỖ TRỢ GIAO DIỆN (HELPERS)
     ****************************************************/
    function renderLoading(message) {
      app.innerHTML = `
        <section class="card loading">
          <div>
            <div class="spinner"></div>
            <h2 style="margin:0 0 6px; font-size:18px;">${escapeHtml(message)}</h2>
            <div class="help">Quá trình này diễn ra hoàn toàn tự động dựa trên băng thông đám mây.</div>
          </div>
        </section>
      `;
    }

    function renderError(message) {
      app.innerHTML = `
        <section class="card">
          <div class="card-title">
            <h2>Đã xảy ra sự cố nghẽn mạng</h2>
            <small>Cảnh báo lỗi</small>
          </div>
          <div class="notice error">${escapeHtml(message)}</div>
          <div class="actions">
            <button class="btn btn-light" type="button" onclick="window.location.reload()">Thử tải lại trang</button>
            <button class="btn" type="button" onclick="goHome()">Trở về màn hình Dashboard</button>
          </div>
        </section>
      `;
    }

    function renderConfigError() {
      app.innerHTML = `
        <section class="card">
          <div class="card-title">
            <h2>Phát hiện lỗi cấu hình ứng dụng</h2>
            <small>Cài đặt</small>
          </div>
          <div class="notice error">
            Hệ thống phát hiện biến <strong>CONFIG.FIREBASE</strong> hoặc các thông số <strong>CLOUDINARY</strong> trong thẻ &lt;script&gt; chưa được điền thông tin thật hoặc chứa chuỗi tạm "PASTE_". Vui lòng kiểm tra lại mã nguồn file index.html.
          </div>
        </section>
      `;
    }

    function setProgress(message, percent) {
      const wrap = document.getElementById('progress');
      const text = document.getElementById('progressText');
      const fill = document.getElementById('progressFill');
      if (!wrap || !text || !fill) return;

      if (!message) {
        wrap.classList.remove('show');
        return;
      }
      wrap.classList.add('show');
      text.textContent = message;
      fill.style.width = `${Math.max(0, Math.min(100, percent))}%`;
    }

    function setButtonBusy(button, busy, text) {
      if (!button) return;
      if (busy) {
        button.dataset.oldText = button.textContent;
        button.textContent = text;
        button.disabled = true;
      } else {
        button.textContent = button.dataset.oldText || text;
        button.disabled = false;
      }
    }

    function copyById(id) {
      const el = document.getElementById(id);
      if (el) copyText(el.value || el.textContent || '');
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => alert('Đã sao chép vào bộ nhớ tạm.')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const area = document.createElement('textarea');
      area.value = text; area.style.position = 'fixed'; area.style.left = '-9999px';
      document.body.appendChild(area); area.focus(); area.select();
      try { document.execCommand('copy'); alert('Đã sao chép.'); } catch (err) { alert('Không thể sao chép tự động.'); }
      document.body.removeChild(area);
    }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('show');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('show');
      document.getElementById('lightboxImg').src = '';
    }

    function scrollTopSmooth() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

    function getBaseUrl() {
      return window.location.href.split('?')[0].split('#')[0].replace(/index\.html$/i, '');
    }

    function isConfigValid() {
      return (
        CONFIG.FIREBASE.apiKey && !CONFIG.FIREBASE.apiKey.includes('PASTE_') &&
        CONFIG.CLOUDINARY_CLOUD_NAME && !CONFIG.CLOUDINARY_CLOUD_NAME.includes('PASTE_')
      );
    }

    function escapeHtml(value) {
      return String(value || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function escapeAttr(value) { return escapeHtml(value); }
  </script>
</body>
</html>
