<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hệ thống Đối chiếu Ảnh Giám định Xe Cơ giới - Premium</title>

  <!-- Google Fonts & Firebase SDK Compatibility Version -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --panel-bg: rgba(255, 255, 255, 0.85);
      --card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      
      /* Premium Color Palette */
      --primary: #0284c7;
      --primary-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      --accent: #0ea5e9;
      --dark: #0f172a;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-premium: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 20px 40px -10px rgba(0, 0, 0, 0.03);
      --shadow-hover: 0 20px 40px -5px rgba(2, 132, 199, 0.12);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      color: var(--text-main);
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(2, 132, 199, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.03) 0px, transparent 50%);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Premium Notification System (Toast) */
    .toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toast {
      background: var(--card);
      border-left: 4px solid var(--primary);
      padding: 16px 20px;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateX(120%);
      animation: slideIn 0.3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
      min-width: 300px;
      font-weight: 600;
      font-size: 14px;
    }

    @keyframes slideIn { to { transform: translateX(0); } }

    .toast.success { border-left-color: var(--success); color: #065f46; background: #f0fdf4; }
    .toast.error { border-left-color: var(--danger); color: #991b1b; background: #fef2f2; }
    .toast.warning { border-left-color: var(--warning); color: #92400e; background: #fffbeb; }

    /* Custom Premium Modal */
    .p-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 999;
      display: none;
      place-items: center;
      padding: 20px;
    }
    .p-modal {
      background: var(--card);
      border-radius: var(--radius-lg);
      padding: 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-premium);
      text-align: center;
      animation: modalUnfold 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards;
    }
    @keyframes modalUnfold { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    
    .p-modal h3 { font-size: 18px; margin-bottom: 12px; font-weight: 700; }
    .p-modal p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
    .p-modal-btns { display: flex; gap: 12px; }

    /* App Layout Container */
    .app-container {
      max-width: 1340px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }

    /* Modern Navigation Header */
    .premium-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 16px 24px;
      border-radius: var(--radius-lg);
      margin-bottom: 32px;
      box-shadow: var(--shadow-premium);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
    }

    .nav-logo {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      font-size: 22px;
    }

    .nav-titles h1 { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
    .nav-titles p { font-size: 12px; color: var(--text-muted); font-weight: 500; }

    /* Stats Section */
    .premium-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-premium);
    }

    .stat-info .stat-val { font-size: 28px; font-weight: 800; line-height: 1.2; margin-top: 4px; }
    .stat-info .stat-lbl { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-icon-wrap { width: 48px; height: 48px; border-radius: var(--radius-md); display: grid; place-items: center; font-size: 20px; background: #f1f5f9; }

    /* Main Grid Split Workspace */
    .workspace-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
    }

    @media (min-width: 1024px) {
      .workspace-grid.two-cols { grid-template-columns: 440px 1fr; align-items: start; }
    }

    /* Premium Base Cards */
    .p-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-premium);
    }

    .p-card-head {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .p-card-head h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
    .p-card-head p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    /* Form Controls Optimization */
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 8px; }
    
    .input-premium {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-main);
      background: #f8fafc;
      outline: none;
      transition: var(--transition);
    }

    .input-premium:focus {
      background: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px cubic-bezier(2, 132, 199, 0.15);
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12);
    }

    /* Premium File Uploader Drag & Drop Zone */
    .dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: var(--radius-md);
      padding: 32px 20px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
      transition: var(--transition);
    }

    .dropzone:hover { border-color: var(--primary); background: rgba(2, 132, 199, 0.02); }
    .dropzone icon { font-size: 32px; display: block; margin-bottom: 10px; }
    .dropzone p { font-size: 13px; color: var(--text-muted); font-weight: 500; }

    .preview-grid-premium {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .preview-thumb {
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }

    .preview-thumb img { width: 100%; height: 100%; object-fit: cover; }

    /* Advanced Buttons Design */
    .btn-premium {
      appearance: none;
      border: 0;
      font-family: inherit;
      padding: 14px 24px;
      font-size: 14px;
      font-weight: 700;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #fff;
      background: var(--primary-gradient);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
      transition: var(--transition);
      width: 100%;
    }

    .btn-premium:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); }
    .btn-premium:active { transform: translateY(1px); }
    .btn-premium:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-secondary { background: #f1f5f9; color: #334155; box-shadow: none; border: 1px solid var(--border); }
    .btn-secondary:hover { background: #e2e8f0; box-shadow: none; }
    .btn-danger-p { background: #fef2f2; color: var(--danger); box-shadow: none; }
    .btn-danger-p:hover { background: #fee2e2; box-shadow: none; }

    /* Premium Smart Table Data View */
    .table-container {
      overflow-x: auto;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .p-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    .p-table th { background: #f8fafc; padding: 16px; font-weight: 700; color: #475569; border-bottom: 1px solid var(--border); }
    .p-table td { padding: 16px; border-bottom: 1px solid var(--border); background: #fff; vertical-align: middle; }
    .p-table tr:last-child td { border-bottom: none; }
    .p-table tr:hover td { background: #f8fafc; }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge-status.pending { background: #fff7ed; color: var(--warning); }
    .badge-status.completed { background: #ecfdf5; color: var(--success); }

    /* Focus Mode Design (Distraction-Free) for Portal View */
    .focus-portal-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
    }
    @media (min-width: 1024px) {
      .focus-portal-layout { grid-template-columns: 380px 1fr; align-items: start; }
      .sticky-sidebar { position: sticky; top: 24px; }
    }

    .image-workspace-list { display: flex; flex-direction: column; gap: 24px; }
    
    .premium-image-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-premium);
      display: grid;
      grid-template-columns: 1fr;
    }
    @media (min-width: 640px) {
      .premium-image-card { grid-template-columns: 1fr 1fr; }
    }

    .img-display-pane { background: #0f172a; display: grid; place-items: center; position: relative; min-height: 260px; }
    .img-display-pane img { width: 100%; height: 100%; object-fit: contain; max-height: 400px; cursor: zoom-in; }
    .img-pane-indicator { position: absolute; left: 16px; top: 16px; background: rgba(15,23,42,0.6); backdrop-filter: blur(8px); padding: 6px 12px; border-radius: 999px; color: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

    .inputs-entry-pane { padding: 24px; display: flex; flex-direction: column; justify-content: space-between; background: #fff; }
    .inputs-entry-pane textarea { width: 100%; min-height: 140px; border: 1px solid var(--border); background: #f8fafc; border-radius: var(--radius-md); padding: 14px; font-family: inherit; font-size: 14px; outline: none; resize: vertical; transition: var(--transition); line-height: 1.5; }
    .inputs-entry-pane textarea:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1); }

    /* Summary Block Output Layout */
    .summary-row-box { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 12px; }
    
    /* Progress Bars UI */
    .p-progress-bar { height: 6px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-top: 12px; display: none; }
    .p-progress-bar.active { display: block; }
    .p-progress-fill { height: 100%; width: 0%; background: var(--primary-gradient); transition: width 0.2s ease; }

    /* Lightbox Premium Custom overlay */
    .premium-lightbox { position: fixed; inset: 0; background: rgba(15,23,42,0.95); backdrop-filter: blur(8px); z-index: 2000; display: none; place-items: center; padding: 24px; opacity: 0; transition: opacity 0.3s ease; }
    .premium-lightbox.show { display: grid; opacity: 1; }
    .premium-lightbox img { max-width: 100%; max-height: 90vh; object-fit: contain; border-radius: var(--radius-md); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .lightbox-close-btn { position: absolute; top: 24px; right: 24px; width: 48px; height: 48px; border-radius: 999px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 24px; cursor: pointer; display: grid; place-items: center; transition: var(--transition); }
    .lightbox-close-btn:hover { background: rgba(255,255,255,0.2); }

    /* Helper utility configurations */
    .text-link-area { min-height: 80px; font-size: 13px; font-family: monospace; color: #334155; background: #f1f5f9 !important; cursor: default; }
    .flex-actions-group { display: flex; gap: 8px; margin-top: 12px; }
    
    .spinner-premium { width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.6s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state-text { text-align: center; color: var(--text-muted); font-style: italic; padding: 32px 16px; }

    @media print {
      body { background: #fff; }
      .premium-nav, .premium-stats, .dropzone, .btn-premium, .lightbox-close-btn, .sticky-sidebar .btn-premium, th:last-child, td:last-child { display: none !important; }
      .app-container { padding: 0; }
      .focus-portal-layout { display: block; }
      .premium-image-card { box-shadow: none; border: 1px solid #cbd5e1; page-break-inside: avoid; margin-bottom: 20px; display: block; }
      .img-display-pane img { max-height: 280px; }
    }
  </style>
</head>
<body>

  <!-- Custom Toast Systems -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Custom Confirmation Modals -->
  <div id="modalOverlay" class="p-modal-overlay">
    <div class="p-modal">
      <h3 id="modalTitle">Xác nhận</h3>
      <p id="modalMsg">Bạn có chắc chắn muốn thực hiện hành động này?</p>
      <div class="p-modal-btns">
        <button id="modalCancel" class="btn-premium btn-secondary">Hủy</button>
        <button id="modalConfirm" class="btn-premium">Xác nhận</button>
      </div>
    </div>
  </div>

  <div class="app-container">
    <!-- Header App Bar Space -->
    <nav class="premium-nav">
      <div class="nav-brand" onclick="goHome()">
        <div class="nav-logo">🛡️</div>
        <div class="nav-titles">
          <h1>Workspace Core Systems</h1>
          <p>Hệ thống Giám định & Giải quyết Tổn thất Cơ giới Realtime</p>
        </div>
      </div>
    </nav>

    <!-- Dynamic Layout Mounting Base Injection point -->
    <main id="appRoot"></main>
  </div>

  <!-- Lightbox Media View Module component -->
  <div id="lightbox" class="premium-lightbox" onclick="closeLightbox()">
    <button class="lightbox-close-btn" type="button" onclick="closeLightbox()">×</button>
    <img id="lightboxImg" src="" alt="Zoomed View Image Source">
  </div>

  <script>
    /****************************************************
     * CORE CREDENTIALS INFRASTRUCTURE CONFIGURATIONS
     ****************************************************/
    const CONFIG = {
      FIREBASE: {
        apiKey: "AIzaSyCZoQ3_YFxGLPb7eRJ6Ming0mghMUafSKI",
        authDomain: "doi-chieu-gara.firebaseapp.com",
        databaseURL: "https://doi-chieu-gara-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "doi-chieu-gara",
        storageBucket: "doi-chieu-gara.firebasestorage.app",
        messagingSenderId: "455769692413",
        appId: "1:455769692413:web:241f9daff918ecc69b8694",
        measurementId: "G-VBXHGY09XX"
      },
      CLOUDINARY_CLOUD_NAME: 'ug4spdjp',
      CLOUDINARY_UPLOAD_PRESET: 'giam_dinh_xe_unsigned',
      CLOUDINARY_FOLDER: 'giam_dinh_xe'
    };

    const STATUS_PENDING = 'Chờ điền';
    const STATUS_COMPLETED = 'Đã điền';

    const rootContainer = document.getElementById('appRoot');
    let dbNodeInstance = null;
    let localActiveCaseNode = null;
    let localActiveImageStack = [];

    // Prompt Modal Functionality Promises Wrapper
    function showConfirmModal(title, msg) {
      return new Promise((resolve) => {
        const overlay = document.getElementById('modalOverlay');
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalMsg').textContent = msg;
        overlay.style.display = 'grid';
        
        const cleanUp = (res) => {
          overlay.style.display = 'none';
          document.getElementById('modalConfirm').onclick = null;
          document.getElementById('modalCancel').onclick = null;
          resolve(res);
        };
        document.getElementById('modalConfirm').onclick = () => cleanUp(true);
        document.getElementById('modalCancel').onclick = () => cleanUp(false);
      });
    }

    // Modern Toast Alerts triggers
    function triggerToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const element = document.createElement('div');
      element.className = `toast ${type}`;
      element.textContent = message;
      container.appendChild(element);
      setTimeout(() => element.remove(), 4000);
    }

    document.addEventListener('DOMContentLoaded', initApplicationState);

    function initApplicationState() {
      if (!isSystemConfigHealthy()) {
        renderFatalConfigurationFailure();
        return;
      }
      firebase.initializeApp(CONFIG.FIREBASE);
      dbNodeInstance = firebase.database();
      evaluateViewRoutingState();
    }

    function evaluateViewRoutingState() {
      const URLQueryStrings = new URLSearchParams(window.location.search);
      const caseIdToken = URLQueryStrings.get('idCa');
      const targetedViewArg = URLQueryStrings.get('view');

      if (!caseIdToken) {
        renderManagerDashboardWorkspace();
      } else {
        bindAndFetchCaseRealtimeSync(caseIdToken, targetedViewArg);
      }
    }

    function goHome() {
      window.history.pushState({}, '', getCleanOriginBaseUrl());
      evaluateViewRoutingState();
    }

    /****************************************************
     * 1. CORE INTERNAL MANAGEMENT WORKSPACE VIEW (DASHBOARD)
     ****************************************************/
    function renderManagerDashboardWorkspace() {
      rootContainer.innerHTML = `
        <div class="premium-stats">
          <div class="stat-box">
            <div class="stat-info">
              <div class="stat-lbl">Tổng ca tiếp nhận</div>
              <div class="stat-val" id="lblTotalCases">0</div>
            </div>
            <div class="stat-icon-wrap" style="color:var(--primary)">📁</div>
          </div>
          <div class="stat-box">
            <div class="stat-info">
              <div class="stat-lbl">Hồ sơ chờ nhập</div>
              <div class="stat-val" id="lblPendingCases" style="color:var(--warning)">0</div>
            </div>
            <div class="stat-icon-wrap">⏳</div>
          </div>
          <div class="stat-box">
            <div class="stat-info">
              <div class="stat-lbl">Hồ sơ hoàn tất</div>
              <div class="stat-val" id="lblCompletedCases" style="color:var(--success)">0</div>
            </div>
            <div class="stat-icon-wrap">✅</div>
          </div>
        </div>

        <div class="workspace-grid two-cols">
          <section class="p-card">
            <div class="p-card-head">
              <h2>Khởi tạo hồ sơ mới</h2>
              <p>Nhập thông tin mục tiêu phương tiện và tải lên danh sách dữ liệu ảnh gốc ban đầu.</p>
            </div>
            
            <div class="form-group">
              <label>Biển kiểm soát phương tiện</label>
              <input id="txtPlateNumber" class="input-premium" type="text" placeholder="Ví dụ: 30H-123.45" autocomplete="off" />
            </div>

            <div class="form-group">
              <label>Đơn vị Gara sửa chữa chỉ định</label>
              <input id="txtGaragePartner" class="input-premium" type="text" placeholder="Ví dụ: Gara ô tô Hàng Kênh" autocomplete="off" />
            </div>

            <div class="form-group">
              <label>Tệp dữ liệu ảnh hiện trạng giám định</label>
              <div class="dropzone" onclick="document.getElementById('fileImageUploader').click()">
                <icon>📸</icon>
                <p>Nhấp vào đây để chọn tệp tin hình ảnh tổn thất</p>
                <input id="fileImageUploader" type="file" accept="image/*" multiple style="display:none;" />
              </div>
              <div id="lblDropzoneSummary" class="empty-state-text" style="font-size:12px; padding:8px 0 0;">Chưa có ảnh nào được chọn. Hỗ trợ chọn đồng thời nhiều tệp.</div>
              <div id="boxPreviewsHolder" class="preview-grid-premium"></div>
            </div>

            <div id="creationProgressContainer" class="p-progress-bar">
              <div id="creationProgressFill" class="p-progress-fill"></div>
            </div>
            <div id="lblCreationStatus" style="font-size:12px; font-weight:600; color:var(--primary); margin-top:6px; display:none;"></div>

            <button id="btnCreateCaseSubmit" class="btn-premium" style="margin-top:16px;">Tạo hồ sơ dữ liệu & Đồng bộ</button>
          </section>

          <section class="p-card">

    function executeUIRenderCasesTable(casesPayload) {
      const tableBody = document.getElementById('tblCasesBodyContainer');
      const totalLbl = document.getElementById('lblTotalCases');
      const pendingLbl = document.getElementById('lblPendingCases');
      const completedLbl = document.getElementById('lblCompletedCases');

      if (!tableBody) return;

      if (!casesPayload) {
        tableBody.innerHTML = `<tr><td colspan="4" class="empty-state-text">Hệ thống chưa ghi nhận bất kỳ hồ sơ giám định nào.</td></tr>`;
        totalLbl.textContent = '0'; pendingLbl.textContent = '0'; completedLbl.textContent = '0';
        return;
      }

      let metricTotal = 0, metricPending = 0, metricCompleted = 0;
      const computedTableRowsHTML = Object.keys(casesPayload).reverse().map(uniqueKeyToken => {
        const entityNode = casesPayload[uniqueKeyToken];
        metricTotal++;
        
        const isCaseDone = entityNode.trangThai === STATUS_COMPLETED;
        if (isCaseDone) metricCompleted++; else metricPending++;

        const targetBadgeClass = isCaseDone ? 'completed' : 'pending';
        const partnerPortalInputLink = `${getCleanOriginBaseUrl()}?idCa=${uniqueKeyToken}`;
        const internalResultReviewLink = `${getCleanOriginBaseUrl()}?idCa=${uniqueKeyToken}&view=result`;

        return `
          <tr>
            <td>
              <div style="font-weight:700; color:var(--dark); font-size:15px;">${escapeHtmlOutput(entityNode.bienSo)}</div>
              <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">${escapeHtmlOutput(entityNode.tenGara)}</div>
            </td>
            <td><span style="font-weight:700;">${entityNode.soLuongAnh || 0}</span> ảnh</td>
            <td>
              <span class="badge-status ${targetBadgeClass}">
                <span style="width:6px; height:6px; border-radius:50%; background:currentColor"></span>
                ${escapeHtmlOutput(entityNode.trangThai)}
              </span>
            </td>
            <td>
              <div class="flex-actions-group">
                <button class="btn-premium btn-secondary" style="padding:6px 12px; font-size:12px;" onclick="window.open('${partnerPortalInputLink}', '_blank')">Link Nhập</button>

    /****************************************************
     * FILE UPLOAD STREAM & TRANSACTION FLOWS
     ****************************************************/
    async function pipelineTriggerCaseCreationFlow() {
      const plateInputVal = document.getElementById('txtPlateNumber').value.trim();
      const garageInputVal = document.getElementById('txtGaragePartner').value.trim();
      const imagesFileList = Array.from(document.getElementById('fileImageUploader').files || []);
      const triggerButton = document.getElementById('btnCreateCaseSubmit');

      if (!plateInputVal || !garageInputVal || !imagesFileList.length) {
        triggerToast('Vui lòng điền đầy đủ thông tin Biển số, Gara chỉ định và đính kèm ít nhất 1 hình ảnh.', 'error');
        return;
      }

      try {
        toggleButtonUIPendingState(triggerButton, true, 'Đang chuẩn bị luồng dữ liệu...');
        updateProgressBarIndicator('Đang khởi tạo kết nối Cloudinary Storage API...', 5);

        const secureHostedImageUrlsArray = await executionSequentialImagesUploadCore(imagesFileList);
        updateProgressBarIndicator('Đồng bộ kiến trúc dữ liệu sang Cơ sở dữ liệu Firebase...', 90);

        const generatedCaseUniqueToken = 'CASE_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5).toUpperCase();
        const mappedImageNodeObjects = secureHostedImageUrlsArray.map(secureUrl => ({
          linkAnh: secureUrl,
          hangMucBaoGia: ""
        }));

        const finalPayloadStructure = {
          idCa: generatedCaseUniqueToken,
          bienSo: plateInputVal,
          tenGara: garageInputVal,
          trangThai: STATUS_PENDING,
          soLuongAnh: mappedImageNodeObjects.length,
          hinhAnh: mappedImageNodeObjects,
          createdAt: firebase.database.ServerValue.TIMESTAMP
        };

        await dbNodeInstance.ref(`cases/${generatedCaseUniqueToken}`).set(finalPayloadStructure);
        updateProgressBarIndicator('Giao dịch hoàn tất.', 100);
        triggerToast('Khởi tạo hồ sơ xe thành công thời gian thực.');

        renderInlineCreationSuccessPanel(finalPayloadStructure);

        // Reset input fields
        document.getElementById('txtPlateNumber').value = '';
        document.getElementById('txtGaragePartner').value = '';
        document.getElementById('fileImageUploader').value = '';
        document.getElementById('boxPreviewsHolder').innerHTML = '';
        document.getElementById('lblDropzoneSummary').textContent = 'Chưa có ảnh nào được chọn. Hỗ trợ chọn đồng thời nhiều tệp.';
      } catch (exception) {
        console.error(exception);
        triggerToast(exception.message || 'Lỗi bất định phát sinh trong tiến trình upload.', 'error');
        updateProgressBarIndicator('', 0);
      } finally {
        toggleButtonUIPendingState(triggerButton, false, 'Tạo hồ sơ dữ liệu & Đồng bộ');
      }
    }

    async function executionSequentialImagesUploadCore(filesArray) {
      const temporaryCollectedLinks = [];
      for (let idx = 0; idx < filesArray.length; idx++) {
        const individualProgressWeight = Math.round(((idx + 1) / filesArray.length) * 80);
        updateProgressBarIndicator(`Đang tải tệp tin hình ảnh lên Server Cloudinary (${idx + 1}/${filesArray.length})...`, individualProgressWeight);
        
        const receivedSecureUrlResult = await uploadSingleImageToCloudinaryEngine(filesArray[idx]);
        temporaryCollectedLinks.push(receivedSecureUrlResult);
      }
      return temporaryCollectedLinks;
    }

    async function uploadSingleImageToCloudinaryEngine(fileBlob) {
      const targetApiEndpointUrl = `https://api.cloudinary.com/v1_1/${encodeURIComponent(CONFIG.CLOUDINARY_CLOUD_NAME)}/image/upload`;
      const multiPartFormData = new FormData();
      multiPartFormData.append('file', fileBlob);
      multiPartFormData.append('upload_preset', CONFIG.CLOUDINARY_UPLOAD_PRESET);
      if (CONFIG.CLOUDINARY_FOLDER) {
        multiPartFormData.append('folder', CONFIG.CLOUDINARY_FOLDER);
      }

      const networkResponse = await fetch(targetApiEndpointUrl, { method: 'POST', body: multiPartFormData });
      const parsedTextResponse = await networkResponse.text();
      
      let convertedJSONData;
      try { convertedJSONData = JSON.parse(parsedTextResponse); } catch(err) { throw new Error('Phản hồi từ máy chủ Media Storage không đúng định dạng JSON chuẩn.'); }

      if (!networkResponse.ok || !convertedJSONData.secure_url) {
        throw new Error(convertedJSONData?.error?.message || 'Không thể đẩy dữ liệu hình ảnh lên Cloudinary.');
      }
      return convertedJSONData.secure_url;
    }

      dbNodeInstance.ref(`cases/${caseId}`).on('value', (dataSnapshot) => {

        if (!databaseValueObject) {
          renderErrorLayoutState('Hồ sơ giám định mục tiêu không tồn tại, sai định dạng khóa token hoặc đã bị hủy bỏ trên hệ thống.');
          return;
        }

        localActiveCaseNode = databaseValueObject;
        localActiveImageStack = Array.isArray(databaseValueObject.hinhAnh) ? databaseValueObject.hinhAnh : Object.values(databaseValueObject.hinhAnh || {});

        const shouldForceReadOnlyResultView = currentViewFlag === 'result';
        const isCaseLockedByGarageSubmission = localActiveCaseNode.trangThai === STATUS_COMPLETED;

        if (shouldForceReadOnlyResultView || isCaseLockedByGarageSubmission) {
          renderPortalResultReadOnlyView();

          renderPortalGarageInteractiveInputView();

        renderErrorLayoutState('Mất quyền truy cập dữ liệu hoặc lỗi kết nối máy chủ Firebase: ' + networkException.message);
      });

    async function pipelineTriggerGarageDataLockSubmission() {
      const DOMTextareaElements = Array.from(document.querySelectorAll('.garage-quote-textarea-node'));
      const emptyFieldsCounter = DOMTextareaElements.filter(tx => !tx.value.trim()).length;

      if (emptyFieldsCounter > 0) {
        const proceedBlank = await showConfirmModal('Phát hiện ô trống nội dung', `Hệ thống ghi nhận đang có ${emptyFieldsCounter} hình ảnh tổn thất để trống nội dung khai báo. Bạn vẫn muốn tiếp tục gửi đi?`);
        if (!proceedBlank) return;
      }

      const finalFreezeConfirmation = await showConfirmModal('Đóng băng hồ sơ báo giá', 'Sau khi xác nhận gửi, toàn bộ biểu mẫu hạng mục sẽ bị khóa tự động để chuyển tiếp cho Giám định viên công ty bảo hiểm đối chiếu. Xác nhận hoàn tất tiến trình gửi?');
      if (!finalFreezeConfirmation) return;

      const packagedItemsPayload = DOMTextareaElements.map(tx => {
        const numericIndex = Number(tx.dataset.indexToken);
        return {
          linkAnh: localActiveImageStack[numericIndex].linkAnh,
          hangMucBaoGia: tx.value.trim()
        };
      });

      try {
        await dbNodeInstance.ref(`cases/${localActiveCaseNode.idCa}`).update({
          hinhAnh: packagedItemsPayload,
          trangThai: STATUS_COMPLETED
        });

        triggerToast('Báo giá đã đóng băng và đồng bộ hóa thành công.');
        const finalizedResultUrl = `${getCleanOriginBaseUrl()}?idCa=${encodeURIComponent(localActiveCaseNode.idCa)}&view=result`;
        window.history.replaceState({}, '', finalizedResultUrl);
        evaluateViewRoutingState();
      } catch (err) {
        console.error(err);
        triggerToast('Giao dịch thất bại do mất kết nối hoặc xung đột: ' + err.message, 'error');
      }
    }

    }

    function compileRawTextSummaryReportBlock() {
      const node = localActiveCaseNode || {};
      const outputLinesBuffer = [];

      outputLinesBuffer.push('==================================================');
      outputLinesBuffer.push('   BIÊN BẢN TỔNG HỢP HẠNG MỤC PHƯƠNG TIỆN CƠ GIỚI   ');
      outputLinesBuffer.push('==================================================');
      outputLinesBuffer.push(`- Mã hồ sơ nghiệp vụ: ${node.idCa || ''}`);
      outputLinesBuffer.push(`- Biển kiểm soát xe:  ${node.bienSo || ''}`);
      outputLinesBuffer.push(`- Đơn vị báo giá:     ${node.tenGara || ''}`);
      outputLinesBuffer.push(`- Trạng thái dữ liệu: ${node.trangThai || ''}`);
      outputLinesBuffer.push('--------------------------------------------------\n');

      localActiveImageStack.forEach((item, index) => {
        outputLinesBuffer.push(`[VÙNG ẢNH KHAI BÁO SỐ ${index + 1}]`);
        outputLinesBuffer.push(`+ Chi tiết đề xuất sửa chữa: \n${item.hangMucBaoGia || 'Không ghi nhận hạng mục.'}`);
        outputLinesBuffer.push(`+ Đường dẫn ảnh gốc chứng cứ: ${item.linkAnh || ''}`);
        outputLinesBuffer.push('');
      });

      return outputLinesBuffer.join('\n');
    }

    function executeCopyAggregatedRawText() {
      executeTextCopyToClipboardRawString(compileRawTextSummaryReportBlock());
    }

    /****************************************************
     * GENERIC HELPERS UTILITY CORE ENGINE
     ****************************************************/
    function renderLoadingLayoutIndicator(friendlyMessage) {
      rootContainer.innerHTML = `
        <div class="p-card" style="text-align:center; padding:60px 20px;">
          <div class="spinner-premium"></div>
          <h3 style="font-size:16px; font-weight:700; margin-bottom:6px;">${escapeHtmlOutput(friendlyMessage)}</h3>
          <p style="font-size:13px; color:var(--text-muted);">Vui lòng giữ kết nối internet ổn định trong giây lát.</p>
        </div>
      `;
    }

    function renderErrorLayoutState(errorMessage) {
      rootContainer.innerHTML = `
        <div class="p-card" style="border-top: 4px solid var(--danger);">
          <div class="p-card-head">
            <h2 style="color:var(--danger)">Cảnh báo: Lỗi xung đột tiến trình kết nối mạng</h2>
            <p>Hệ thống không thể phản hồi yêu cầu dữ liệu hiện tại từ client.</p>
          </div>
          <div style="background:#fff5f5; border:1px solid #fed7d7; color:#c53030; padding:16px; border-radius:var(--radius-md); font-size:14px; font-weight:600; margin-bottom:20px;">
            ${escapeHtmlOutput(errorMessage)}
          </div>
          <div class="flex-actions-group">
            <button class="btn-premium" onclick="window.location.reload()">Thử tải lại trang</button>
            <button class="btn-premium btn-secondary" onclick="goHome()">Quay về Dashboard</button>
          </div>
        </div>
      `;
    }

    function renderFatalConfigurationFailure() {
      rootContainer.innerHTML = `
        <div class="p-card" style="border-top:4px solid var(--danger); margin-top:40px;">
          <h2 style="color:var(--danger); font-size:20px; font-weight:800;">Lỗi thiết lập mã nguồn phân quyền</h2>
          <p style="margin-top:10px; font-size:14px; color:var(--text-muted); line-height:1.6;">
            Hệ thống phát hiện cấu hình mã API Token trong đối tượng biến <strong>CONFIG.FIREBASE</strong> hoặc các thông số định danh tài khoản <strong>CLOUDINARY</strong> chưa được điền thông số thật, hoặc đang chứa chuỗi ký tự mặc định "PASTE_". Vui lòng kiểm tra lại cấu hình script trong file mã nguồn.
          </p>
        </div>
      `;
    }

    function updateProgressBarIndicator(statusMsg, percentageProgressValue) {
      const containerBar = document.getElementById('creationProgressContainer');
      const textLabel = document.getElementById('lblCreationStatus');
      const barFillNode = document.getElementById('creationProgressFill');
      
      if (!containerBar || !textLabel || !barFillNode) return;

      if (!statusMsg) {
        containerBar.classList.remove('active');
        textLabel.style.display = 'none';
        return;
      }
      containerBar.classList.add('active');
      textLabel.style.display = 'block';
      textLabel.textContent = statusMsg;
      barFillNode.style.width = `${Math.max(0, Math.min(100, percentageProgressValue))}%`;
    }

    function toggleButtonUIPendingState(buttonDomNode, isBusyState, overlayTextValue) {
      if (!buttonDomNode) return;
      if (isBusyState) {
        buttonDomNode.setAttribute('data-preserved-text', buttonDomNode.textContent);
        buttonDomNode.textContent = overlayTextValue;
        buttonDomNode.disabled = true;
      } else {
        buttonDomNode.textContent = buttonDomNode.getAttribute('data-preserved-text') || overlayTextValue;
        buttonDomNode.disabled = false;
      }
    }

    function executeTextCopyToClipboard(elementId) {
      const targetElement = document.getElementById(elementId);
      if (targetElement) executeTextCopyToClipboardRawString(targetElement.value || targetElement.textContent || '');
    }

    function executeTextCopyToClipboardRawString(textStringPayload) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textStringPayload)
          .then(() => triggerToast('Đã sao chép dữ liệu vào bộ nhớ tạm.'))
          .catch(() => fallbackExecutionTextCopyLegacy(textStringPayload));
      } else {
        fallbackExecutionTextCopyLegacy(textStringPayload);
      }
    }

    function fallbackExecutionTextCopyLegacy(fallbackText) {
      const transientTextarea = document.createElement('textarea');
      transientTextarea.value = fallbackText; transientTextarea.style.position = 'fixed'; transientTextarea.style.left = '-9999px';
      document.body.appendChild(transientTextarea); transientTextarea.focus(); transientTextarea.select();
      try { 
        document.execCommand('copy'); 
        triggerToast('Đã sao chép vào Clipboard hệ thống.'); 
      } catch (err) { 
        triggerToast('Trình duyệt không hỗ trợ sao chép tự động.', 'error'); 
      }
      document.body.removeChild(transientTextarea);
    }

    function openLightbox(imageSourceUrl) {
      const lightboxContainer = document.getElementById('lightbox');
      document.getElementById('lightboxImg').src = imageSourceUrl;
      lightboxContainer.classList.add('show');
    }

    function closeLightbox() {
      const lightboxContainer = document.getElementById('lightbox');
      lightboxContainer.classList.remove('show');
      document.getElementById('lightboxImg').src = '';
    }

    function getCleanOriginBaseUrl() {
      return window.location.href.split('?')[0].split('#')[0].replace(/index\.html$/i, '');
    }

    function isSystemConfigHealthy() {
      return (
        CONFIG.FIREBASE.apiKey && !CONFIG.FIREBASE.apiKey.includes('PASTE_') &&
        CONFIG.CLOUDINARY_CLOUD_NAME && !CONFIG.CLOUDINARY_CLOUD_NAME.includes('PASTE_')
      );
    }

    function escapeHtmlOutput(unsafeStringValue) {
      return String(unsafeStringValue || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function escapeAttributeData(unsafeAttrValue) { return escapeHtmlOutput(unsafeAttrValue); }
  </script>
</body>
